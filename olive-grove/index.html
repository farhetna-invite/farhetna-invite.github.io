<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olive Grove · فرحتنا</title>
<meta name="description" content="دعوة فرح تفاعلية من فرحتنا">
<meta name="theme-color" content="#f4ede1">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="img/scene.webp"><link rel="preload" as="image" href="img/paper.webp">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4ede1;--paper:#fbf7ef;--ink:#3f3a2e;--sub:#7d735f;--olive:#5b6b47;--olive2:#7d8a62;--wood:#7a5a3a;--gold:#b48a4a;--line:rgba(91,107,71,.25)}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Naskh Arabic",serif;background:var(--bg);color:var(--ink);line-height:1.8;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:inherit}
.flag{position:fixed;top:12px;right:12px;z-index:60;font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(251,247,239,.9);color:var(--olive)}
#mu{position:fixed;z-index:60;left:14px;top:12px;width:42px;height:42px;border-radius:50%;background:rgba(251,247,239,.9);color:var(--olive);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -8px rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .4s}
body.open #mu{opacity:1;pointer-events:auto}
#mu svg{width:18px;height:18px}#mu .pl{display:none}#mu.off .pa{display:none}#mu.off .pl{display:block}

/* gate: an embossed paper card. The top flap (arch scene, scalloped edge, seal) lifts away,
   the lower paper parts in a V, the garden path shows, then the couple's photo. */
#gate{position:fixed;inset:0;z-index:50;overflow:hidden;cursor:pointer;background:#efe4d1;-webkit-tap-highlight-color:transparent;transition:opacity 1s ease,visibility 0s 1s}
#gate .scene{position:absolute;inset:0;background:url(img/scene.webp) center 40%/cover no-repeat;transform:scale(1.1);filter:brightness(.9) saturate(.95);transition:transform 2.6s cubic-bezier(.2,.7,.2,1),filter 2s}
#gate .bot{position:absolute;inset:0;filter:drop-shadow(0 -6px 10px rgba(90,70,40,.28))}
#gate .bot i{position:absolute;inset:0;background:url(img/paper.webp) center bottom/cover no-repeat;transition:clip-path 1.5s cubic-bezier(.55,.05,.25,1) .35s,-webkit-clip-path 1.5s cubic-bezier(.55,.05,.25,1) .35s}
#gate .bot .l{clip-path:polygon(0 47%,50.2% 47%,50.2% 100%,0 100%);-webkit-clip-path:polygon(0 47%,50.2% 47%,50.2% 100%,0 100%)}
#gate .bot .r{clip-path:polygon(49.8% 47%,100% 47%,100% 100%,49.8% 100%);-webkit-clip-path:polygon(49.8% 47%,100% 47%,100% 100%,49.8% 100%)}
#gate .bot .seam{position:absolute;left:50%;top:47%;bottom:0;width:1px;background:rgba(120,95,60,.28);transition:opacity .3s .3s}
#gate .topw{position:absolute;inset:0;transition:transform 1.6s cubic-bezier(.6,.0,.3,1) .15s,opacity 1s .9s}
#gate .top{position:absolute;inset:0;background:url(img/scene.webp) center 40%/cover no-repeat;clip-path:url(#ogTop);-webkit-clip-path:url(#ogTop);filter:brightness(1.04) saturate(.9)}
#gate .rim{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#gate .seal{position:absolute;left:50%;top:59.5%;width:min(36vw,200px);aspect-ratio:1;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 12px rgba(80,50,10,.4))}
#gate .seal img{width:100%;height:100%;object-fit:contain;animation:breath 2.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
#gate .tap{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));text-align:center;transition:opacity .3s}
#gate .tap span{display:inline-block;padding:8px 18px;border-radius:99px;background:rgba(251,247,239,.9);color:var(--olive);font-size:14.5px;box-shadow:0 8px 20px -12px rgba(0,0,0,.4);animation:hint 2s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#gate.open .seal img{animation:none}
#gate.open .topw{transform:translateY(-68%);opacity:0}
#gate.open .bot .l{clip-path:polygon(0 47%,50.2% 80%,50.2% 100%,0 100%);-webkit-clip-path:polygon(0 47%,50.2% 80%,50.2% 100%,0 100%)}
#gate.open .bot .r{clip-path:polygon(49.8% 80%,100% 47%,100% 100%,49.8% 100%);-webkit-clip-path:polygon(49.8% 80%,100% 47%,100% 100%,49.8% 100%)}
#gate.open .bot .seam{opacity:0}
#gate.open .scene{transform:scale(1);filter:brightness(1) saturate(1)}
#gate.open .tap{opacity:0}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}

/* page */
.hero{position:relative;height:100svh;min-height:560px;background:#2a2316 center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;color:#fbf5e8;padding:0 20px calc(74px + env(safe-area-inset-bottom));overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,15,8,.0) 30%,rgba(20,15,8,.55) 72%,rgba(20,15,8,.75))}
.hero>*{position:relative;z-index:1}
.hero .k{font-size:14px;letter-spacing:.12em;opacity:.95}
.hero h1{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(48px,15vw,78px);line-height:1.12;margin:8px 0 4px;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.hero h1 i{display:block;font-family:"Pinyon Script",cursive;font-style:normal;font-size:.6em;color:#f1dfb4;line-height:1}
.hero .d{font-family:"Cormorant Garamond",serif;font-size:20px;letter-spacing:.2em}
.hero .sc{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:12.5px;opacity:.85;z-index:1;animation:hint 2s ease-in-out infinite}
body.open .hero .k,body.open .hero h1,body.open .hero .d{animation:up 1.4s cubic-bezier(.2,.8,.2,1) both}
body.open .hero h1{animation-delay:.25s}body.open .hero .d{animation-delay:.5s}
@keyframes up{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
body.open .hero{animation:hz 10s ease-out both}
@keyframes hz{from{background-size:auto 114%}to{background-size:auto 100%}}

main{position:relative;background:var(--bg)}
.sec{max-width:540px;margin:0 auto;padding:46px 22px;text-align:center;position:relative}
.kk{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17px;color:var(--olive2)}
h2{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:33px;line-height:1.35;color:var(--olive);margin:2px 0 12px}
.q{font-size:16px;color:var(--sub);font-style:italic;max-width:400px;margin:0 auto;white-space:pre-line}
.q::before{content:"«"}.q::after{content:"»"}
.txt{font-size:16.5px;color:var(--sub);white-space:pre-line}
.paper{background:var(--paper);border-radius:6px 26px 6px 26px;padding:26px 20px;box-shadow:0 18px 36px -28px rgba(60,50,20,.55);border:1px solid rgba(180,138,74,.18);position:relative}
.gar{display:block;width:min(88%,400px);margin:0 auto}
.bq{display:block;width:180px;margin:0 auto 4px}
/* story */
.st-h{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:12px}
.st-h img{width:52px;height:auto;filter:drop-shadow(0 4px 6px rgba(90,60,10,.25));animation:sway 4s ease-in-out infinite;transform-origin:50% 0}
.st-h img:last-child{animation-delay:-2s}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.st-h h2{margin:0}
.st-ph{position:relative;margin:22px auto 0;max-width:360px}
.st-ph img.p{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:28px;display:block;box-shadow:0 18px 36px -24px rgba(60,40,10,.6)}
.st-ph img.g{position:absolute;left:-6%;right:-6%;bottom:-38px;width:112%}
/* families */
.fam{position:relative;margin:26px auto 0;max-width:420px;padding-bottom:30%}
.fam .cards{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fam .cards div{background:var(--paper);border-radius:14px;padding:14px 8px 18px;box-shadow:0 10px 20px -16px rgba(60,40,10,.6)}
.fam .cards b{display:block;font-size:12.5px;letter-spacing:.08em;color:var(--wood);font-weight:700}
.fam .cards span{display:block;font-family:"Aref Ruqaa",serif;font-size:19px;color:var(--olive);line-height:1.5;white-space:pre-line;margin-top:4px}
.fam img.log{position:absolute;left:-4%;right:-4%;width:108%;bottom:0}
/* witnesses */
.heart{position:relative;width:min(88vw,370px);aspect-ratio:820/772;margin:6px auto 0}
.heart img{width:100%;height:100%;display:block}
.heart .in{position:absolute;inset:20% 22% 30%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.heart .in b{font-family:"Aref Ruqaa",serif;font-size:clamp(21px,6.4vw,28px);color:var(--olive);line-height:1.35;white-space:pre-line}
/* countdown */
.cd{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:300px;margin:14px auto 0}
.cd div{aspect-ratio:1;border-radius:50%;border:1.5px solid rgba(180,138,74,.6);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd b{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:46px;line-height:1;color:var(--olive)}
.cd span{font-size:12.5px;color:var(--sub);letter-spacing:.06em}
.today{font-family:"Aref Ruqaa",serif;font-size:28px;color:var(--olive)}
/* signpost */
.sign{position:relative;width:min(84vw,340px);aspect-ratio:749/1092;margin:14px auto 0}
.sign img{width:100%;height:100%;display:block}
.sign a{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#f8eedb;text-decoration:none;text-shadow:0 1px 2px rgba(40,20,0,.6);line-height:1.2;border-radius:6px}
.sign a b{font-family:"Aref Ruqaa",serif;font-size:clamp(17px,5.2vw,23px);font-weight:700}
.sign a span{font-size:11.5px;opacity:.9}
.sign a:active{background:rgba(255,240,210,.15)}
.sign .b1{left:38%;right:13%;top:14%;height:15.5%}.sign .b2{left:20%;right:14%;top:37%;height:15%}.sign .b3{left:19%;right:14%;top:55%;height:12%}
/* events */
.ev{margin:0 auto 26px;max-width:460px;text-align:center;padding:24px 16px 18px}
.ev h3{font-family:"Aref Ruqaa",serif;font-size:30px;color:var(--olive);margin-bottom:12px}
.ev img.ph{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:16px;display:block}
.ev .inf{margin:14px 0 12px;font-size:15.5px;color:var(--sub);line-height:1.9}
.ev .inf b{display:block;font-size:18px;color:var(--ink)}
.ev .phw{position:relative}
.ev .wel{position:absolute;left:21%;right:19%;top:20%;bottom:25%;display:flex;align-items:center;justify-content:center;font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(30px,10vw,46px);color:#fbf1dc;text-shadow:0 2px 3px rgba(60,30,5,.6),0 0 1px rgba(60,30,5,.8);transform:rotate(-1deg)}
.ev iframe{width:100%;height:190px;border:0;border-radius:14px;display:block;background:#e9e1d1}
.ev .btns{margin-top:12px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.bt{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:99px;font-size:14.5px;font-weight:600;text-decoration:none;background:var(--olive);color:#fbf5e8}
.bt.ln{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--olive)}
/* gallery */
.gal{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.gal img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:16px;display:block;box-shadow:0 14px 28px -22px rgba(60,40,10,.7)}
.gal img:first-child{grid-column:1/-1;aspect-ratio:4/5}
/* atmosphere */
.note{font-size:30px;color:var(--olive2)}
.hang{position:relative;max-width:330px;margin:10px auto 0;padding-top:46px}
.hang img.br{position:absolute;top:0;left:-8%;width:116%}
.hang .pp{position:relative;background:var(--paper);border-radius:4px;padding:22px 16px;box-shadow:0 14px 26px -18px rgba(60,40,10,.6);border:1px solid rgba(180,138,74,.25)}
.hang .pp::before,.hang .pp::after{content:"";position:absolute;top:-30px;width:1.5px;height:30px;background:rgba(122,90,58,.6)}
.hang .pp::before{left:22%}.hang .pp::after{right:22%}
.hang .pp i{display:block;font-style:normal;font-size:14px;color:var(--sub)}
.hang .pp b{display:block;font-family:"Aref Ruqaa",serif;font-size:26px;color:var(--olive);margin-top:2px}
.band{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;margin-top:18px;display:block;box-shadow:0 18px 32px -24px rgba(60,40,10,.7)}
/* rsvp */
form{text-align:right;margin-top:14px}
form label.l{display:block;font-size:13.5px;color:var(--sub);margin:14px 0 5px;letter-spacing:.02em}
form input[type=text],form textarea{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:#fffdf8;color:var(--ink);outline:none}
form textarea{min-height:80px;resize:vertical}
form input:focus,form textarea:focus{border-color:var(--olive)}
.yn{display:grid;gap:10px;margin-top:12px}
.yn button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;font-weight:600;color:var(--olive);background:#fffdf8}
.yn button i{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--olive2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:15px}
.yn button[aria-pressed=true]{background:rgba(91,107,71,.12);box-shadow:inset 0 0 0 1.5px var(--olive)}
.yn button[aria-pressed=true] i{background:var(--olive);color:#fff;box-shadow:none}
.yn button[aria-pressed=true] i::before{content:"✓"}
.ctr{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:10px;background:#fffdf8;padding:4px}
.ctr button{width:42px;height:40px;font-size:20px;color:var(--olive)}
.ctr b{font-size:19px}
.chk{display:flex;align-items:center;gap:10px;padding:12px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fffdf8;margin-top:10px;font-size:15px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--olive)}
.hide{display:none!important}
.send{width:100%;height:52px;margin-top:18px;border-radius:10px;background:var(--olive);color:#fbf5e8;font-size:17px;font-weight:700}
.send:disabled{opacity:.6}
.err{color:#b0412e;font-size:14px;margin-top:8px;text-align:center;min-height:1em}
.done b{display:block;font-family:"Aref Ruqaa",serif;font-size:30px;color:var(--olive)}.done p{color:var(--sub);margin:4px 0 10px}
.end{padding-bottom:110px}
.end .bl{font-family:"Aref Ruqaa",serif;font-size:22px;color:var(--sub)}
.end .nm{font-family:"Aref Ruqaa",serif;font-size:42px;color:var(--olive);line-height:1.3}
.end .nm i{display:block;font-style:normal;font-family:"Pinyon Script",cursive;color:var(--gold);font-size:.7em;line-height:1}
footer{text-align:center;font-size:13px;color:var(--sub);padding:0 0 40px}
footer a{color:var(--olive);text-decoration:none;font-weight:600}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}#gate .seal img,body.open .hero,.st-h img{animation:none}}
</style>
</head>

document.title="💌 "+G+" و"+B+" · دعوة فرح";
var day=dt.toLocaleDateString("ar-EG",{weekday:"long"}),dm=dt.toLocaleDateString("ar-EG",{day:"numeric",month:"long",year:"numeric"});
var two=function(n){return ar(n<10?"0"+n:n)};
/* events: each programme line "time - title @ place"; without a place it is at the main venue */
var EVIMG=["img/ev1.webp","img/ev2.webp","img/ev3.webp"];
var evs=(D.program||[]).filter(function(p){return p&&(p[0]||p[1])}).map(function(p){var t=String(p[1]||""),at=t.split(/\s*@\s*/);
  var place=at[1]||[D.venue,D.addr].filter(Boolean).join("، ");return{time:p[0],title:at[0]||"الاحتفال",place:place,own:!!at[1]}});
if(!evs.length)evs=[{time:D.time,title:"حفل الزفاف",place:[D.venue,D.addr].filter(Boolean).join("، "),own:false}];

var h="";
h+='<header class="hero" id="hero" style="background-image:url(\''+esc(D.hero||"img/hero.webp")+'\')"><div class="k">يسعدنا دعوتكم تشاركونا فرحتنا</div>'+
   '<h1>'+esc(G)+'<i>&amp;</i>'+esc(B)+'</h1><div class="d" dir="ltr">'+two(dt.getDate())+'‎ · ‎'+two(dt.getMonth()+1)+'‎ · ‎'+ar(dt.getFullYear())+'</div><div class="sc">انزلوا لتحت ↓</div></header>';
h+='<main id="main">';
if(D.story)h+='<section class="sec rv"><div class="st-h"><img src="img/lantern.webp" alt=""><h2>حكاية حبنا</h2><img src="img/lantern.webp" alt=""></div><div class="paper"><p class="txt">'+esc(D.story)+'</p></div>'+
  ((D.photos&&D.photos[0])?'<div class="st-ph"><img class="p" src="'+esc(D.photos[0])+'" alt=""><img class="g" src="img/garland.webp" alt=""></div>':'')+'</section>';
if(D.pGroom||D.pBride)h+='<section class="sec rv"><div class="kk">With love, by our side</div><h2>بمحبة، معانا</h2><p class="q">ولا حاجة كانت هتكمل من غير الناس اللي سندونا وعلّمونا الحب من غير شروط</p>'+
  '<div class="fam"><div class="cards"><div><b>أهل العروسة</b><span>'+esc(D.pBride)+'</span></div><div><b>أهل العريس</b><span>'+esc(D.pGroom)+'</span></div></div><img class="log" src="img/log.webp" alt=""></div></section>';
if(D.witnesses)h+='<section class="sec rv"><div class="kk">Our witnesses</div><h2>شهودنا</h2><div class="heart"><img src="img/heart.webp" alt=""><div class="in"><b>'+esc(D.witnesses)+'</b></div></div><p class="q">ممتنين لوجودكم جنبنا في أهم خطوة في حياتنا</p></section>';
h+='<section class="sec rv"><img class="gar" src="img/garland.webp" alt=""><div class="kk">Counting down</div><h2>فاضل على يومنا</h2><div class="cd" id="cd"><div><b id="cdD">٠</b><span>يوم</span></div><div><b id="cdH">٠</b><span>ساعة</span></div><div><b id="cdM">٠</b><span>دقيقة</span></div><div><b id="cdS">٠</b><span>ثانية</span></div></div><div class="today hide" id="today">النهارده يومنا 🤍</div></section>';
h+='<section class="sec rv"><p class="q">كل يوم بيقربنا أكتر من اللحظة اللي مستنيينها</p><img class="bq" src="img/bouquet.webp" alt="" style="margin-top:18px"><div class="kk">When &amp; where</div><h2>إمتى وفين</h2><p class="txt">هنا هنقول «قبلت»… وهنفضل نرقص لآخر الليل 🤍</p>';
h+='<div class="sign"><img src="img/sign.webp" alt="">';evs.slice(0,3).forEach(function(e,i){h+='<a class="b'+(i+1)+'" href="#ev'+i+'"><b>'+esc(e.title)+'</b><span>'+t12(e.time)+'</span></a>'});h+='</div></section>';
h+='<section class="sec" style="padding-top:0">';
evs.forEach(function(e,i){var q=encodeURIComponent(e.place||"");var link=(!e.own&&D.map)?D.map:("https://www.google.com/maps/search/?api=1&query="+q);
  h+='<article class="paper ev rv" id="ev'+i+'"><h3>'+esc(e.title)+'</h3><div class="phw"><img class="ph" src="'+EVIMG[i%3]+'" alt="" loading="lazy">'+(i%3===1?'<span class="wel">أهلًا بيكم</span>':'')+'</div>'+
   '<div class="inf"><b>📍 '+esc(e.place||"—")+'</b>'+esc(day)+' '+esc(dm)+'<br>الساعة '+t12(e.time)+'</div>'+
   (e.place?'<iframe loading="lazy" title="خريطة '+esc(e.title)+'" src="https://maps.google.com/maps?q='+q+'&z=15&output=embed" referrerpolicy="no-referrer-when-downgrade"></iframe>':'')+
   '<div class="btns"><a class="bt" href="'+esc(link)+'" target="_blank" rel="noopener">افتحوا في الخريطة ↗</a></div></article>'});
h+='<div class="btns rv"><button class="bt ln" id="ics" type="button">ضيفوا الفرح للتقويم 🗓️</button></div></section>';
var ph=(D.photos||[]).filter(Boolean).slice(D.story?1:0);if(ph.length>5)ph=ph.slice(0,5);
if(ph.length)h+='<section class="sec rv"><img class="bq" src="img/bouquet.webp" alt=""><div class="kk">Moments</div><h2>لحظات بتعرّفنا</h2><p class="q">حتة من حكايتنا، متصورة في لقطات دافية</p><div class="gal">'+ph.map(function(u){return'<img src="'+esc(u)+'" alt="" loading="lazy">'}).join("")+'</div></section>';
if(D.band)h+='<section class="sec rv"><div class="note">♫</div><h2>الأجواء</h2><div class="hang"><img class="br" src="img/garland.webp" alt=""><div class="pp"><i>الأجواء هتبقى مع</i><b>'+esc(D.band)+'</b></div></div><img class="band" src="img/band.webp" alt="" loading="lazy"></section>';
if(D.notes||D.attire)h+='<section class="sec rv"><div class="paper"><div class="kk">Notes</div><h2>قبل ما تيجوا</h2>'+(D.attire?'<p class="txt">👗 '+esc(D.attire)+'</p>':'')+(D.notes?'<p class="txt">'+esc(D.notes)+'</p>':'')+'</div></section>';
h+='<section class="sec rv"><div class="kk">Kindly reply</div><h2>مستنيين تأكيدكم</h2><p class="txt">وجودكم جزء من فرحتنا… قولولنا هتكونوا معانا؟</p><div class="paper" style="margin-top:16px">'+
  '<form id="rf" novalidate><label class="l" for="rn">الاسم أو اسم العيلة</label><input type="text" id="rn" autocomplete="name" placeholder="اكتب اسمك">'+
  '<div class="yn"><button type="button" data-a="1" aria-pressed="true"><i></i>أيوه، هحضر</button><button type="button" data-a="0" aria-pressed="false"><i></i>للأسف، مش هقدر</button></div>'+
  '<div id="cntBox"><label class="l">الكبار</label><div class="ctr"><button type="button" data-c="ad" data-d="-1">−</button><b id="ad">١</b><button type="button" data-c="ad" data-d="1">+</button></div>'+
  '<label class="l">الأطفال</label><div class="ctr"><button type="button" data-c="ki" data-d="-1">−</button><b id="ki">٠</b><button type="button" data-c="ki" data-d="1">+</button></div>'+
  '<label class="chk"><input type="checkbox" id="tr"> محتاجين مواصلات</label><label class="chk"><input type="checkbox" id="st"> محتاجين إقامة</label></div>'+
  '<label class="l" for="rm">رسالة لينا (اختياري)</label><textarea id="rm" placeholder="ألف مبروك 🤍"></textarea>'+
  '<button class="send" id="send" type="submit"><span>تأكيد الحضور</span></button><div class="err" id="err"></div></form>'+
  '<div class="done hide" id="done"><b id="dBig"></b><p id="dSub"></p><div class="btns"><a class="bt hide" id="dWa" target="_blank" rel="noopener">ابعته كمان على واتساب</a><button class="bt ln" id="dEdit" type="button">تعديل الرد</button></div></div></div></section>';
h+='<section class="sec end rv"><img class="gar" src="img/garland.webp" alt=""><div class="bl">بكل حب،</div><div class="nm">'+esc(G)+'<i>&amp;</i>'+esc(B)+'</div></section>';
h+='<footer>دعوة من <a href="https://farhetnainvite.com/" target="_blank" rel="noopener">فرحتنا</a> 🤍</footer></main>';
$("app").innerHTML=h;

function tick(){var s=Math.max(0,Math.floor((dt-new Date())/1000));if(!s){$("cd").classList.add("hide");$("today").classList.remove("hide");return}
  $("cdD").textContent=ar(Math.floor(s/86400));$("cdH").textContent=ar(Math.floor(s%86400/3600));$("cdM").textContent=ar(Math.floor(s%3600/60));$("cdS").textContent=ar(s%60)}
tick();setInterval(tick,1000);
document.querySelectorAll('.sign a').forEach(function(a){a.onclick=function(e){e.preventDefault();var t=document.querySelector(a.getAttribute("href"));if(t){t.classList.add("in");t.scrollIntoView({behavior:"smooth",block:"start"})}}});
$("ics").onclick=function(){var z=function(d){return d.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"")},e=new Date(+dt+5*3600e3),q=function(x){return String(x||"").replace(/([,;\\])/g,"\\$1")},title="فرح "+G+" و"+B;
  var c=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Farhetna//Invite//AR","BEGIN:VEVENT","UID:"+z(dt)+"-"+Math.random().toString(36).slice(2)+"@farhetna","DTSTAMP:"+z(new Date()),"DTSTART:"+z(dt),"DTEND:"+z(e),
    "SUMMARY:"+q(title),"LOCATION:"+q([D.venue,D.addr].filter(Boolean).join(" - ")),"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+q(title),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  var u=URL.createObjectURL(new Blob([c],{type:"text/calendar;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="wedding.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)};

var io=("IntersectionObserver"in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.1}):null;
function watch(){document.querySelectorAll("#main .rv:not(.in)").forEach(function(e){if(io)io.observe(e);else e.classList.add("in")})}

var au=$("bgm");if(D.music==="none"){au.removeAttribute("src");$("mu").hidden=true}else if(D.music)au.src=D.music;
var playing=false;function setMu(on){playing=on;$("mu").classList.toggle("off",!on);if(on){au.volume=0;var p=au.play();if(p&&p.catch)p.catch(function(){playing=false;$("mu").classList.add("off")});var v=0,f=setInterval(function(){v+=.05;au.volume=Math.min(.8,v);if(v>=.8)clearInterval(f)},120)}else au.pause()}
$("mu").onclick=function(){setMu(!playing)};

var opened=false;function open(){if(opened)return;opened=true;var g=$("gate");g.classList.add("open");if(D.music!=="none")setMu(true);if(navigator.vibrate)navigator.vibrate(12);
  setTimeout(function(){document.body.classList.remove("locked");document.body.classList.add("open");$("app").removeAttribute("aria-hidden");g.classList.add("gone");watch()},2500)}
$("gate").addEventListener("click",open);$("gate").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});

/* RSVP: adults + children; children and the transport / stay requests go into the note the couple sees */
var att=true,C={ad:1,ki:0},DEV=(function(){try{var k="farhetna_dev",v=localStorage.getItem(k);if(!v){v=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,v)}return v}catch(e){return""}})();
var RK="farhetna_rsvp_olg_"+(D.slug||G+D.date);
document.querySelectorAll(".yn button").forEach(function(b){b.onclick=function(){att=b.getAttribute("data-a")==="1";document.querySelectorAll(".yn button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});$("cntBox").classList.toggle("hide",!att)}});
function showC(){$("ad").textContent=ar(C.ad);$("ki").textContent=ar(C.ki)}
document.querySelectorAll(".ctr button").forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-c"),d=+b.getAttribute("data-d");C[k]=Math.max(k==="ad"?1:0,Math.min(15,C[k]+d));showC()}});
function extra(r){var x=[];if(r.yes){if(r.kids)x.push("أطفال: "+r.kids);if(r.tr)x.push("محتاجين مواصلات");if(r.st)x.push("محتاجين إقامة")}return x.join(" · ")}
function waLink(r){var wa=String(D.wa||"").replace(/\D/g,"");if(!wa)return"";if(/^0/.test(wa))wa="2"+wa;
  var m=r.yes?("السلام عليكم 🤍\nأنا "+r.name+"، وبأكد حضوري فرح "+B+" و"+G+" إن شاء الله\nالكبار: "+r.adults+(r.kids?"\nالأطفال: "+r.kids:"")):("السلام عليكم 🤍\nأنا "+r.name+"، وللأسف مش هقدر أحضر فرح "+B+" و"+G+". ألف مبروك!");
  var x=extra(r);if(x&&r.yes)m+="\n"+x;if(r.msg)m+="\n\n"+r.msg;return"https://wa.me/"+wa+"?text="+encodeURIComponent(m)}
function done(r,sub){$("rf").classList.add("hide");$("done").classList.remove("hide");$("dBig").textContent=r.yes?"مستنيينكم 🤍":"هتوحشونا";$("dSub").textContent=sub||"شكرًا إنكم عرّفتونا. تقدروا تعدّلوا الرد في أي وقت.";
  var w=waLink(r);$("dWa").classList.toggle("hide",!w||MODE!=="live");if(w)$("dWa").href=w}
$("dEdit").onclick=function(){$("done").classList.add("hide");$("rf").classList.remove("hide")};
try{var prev=JSON.parse(localStorage.getItem(RK)||"null");if(prev&&MODE==="live"){$("rn").value=prev.name;C.ad=prev.adults||1;C.ki=prev.kids||0;showC();$("tr").checked=!!prev.tr;$("st").checked=!!prev.st;$("rm").value=prev.msg||"";document.querySelector('.yn button[data-a="'+(prev.yes?1:0)+'"]').click();done(prev,"ردكم وصل قبل كده. تقدروا تعدّلوه في أي وقت.")}}catch(e){}
$("rf").onsubmit=function(e){e.preventDefault();var r={name:$("rn").value.trim(),yes:att,adults:att?C.ad:0,kids:att?C.ki:0,tr:att&&$("tr").checked,st:att&&$("st").checked,msg:$("rm").value.trim()};$("err").textContent="";
  if(r.name.length<2){$("err").textContent="اكتبوا الاسم من فضلكم";$("rn").focus();return}
  if(MODE!=="live"){done(r,MODE==="preview"?"ده عرض معاينة، فالرد مش بيتسجل.":"دي دعوة تجريبية، فالرد مش بيتسجل. في الدعوة الحقيقية بيوصل للعروسين.");return}
  var btn=$("send"),lbl=btn.querySelector("span");btn.disabled=true;lbl.textContent="بنبعت ردكم…";var fin=function(){btn.disabled=false;lbl.textContent="تأكيد الحضور"};
  var toWa=function(){var w=waLink(r);if(w){$("err").textContent="هنحوّلكم لواتساب تبعتوا الرد…";setTimeout(function(){location.href=w},800)}else $("err").textContent="معرفناش نسجّل الرد. اتأكدوا من النت وجربوا تاني.";fin()};
  if(!D.slug){toWa();return}
  var note=[extra(r),r.msg].filter(Boolean).join("\n");
  fetch(SB.url+"/rest/v1/rpc/add_rsvp",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.key,Authorization:"Bearer "+SB.key},body:JSON.stringify({p_slug:D.slug,p_name:r.name,p_attending:r.yes,p_guests:r.adults+r.kids,p_note:note,p_device:DEV})})
  .then(function(res){if(!res.ok)throw new Error(res.status);try{localStorage.setItem(RK,JSON.stringify(r))}catch(e){}fin();done(r)}).catch(toWa)};
})();
</script>
