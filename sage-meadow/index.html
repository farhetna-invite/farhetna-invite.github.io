<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sage Meadow · فرحتنا</title>
<meta name="theme-color" content="#f4efe6">
<meta name="robots" content="noindex">
<link rel="preload" as="image" href="img/envelope.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--ivory:#f4efe6;--ivory2:#faf7f1;--sage:#8a9a74;--sage2:#6d8160;--sage3:#4e5f45;--deep:#3c4636;--ink:#3e4339;--mute:#8a8b80;--gold:#a8946c;--line:rgba(78,95,69,.2);
  --ar:"Noto Naskh Arabic",serif;--ruq:"Aref Ruqaa","Noto Naskh Arabic",serif;--en:"Cormorant Garamond",Georgia,serif;--scr:"Pinyon Script","Cormorant Garamond",cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-feature-settings:"lnum" 1!important}
html{background:var(--ivory)}
body{font-family:var(--en);font-size:18px;color:var(--ink);line-height:1.6;overflow-x:hidden;background:var(--ivory)}
html[lang=ar] body{font-family:var(--ar);font-size:16px;line-height:1.9}
body.locked{overflow:hidden;height:100vh}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.kick{font:600 11.5px var(--en);letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
html[lang=ar] .kick{font:500 13px var(--ar);letter-spacing:0}
.scr{font:400 46px/1.15 var(--scr);color:var(--deep)}
html[lang=ar] .scr{font:400 36px/1.5 var(--ruq)}

/* controls */
.ctl{position:fixed;z-index:70;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(250,247,241,.86);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;cursor:pointer;color:var(--sage3);box-shadow:0 4px 14px rgba(60,70,50,.12)}
#lg{top:max(14px,env(safe-area-inset-top));right:14px;font:600 14px var(--en)}
html[lang=en] #lg{font:500 17px var(--ar)}
#mu{bottom:max(16px,env(safe-area-inset-bottom));right:14px}
#mu svg{width:20px;height:20px}
#mu .bars rect{transform-origin:center bottom;animation:eq 1s ease-in-out infinite}
#mu .bars rect:nth-child(2){animation-delay:-.4s}#mu .bars rect:nth-child(3){animation-delay:-.7s}#mu .bars rect:nth-child(4){animation-delay:-.2s}
#mu.off .bars rect{animation:none;transform:scaleY(.35)}
@keyframes eq{50%{transform:scaleY(.35)}}
.flag{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:70;background:var(--sage3);color:#fff;font:500 12px var(--ar);padding:5px 12px;border-radius:20px}

/* ---------- 1 · envelope ---------- */
#gate{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 45%,#f7f3ec,#efe8dd);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 0;cursor:pointer;transition:opacity 1.1s ease,visibility 1.1s}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}
.g-kick{font:600 12px var(--en);letter-spacing:.42em;text-transform:uppercase;color:#9a958a;margin-bottom:6px;transition:opacity .6s}
html[lang=ar] .g-kick{font:500 14px var(--ar);letter-spacing:0}
.g-names{font:400 clamp(40px,11.5vw,54px)/1.2 var(--scr);color:var(--deep);white-space:nowrap;margin-bottom:22px;transition:opacity .6s}
.g-names i{font-style:normal;color:var(--gold);font-size:.62em;margin:0 .1em}
html[lang=ar] .g-names{font:400 clamp(34px,9.5vw,44px)/1.5 var(--ruq)}
.g-env{position:relative;width:min(96vw,460px);aspect-ratio:1200/800;container-type:inline-size;transition:transform 1.2s cubic-bezier(.3,.7,.2,1),opacity 1s ease,filter 1s ease}
.g-env img{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 24px rgba(70,70,50,.18));
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(transparent,#000 5%,#000 95%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent),linear-gradient(transparent,#000 5%,#000 95%,transparent);mask-composite:intersect}
/* letters pressed into the copper seal (flex-centred box; no transforms → exact on iPhone) */
.seal{position:absolute;left:calc(51.1% - 7cqw);top:calc(56.2% - 7cqw);width:14cqw;height:14cqw;display:flex;align-items:center;justify-content:center;pointer-events:none}
.seal span{font:600 4.6cqw/1 var(--en);color:#7c4421;letter-spacing:.02em;white-space:nowrap;direction:ltr;
  text-shadow:0 .18cqw 0 rgba(255,214,170,.55),0 -.12cqw 0 rgba(70,30,8,.55)}
html[lang=ar] .seal span{font:400 4.2cqw/1.3 var(--ruq);direction:rtl}
.seal .in{animation:beat 2.6s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.08)}}
.g-tap{display:flex;align-items:center;gap:12px;margin-top:22px;font:600 12px var(--en);letter-spacing:.36em;text-transform:uppercase;color:#7d7b70;transition:opacity .5s}
.g-tap::before,.g-tap::after{content:"";width:26px;height:1px;background:#a9a597}
html[lang=ar] .g-tap{font:500 14px var(--ar);letter-spacing:0}
#gate.s1 .g-env{transform:scale(1.07);filter:brightness(1.12) saturate(.7);opacity:0}
#gate.s1 .g-kick,#gate.s1 .g-names,#gate.s1 .g-tap{opacity:0}
#gate.s1 .seal .in{animation:none}

/* ---------- 2 · collage ---------- */
#hero{position:relative;background:#faefdc url(img/hills.webp) center bottom/100% auto no-repeat;overflow:hidden}
#hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:40px;background:linear-gradient(transparent,#9ca067)}
.colwrap{container-type:inline-size;width:min(100vw,480px,calc((100svh - 34px)/1.8));margin:0 auto}
.col{position:relative;width:100%;height:calc(100cqw * 1.8);container-type:inline-size}
.pc{position:absolute;transform:rotate(var(--r,0deg));opacity:0;transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.9,.25,1.15)}
.pc:not(.on){transform:translateY(-9cqw) rotate(calc(var(--r,0deg) - 9deg)) scale(1.08)}
.pc.on{opacity:1}
.pc img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.tapx{cursor:pointer}
.tapx:active{filter:brightness(.97)}
.shadow{filter:drop-shadow(0 1.2cqw 1.6cqw rgba(50,55,35,.22))}
/* photo strip */
.strip{background:#fdfcf9;padding:1.6cqw 1.6cqw 4cqw;box-shadow:0 1.2cqw 2.4cqw rgba(50,55,35,.22)}
.strip i{display:block;aspect-ratio:4/3.3;background:#ddd center/cover;margin-bottom:1.4cqw}
/* date card */
.dcard{background:#fbf8f2;box-shadow:0 1.4cqw 2.6cqw rgba(50,55,35,.22);padding:2.2cqw;text-align:center}
.dcard .in{border:.35cqw solid #3f4639;outline:.2cqw solid #3f4639;outline-offset:-1.6cqw;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4cqw 2cqw;
  clip-path:polygon(3.4cqw 0,calc(100% - 3.4cqw) 0,100% 3.4cqw,100% calc(100% - 3.4cqw),calc(100% - 3.4cqw) 100%,3.4cqw 100%,0 calc(100% - 3.4cqw),0 3.4cqw)}
.dcard b{font:500 12cqw/1 var(--en);color:#2f342b}
.dcard span{font:500 4.3cqw/1.3 var(--en);letter-spacing:.08em;text-transform:uppercase;color:#2f342b;margin:1cqw 0}
html[lang=ar] .dcard span{font:500 4.4cqw/1.5 var(--ar);letter-spacing:0;text-transform:none}
.dcard em{font:500 10.5cqw/1 var(--en);font-style:normal;color:#2f342b}
/* doily (image rotated to stand up) */
.doily{display:flex;align-items:center;justify-content:center;text-align:center}
.doily img{position:absolute;width:150%;height:auto;max-width:none;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg);filter:drop-shadow(0 1cqw 1.4cqw rgba(50,55,35,.2))}
.doily .tx{position:relative;color:#3a3f35}
.doily .tx{max-width:24cqw}
.doily .k{font:600 2.2cqw/1.5 var(--en);letter-spacing:.14em;text-transform:uppercase}
html[lang=ar] .doily .k{font:500 3cqw/1.6 var(--ar);letter-spacing:0}
.doily .n{font:400 7cqw/1.05 var(--scr);margin-top:1.6cqw}
.doily .n i{display:block;font-size:.6em;font-style:normal;color:var(--gold);margin:.5cqw 0}
html[lang=ar] .doily .n{font:400 6.4cqw/1.3 var(--ruq)}
/* scalloped venue tag */
.tag{display:flex;align-items:center;justify-content:center;text-align:center;color:#f6f1e6;padding:4cqw 4.6cqw}
.tag svg{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 1cqw 1.4cqw rgba(40,50,30,.25))}
.tag .tx{position:relative}
.tag .k{font:600 1.9cqw/1.4 var(--en);letter-spacing:.12em;text-transform:uppercase}
html[lang=ar] .tag .k{font:500 2.6cqw/1.5 var(--ar);letter-spacing:0}
.tag .v{font:400 4.4cqw/1.05 var(--scr);margin:.6cqw 0}
html[lang=ar] .tag .v{font:400 3.6cqw/1.35 var(--ruq)}
.tag .c{font:600 1.8cqw/1.4 var(--en);letter-spacing:.08em;text-transform:uppercase}
html[lang=ar] .tag .c{font:500 2.4cqw/1.4 var(--ar);letter-spacing:0}
/* polaroids */
.pola{background:#fdfcf9;padding:1.8cqw 1.8cqw 0;box-shadow:0 1.4cqw 2.6cqw rgba(50,55,35,.24);text-align:center}
.pola i{display:block;background:#ccc center/cover}
.pola .cap{font:500 4.4cqw/1 var(--en);letter-spacing:.06em;text-transform:uppercase;color:#2f342b;padding:2.8cqw 0 3cqw}
.pola .cap s{text-decoration:none;font:400 5.2cqw var(--scr);text-transform:none;letter-spacing:0;margin-inline-end:1.4cqw}
html[lang=ar] .pola .cap{font:500 4cqw/1.2 var(--ar);letter-spacing:0}
html[lang=ar] .pola .cap s{font:400 4.6cqw var(--ruq)}
/* rsvp envelope on the tray */
.renv{text-align:center}
.renv .t1{position:absolute;left:0;right:0;top:12%;font:400 8.4cqw/1 var(--scr);color:#2f342b}
html[lang=ar] .renv .t1{font:400 5.8cqw/1.4 var(--ruq)}
.renv .sl{position:absolute;left:calc(49.4% - 4.2cqw);top:calc(63.4% - 4.2cqw);width:8.4cqw;height:8.4cqw;display:flex;align-items:center;justify-content:center}
.renv .sl span{font:600 2.5cqw/1 var(--en);color:#7c4421;text-shadow:0 .14cqw 0 rgba(255,214,170,.55),0 -.1cqw 0 rgba(70,30,8,.55);direction:ltr;white-space:nowrap}
html[lang=ar] .renv .sl span{font:400 2.3cqw/1.3 var(--ruq)}
.renv .t2{position:absolute;left:0;right:0;bottom:6%;font:600 2.1cqw var(--en);letter-spacing:.2em;text-transform:uppercase;color:#6c685d}
html[lang=ar] .renv .t2{font:500 2.6cqw var(--ar);letter-spacing:0}
/* details card with torn edges + sage backing */
.back{background:#8f9d78;box-shadow:0 1.2cqw 2.4cqw rgba(50,55,35,.2)}
.det{background:#fbf8f1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7cqw;text-align:center;color:#2f342b;
  clip-path:polygon(0 1%,6% 0,13% 1.2%,21% .2%,30% 1%,38% 0,47% 1.1%,55% .3%,63% 1.2%,72% 0,80% 1%,88% .2%,95% 1%,100% 0,99% 8%,100% 17%,99.2% 27%,100% 38%,99% 49%,100% 60%,99.3% 71%,100% 82%,99% 92%,100% 100%,93% 99%,85% 100%,76% 99.2%,67% 100%,58% 99%,49% 100%,40% 99.1%,31% 100%,22% 99%,13% 100%,5% 99.2%,0 100%,1% 91%,0 81%,.8% 70%,0 59%,1% 48%,0 37%,.9% 26%,0 15%)}
.det .k{font:600 2.1cqw var(--en);letter-spacing:.2em;text-transform:uppercase;color:#6c685d}
html[lang=ar] .det .k{font:500 2.7cqw var(--ar);letter-spacing:0}
.det .w{font:500 5.8cqw/1 var(--en);letter-spacing:.04em;text-transform:uppercase;margin-top:6cqw}
.det .d{font:400 7.2cqw/1 var(--scr);margin-top:.8cqw}
html[lang=ar] .det .w{font:400 5.2cqw/1.4 var(--ruq);text-transform:none;letter-spacing:0}
html[lang=ar] .det .d{font:500 3.8cqw/1.4 var(--ar);margin-top:1.4cqw}
.hint{position:absolute;width:4.4cqw;height:4.4cqw;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 0 0 0 rgba(255,255,255,.7);animation:ping 2.2s ease-out infinite;pointer-events:none}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,255,255,.75)}80%,100%{box-shadow:0 0 0 4cqw rgba(255,255,255,0)}}

/* countdown on the hills */
.cdw{position:relative;z-index:2;padding:0 20px 46px;text-align:center}
.cd{display:flex;justify-content:center;gap:9px;direction:ltr}
.cd div{width:74px;padding:13px 0 9px;border-radius:12px;background:rgba(250,247,241,.92);box-shadow:0 6px 16px rgba(40,50,30,.14)}
.cd b{display:block;font:500 32px/1 var(--en);color:var(--deep)}
.cd span{font:600 9.5px var(--en);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
html[lang=ar] .cd span{font:500 11px var(--ar);letter-spacing:0}
.cd-done{font:400 34px var(--scr);color:#fff}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 22px;border-radius:30px;border:1px solid rgba(255,255,255,.85);background:rgba(250,247,241,.22);
  color:#fff;font:600 11.5px var(--en);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;margin-top:16px}
html[lang=ar] .pill{font:500 14px var(--ar);letter-spacing:0}
.pill svg{width:15px;height:15px}
.pill.dark{background:var(--sage2);border-color:var(--sage2);color:#fff;box-shadow:0 6px 16px rgba(78,95,69,.25)}
.gl{display:block;margin-top:8px;font-size:13px;color:rgba(255,255,255,.9)}

/* sections */
section.s{position:relative;padding:62px 26px;text-align:center;overflow:hidden}
.ivory{background:var(--ivory)}
.rv{opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}
/* order of the day */
.tl{position:relative;max-width:330px;margin:24px auto 0}
.tl::before{content:"";position:absolute;top:10px;bottom:10px;left:calc(42% + 20px);width:1px;background:var(--line)}
html[dir=rtl] .tl::before{left:auto;right:calc(42% + 20px)}
.ti{display:grid;grid-template-columns:42% 40px 1fr;align-items:center;gap:0;min-height:62px}
.ti .t{font:500 21px var(--en);color:var(--ink);text-align:end;padding-inline-end:14px}
html[lang=ar] .ti .t{font:500 16px var(--ar)}
.ti .ic{position:relative;z-index:1;width:40px;height:40px;border-radius:50%;background:var(--ivory2);border:1px solid var(--line);display:grid;place-items:center;color:var(--sage3)}
.ti .ic svg{width:20px;height:20px}
.ti .l{font:600 10.5px/1.5 var(--en);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);text-align:start;padding-inline-start:14px}
html[lang=ar] .ti .l{font:500 14px/1.5 var(--ar);letter-spacing:0}
/* venue */
.vn{font:500 24px/1.3 var(--en);color:var(--ink);margin-top:16px}
html[lang=ar] .vn{font:500 21px/1.5 var(--ar)}
.vc{font:600 11px var(--en);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-top:2px}
html[lang=ar] .vc{font:500 14px var(--ar);letter-spacing:0}
.map{position:relative;max-width:360px;margin:22px auto 0;border-radius:16px;overflow:hidden;border:6px solid #fff;box-shadow:0 10px 26px rgba(60,70,50,.16);aspect-ratio:1.35;background:#e9e6dc}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.map .ph{position:absolute;inset:0;display:block;text-decoration:none}
.map .ph svg{width:100%;height:100%;display:block}
.map .chip{position:absolute;top:10px;left:10px;background:#fff;color:#1a73e8;font:600 12.5px system-ui,-apple-system,sans-serif;padding:6px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2);display:flex;gap:5px;align-items:center}
html[dir=rtl] .map .chip{left:auto;right:10px}
/* dress */
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:24px auto 18px;max-width:320px}
.dots i{width:46px;height:46px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06),0 4px 10px rgba(60,70,50,.12)}
.dnote{max-width:30ch;margin:0 auto;font-style:italic;color:var(--mute);font-size:17px}
html[lang=ar] .dnote{font-style:normal;font-size:15px}
/* rsvp green */
#rsvp{background:var(--sage2);color:#f6f1e6;padding-bottom:70px}
#rsvp .kick{color:#e3dcc8}
#rsvp .scr{color:#fff}
.leafbg{position:absolute;inset:0;pointer-events:none;opacity:.14;background:
  radial-gradient(ellipse 9px 4px at 12% 18%,#fff 98%,transparent),radial-gradient(ellipse 9px 4px at 84% 30%,#fff 98%,transparent),radial-gradient(ellipse 9px 4px at 30% 80%,#fff 98%,transparent),radial-gradient(ellipse 9px 4px at 70% 88%,#fff 98%,transparent)}
.card{position:relative;max-width:350px;margin:26px auto 0;background:var(--ivory2);color:var(--ink);padding:44px 24px 40px;text-align:start;
  -webkit-mask:radial-gradient(9px at 50% 0,transparent 98%,#000) 50% 0/22px 51% repeat-x,radial-gradient(9px at 50% 100%,transparent 98%,#000) 50% 100%/22px 51% repeat-x;
  mask:radial-gradient(9px at 50% 0,transparent 98%,#000) 50% 0/22px 51% repeat-x,radial-gradient(9px at 50% 100%,transparent 98%,#000) 50% 100%/22px 51% repeat-x}
#rsvp .card .scr{text-align:center;color:var(--deep);font-size:44px}
.card .sub{text-align:center;font:600 10px/1.6 var(--en);letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:4px 0 22px}
html[lang=ar] .card .sub{font:500 13px/1.6 var(--ar);letter-spacing:0}
.lbl{display:block;font:600 10px var(--en);letter-spacing:.22em;text-transform:uppercase;color:var(--mute);margin:16px 0 6px}
html[lang=ar] .lbl{font:500 13px var(--ar);letter-spacing:0}
.u{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;padding:8px 2px;font-size:17px;outline:none;border-radius:0}
.u:focus{border-bottom-color:var(--sage2)}
textarea.u{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{min-height:44px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;padding:4px}
.two button[aria-pressed=true]{background:var(--sage2);border-color:var(--sage2);color:#fff}
.step{display:flex;align-items:center;gap:14px}
.step button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;color:var(--sage3);cursor:pointer}
.step b{font:500 22px var(--en);min-width:24px;text-align:center}
.send{width:100%;margin-top:24px;min-height:48px;border-radius:30px;border:0;background:var(--sage3);color:#fff;font:600 12px var(--en);letter-spacing:.24em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 16px rgba(60,75,55,.25)}
html[lang=ar] .send{font:500 15px var(--ar);letter-spacing:0}
.send[disabled]{opacity:.6}
.err{color:#a14a4a;font-size:14px;min-height:1.2em;text-align:center;margin-top:10px}
.done{text-align:center;padding:10px 0}
.done svg{width:46px;height:46px;color:var(--sage2)}
.done .big{font:400 34px/1.3 var(--scr);color:var(--deep);margin:6px 0}
html[lang=ar] .done .big{font:400 26px/1.5 var(--ruq)}
.done p{color:var(--mute);font-size:15px}
.done .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.btn2{display:inline-flex;align-items:center;min-height:40px;padding:0 18px;border-radius:30px;border:1px solid var(--sage2);background:transparent;color:var(--sage3);font-size:14px;text-decoration:none;cursor:pointer}
.after{margin-top:26px;font-style:italic;color:#eee7d6;font-size:17px}
html[lang=ar] .after{font-style:normal;font-size:15px}
/* wishes & memories */
.box{max-width:360px;margin:20px auto 0;background:#fffdf9;border-radius:18px;box-shadow:0 8px 24px rgba(60,70,50,.08);border:1px solid rgba(78,95,69,.08);padding:20px;text-align:start}
.bh{display:flex;gap:12px;align-items:center}
.bh .ic{flex:none;width:38px;height:38px;border-radius:10px;background:#eef0e6;display:grid;place-items:center;color:var(--sage3)}
.bh .ic svg{width:18px;height:18px}
.bh b{display:block;font:500 20px/1.2 var(--en);color:var(--ink)}
html[lang=ar] .bh b{font:600 16px/1.4 var(--ar)}
.bh small{font-size:13px;color:var(--mute)}
.mic{display:block;margin:20px auto 12px;width:72px;height:72px;border-radius:50%;border:0;background:var(--sage2);color:#fff;cursor:pointer;box-shadow:0 8px 20px rgba(78,95,69,.3);display:grid;place-items:center}
.mic svg{width:28px;height:28px}
.mic.rec{background:#b4574f;animation:recp 1.4s ease-in-out infinite}
@keyframes recp{50%{box-shadow:0 0 0 12px rgba(180,87,79,.15)}}
.wave{display:flex;justify-content:center;align-items:center;gap:3px;height:22px}
.wave i{width:3px;height:3px;border-radius:2px;background:#9aa68a;transition:height .1s}
.vstat{text-align:center;font-size:13px;color:var(--mute);margin-top:8px}
.vrow{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.vrow audio{width:100%;height:36px}
.drop{display:block;margin-top:14px;border:1.5px dashed #b9c2a8;background:#e8ecdd;border-radius:14px;padding:20px;text-align:center;cursor:pointer;color:var(--sage3)}
.drop svg{width:22px;height:22px}
.drop b{display:block;font:500 18px var(--en);margin-top:4px}
html[lang=ar] .drop b{font:600 15px var(--ar)}
.drop small{font-size:12px;color:var(--mute)}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.thumbs i{aspect-ratio:1;border-radius:8px;background:#ddd center/cover;position:relative}
.thumbs i.dn::after{content:"✓";position:absolute;right:4px;bottom:2px;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.priv{font-size:12px;color:var(--mute);text-align:center;margin-top:10px}
/* finale */
#fin{padding:50px 26px 90px}
#fin img{width:150px;height:auto;display:block;margin:0 auto 6px;filter:drop-shadow(0 10px 14px rgba(60,60,40,.2))}
#fin .scr{font-size:40px}
.fn{font:400 46px/1.1 var(--scr);color:var(--deep);margin-top:16px}
.fn i{display:block;font-style:normal;color:var(--gold);font-size:.6em;margin:2px 0}
html[lang=ar] .fn{font:400 34px/1.5 var(--ruq)}
.fdate{margin-top:14px}
footer{text-align:center;font-size:13px;color:var(--mute);padding:0 0 40px}
footer a{color:var(--sage3)}
/* lightbox */
#lb{position:fixed;inset:0;z-index:80;background:rgba(25,28,22,.92);display:none;flex-direction:column;justify-content:center}
#lb.on{display:flex}
#lb .rail{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0}
#lb .rail img{flex:none;width:100vw;max-height:78vh;object-fit:contain;scroll-snap-align:center}
#lb button{position:absolute;top:max(16px,env(safe-area-inset-top));right:16px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:22px;cursor:pointer}
#lb p{text-align:center;color:#ddd;font:400 30px var(--scr);margin-top:14px}
/* falling leaves */
#fall{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.lf{position:absolute;top:-30px;width:12px;height:7px;border-radius:0 100% 0 100%;background:linear-gradient(135deg,#b7c39f,#8a9a74);opacity:.75;animation:fall linear forwards}
.lf.w{background:linear-gradient(135deg,#fffdf6,#e9e2d0);width:9px;height:9px;border-radius:60% 0 60% 0}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.rv,.pc{opacity:1!important;transform:rotate(var(--r,0deg))!important;transition:none}.seal .in,.hint,#mu .bars rect{animation:none}#fall{display:none}}

$("mic").onclick=function(){$("vErr").textContent="";if(rec&&rec.state==="recording"){stopRec();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){$("vErr").textContent=t("noMic");return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){stream=s;chunks=[];
    vType=MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported("audio/mp4")?"audio/mp4":(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported("audio/webm")?"audio/webm":"");
    rec=vType?new MediaRecorder(s,{mimeType:vType}):new MediaRecorder(s);vType=rec.mimeType||vType||"audio/webm";
    rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
    rec.onstop=function(){cancelAnimationFrame(raf);clearTimeout(stopT);$("mic").classList.remove("rec");stream.getTracks().forEach(function(k){k.stop()});
      vBlob=new Blob(chunks,{type:vType});$("vPlay").src=URL.createObjectURL(vBlob);$("vAfter").classList.remove("hide");$("mic").classList.add("hide");wave.classList.add("hide");$("vstat").textContent=""};
    try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();an=actx.createAnalyser();an.fftSize=128;actx.createMediaStreamSource(s).connect(an)}catch(e){an=null}
    rec.start();started=Date.now();$("mic").classList.add("rec");bars();stopT=setTimeout(stopRec,60000)})
  .catch(function(){$("vErr").textContent=t("noMic")})};
$("vRedo").onclick=function(){vBlob=null;$("vAfter").classList.add("hide");$("mic").classList.remove("hide");wave.classList.remove("hide");$("vstat").textContent=t("tapRec");$("vErr").textContent=""};
$("vSend").onclick=function(){var n=$("vName").value.trim(),b=this;$("vErr").textContent="";if(n.length<2){$("vErr").textContent=t("errName");$("vName").focus();return}if(!vBlob)return;
  if(MODE!=="live"||!D.slug){$("vErr").textContent=MODE==="preview"?t("prevNote"):t("demoNote");return}
  b.disabled=true;var ext=/mp4|aac|m4a/.test(vType)?"m4a":"webm",path="voices/"+D.slug+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,10)+"."+ext;
  upload("songs",path,vBlob,ext==="m4a"?"audio/mp4":"audio/webm").then(function(){return rpc("add_guest_voice",{p_slug:D.slug,p_name:n,p_path:path})})
  .then(function(){$("vAfter").classList.add("hide");$("vstat").textContent=t("voiceSent")}).catch(function(){$("vErr").textContent=t("failSend")}).then(function(){b.disabled=false})};

/* ---------- guest photos (same album the bride already sees in the studio) ---------- */
var files=[];
function shrink(f){return new Promise(function(ok,no){var img=new Image(),u=URL.createObjectURL(f);img.onload=function(){var s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");
  c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){b?ok(b):no()},"image/jpeg",.85)};img.onerror=no;img.src=u})}
function drawThumbs(){var g=$("thumbs");g.innerHTML="";files.forEach(function(f){var i=document.createElement("i");i.style.backgroundImage="url("+f.u+")";if(f.dn)i.className="dn";g.appendChild(i)});$("pSend").classList.toggle("hide",!files.length)}
$("pIn").onchange=function(e){var fs=[].slice.call(e.target.files);e.target.value="";$("pErr").textContent="";
  fs.slice(0,20).reduce(function(p,f){return p.then(function(){return shrink(f).then(function(b){files.push({b:b,u:URL.createObjectURL(b)})}).catch(function(){})})},Promise.resolve()).then(drawThumbs)};
$("pSend").onclick=function(){var n=$("pName").value.trim(),b=this;$("pErr").textContent="";if(n.length<2){$("pErr").textContent=t("errName");$("pName").focus();return}
  if(MODE!=="live"||!D.slug){$("pErr").textContent=MODE==="preview"?t("prevNote"):t("demoNote");return}
  b.disabled=true;files.filter(function(f){return!f.dn}).reduce(function(p,f){return p.then(function(){var path="guests/"+D.slug+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,10)+".jpg";
    return upload("photos",path,f.b,"image/jpeg").then(function(){return rpc("add_guest_photo",{p_slug:D.slug,p_name:n,p_path:path})}).then(function(){f.dn=1;drawThumbs()})})},Promise.resolve())
  .then(function(){$("pErr").textContent=t("photosSent");files=[];setTimeout(drawThumbs,2500)}).catch(function(){$("pErr").textContent=t("failSend")}).then(function(){b.disabled=false})};

render();
})();
</script>
