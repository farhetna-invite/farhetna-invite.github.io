<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sage Arch · فرحتنا</title>
<meta name="theme-color" content="#f1e9dc">
<meta name="robots" content="noindex">
<link rel="preload" as="image" href="img/door-l.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --sage:#8fa58a;--sage2:#6f8a6a;--sage3:#4f6449;--ink:#3e463a;--mute:#7d8577;--peony:#e7b3b1;--peony2:#c98a90;--line:rgba(79,100,73,.2);
  --ar:"Noto Naskh Arabic",serif;--ruq:"Aref Ruqaa","Noto Naskh Arabic",serif;--en:"Cormorant Garamond",Georgia,serif;--scr:"Pinyon Script","Cormorant Garamond",cursive;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-feature-settings:"lnum" 1!important}
html{scroll-behavior:smooth;background:#f1e7d8}
body{font-family:var(--en);font-size:18px;font-feature-settings:"lnum" 1;color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.7}
html[lang=ar] body{font-family:var(--ar);font-size:16.5px;line-height:1.95}
body.locked{overflow:hidden;height:100vh}
main#main{min-height:100svh}
button,input,textarea{font:inherit;color:inherit}
.bg{position:fixed;inset:0;z-index:-1;background:#f1e7d8 url(img/paper.webp) center/cover}
.hide{display:none!important}

/* ---------- floating controls ---------- */
.ctl{position:fixed;z-index:60;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(250,246,238,.82);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;color:var(--sage3);box-shadow:0 4px 14px rgba(60,70,50,.12)}
#lg{top:max(14px,env(safe-area-inset-top));right:14px;font:600 14px var(--en);letter-spacing:.04em}
html[lang=en] #lg{font:500 17px var(--ar)}
#mu{bottom:max(16px,env(safe-area-inset-bottom));left:14px}
#mu svg{width:20px;height:20px}
#mu .bars rect{transform-origin:center bottom;animation:eq 1s ease-in-out infinite}
#mu .bars rect:nth-child(2){animation-delay:-.4s}#mu .bars rect:nth-child(3){animation-delay:-.7s}#mu .bars rect:nth-child(4){animation-delay:-.2s}
#mu.off .bars rect{animation:none;transform:scaleY(.35)}
@keyframes eq{50%{transform:scaleY(.35)}}
.flag{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:60;background:var(--sage3);color:#fff;font:500 12px var(--ar);padding:5px 12px;border-radius:20px}
/* ---------- 1 · the sealed card ---------- */
#gate{position:fixed;inset:0;z-index:50;overflow:hidden;cursor:pointer;perspective:1700px;
  background:radial-gradient(120% 85% at 50% 42%,#f7f1e7,#ebe1d2 70%,#e2d6c4);transition:background-color 1s}
#gate .veil{position:absolute;inset:0;background:inherit;transition:opacity 2s ease 1s}
#gate.gone{visibility:hidden;pointer-events:none}
.card{position:absolute;left:50%;top:50%;width:min(90vw,calc(80svh*.688),470px);aspect-ratio:1080/1570;transform:translate(-50%,-48%);
  container-type:inline-size;transform-style:preserve-3d}
.door{position:absolute;top:0;height:100%;width:50%;transition:transform 3.4s cubic-bezier(.55,.03,.25,1),opacity 1.2s ease 2.2s;
  filter:drop-shadow(0 1.2cqw 2.4cqw rgba(70,60,40,.22))}
.door img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.door.l{left:0;transform-origin:0 50%}.door.r{right:0;transform-origin:100% 50%}
.seal{position:absolute;z-index:3;width:64cqw;left:calc(50% - 31.6cqw);top:calc(50% - 11.3cqw);transition:transform 3.4s cubic-bezier(.55,.03,.25,1),opacity 1.2s ease 2.2s}
.seal.hl{clip-path:inset(-5% 50.6% -5% -5%)}.seal.hr{clip-path:inset(-5% -5% -5% 49.4%)}
.seal img{width:100%;display:block}
.seal .ini{position:absolute;left:31.6cqw;top:11.3cqw;width:13.6cqw;height:13.6cqw;margin:-6.8cqw 0 0 -6.8cqw;border-radius:50%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.25cqw;animation:beat 2.6s ease-in-out infinite;
  box-shadow:inset 0 0 0 .32cqw rgba(214,178,98,.9),inset 0 .25cqw .5cqw rgba(30,40,25,.35),0 .1cqw 0 rgba(255,245,210,.35)}
.seal .ini .tx{font:600 5.5cqw/1 var(--en);letter-spacing:-.03em;white-space:nowrap;direction:ltr;
  background:linear-gradient(175deg,#fff6cf 0%,#f0cf7a 30%,#c08e33 55%,#f5dc92 78%,#a9782a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(.12cqw .22cqw .06cqw rgba(25,35,20,.75)) drop-shadow(-.06cqw -.08cqw 0 rgba(255,250,225,.75))}
.seal .ini svg{width:5.2cqw;height:auto;color:#d9b45e;filter:drop-shadow(.06cqw .12cqw 0 rgba(25,35,20,.6))}
.seal .ini svg.dn{transform:scaleY(-1)}
@keyframes beat{50%{transform:scale(1.06)}}
.g-top,.g-tap{position:absolute;left:50%;transform:translateX(-50%);width:min(92vw,470px);text-align:center;z-index:4;transition:opacity .5s}
.g-top{top:max(calc(50% - min(90vw,calc(80svh*.688),470px)*.727 - 12px),14px);transform:translate(-50%,-100%)}
.g-top .nm{font:400 clamp(34px,10vw,48px)/1.15 var(--scr);color:var(--sage3)}
html[lang=ar] .g-top .nm{font:700 clamp(28px,8vw,38px)/1.5 var(--ruq)}
.g-top .dt{font:500 15px var(--en);letter-spacing:.24em;color:#7b8370;direction:ltr}
.g-tap{bottom:max(14px,env(safe-area-inset-bottom));font:500 16px var(--en);color:var(--sage3);animation:pulse 2.4s ease-in-out infinite}
html[lang=ar] .g-tap{font:500 15px var(--ar)}
@keyframes pulse{50%{opacity:.55}}

#gate.s1 .g-top,#gate.s1 .g-tap{opacity:0;animation:none}
#gate.s2 .door.l{transform:translateX(-108%) rotateY(18deg)}#gate.s2 .door.r{transform:translateX(108%) rotateY(-18deg)}
#gate.s2 .door,#gate.s2 .seal{opacity:0}
#gate.s2 .seal.hl{transform:translateX(-54cqw)}#gate.s2 .seal.hr{transform:translateX(54cqw)}
#gate.s1 .seal .ini{animation:none}
#gate.s2 .veil{opacity:0}
#gate.s2{background:transparent}

/* ---------- 2 · the stage ---------- */
#hero{position:relative;height:100svh;min-height:560px;overflow:hidden;padding:0;background:#efe6d6}
#hero .blur{position:absolute;inset:-40px;background:url(img/stage.webp) center/cover;filter:blur(22px) saturate(.9);opacity:.75}
.stg{position:absolute;left:50%;top:50%;height:100%;min-width:100%;aspect-ratio:941/1672;transform:translate(-50%,-50%);container-type:inline-size;overflow:hidden}
.stg>img{position:absolute;inset:0;width:100%;height:100%;display:block;transform:scale(1.14);transition:transform 4.5s cubic-bezier(.2,.7,.2,1)}
body.open .stg>img{transform:none}
.cur{position:absolute;top:0;bottom:0;width:23%;background:url(img/stage.webp) 0 0/434.8% 100% no-repeat;transform-origin:50% 0;animation:sway 7s ease-in-out infinite;pointer-events:none}
.cur.l{left:0;background-position:0 0}
.cur.r{right:0;background-position:100% 0;animation-delay:-3.5s}
@keyframes sway{0%,100%{transform:skewX(0)}50%{transform:skewX(.9deg)}}
body:not(.open) .cur{transition:transform 2.6s cubic-bezier(.3,.7,.2,1)}
body:not(.open) .cur.l{transform:translateX(18%)}body:not(.open) .cur.r{transform:translateX(-18%)}
.glow{position:absolute;bottom:6%;width:30%;height:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,214,140,.45),transparent);animation:flick 3.2s ease-in-out infinite;pointer-events:none;mix-blend-mode:screen}
.glow.a{left:-4%}.glow.b{right:-4%;animation-delay:-1.4s}
@keyframes flick{0%,100%{opacity:.8}40%{opacity:.5}60%{opacity:1}}
.pages{position:absolute;left:23%;width:54%;top:24%;height:55%;text-align:center;color:#3f4a36}
.pg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4cqw;opacity:0;transform:translateY(2cqw);
  transition:opacity 1s ease,transform 1.2s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.pg.on{opacity:1;transform:none;pointer-events:auto}
.pg .bs{font:400 5.6cqw/1.6 var(--ruq);color:var(--sage3)}
.pg .sm{font:italic 500 3.5cqw/1.5 var(--en);color:#6b735f;white-space:pre-line}
html[lang=ar] .pg .sm{font:500 3.1cqw/1.85 var(--ar);font-style:normal}
.pg .nm{font:400 9cqw/1.15 var(--scr);color:#33452c;max-width:100%}
html[lang=ar] .pg .nm{font:700 7.4cqw/1.45 var(--ruq)}
.pg .nm .amp{display:block;font-size:.55em;color:#a3884f;line-height:1.2}
.pg .ic{width:5.4cqw;height:5.4cqw;color:var(--sage2);margin-top:2cqw}
.pg .big{font:600 3.9cqw/1.4 var(--en);color:#33452c;letter-spacing:.06em}
html[lang=ar] .pg .big{font:700 3.8cqw/1.6 var(--ar);letter-spacing:0}
.pg .du{font:400 5.4cqw/1.9 var(--ruq);color:var(--sage3);white-space:pre-line}
html[lang=en] .pg .du{font:italic 500 4.6cqw/1.6 var(--en)}
.pg .orn{width:22cqw;margin:1cqw auto;color:#a3884f}
.dotsP{position:absolute;left:0;right:0;top:80.5%;display:flex;justify-content:center;gap:1.6cqw}
.dotsP i{width:1.6cqw;height:1.6cqw;border-radius:50%;background:rgba(79,100,73,.3);transition:background .3s,transform .3s}
.dotsP i.on{background:var(--sage3);transform:scale(1.3)}
.more{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;color:#f7f1e6;font:500 15px var(--ar);
  text-shadow:0 1px 6px rgba(40,50,30,.6);opacity:0;transition:opacity 1s;z-index:3}
.more svg{display:block;margin:2px auto 0;width:22px;height:22px;animation:bob 1.8s ease-in-out infinite}
body.open .more{opacity:1;transition-delay:6s}
@keyframes bob{50%{transform:translateY(5px)}}

/* album */
.alb{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 28px 18px;margin:22px -28px 0;scrollbar-width:none}
.alb::-webkit-scrollbar{display:none}
.alb figure{flex:0 0 66%;scroll-snap-align:center;border-radius:160px 160px 14px 14px;overflow:hidden;aspect-ratio:3/4;border:5px solid #fbf7ef;
  box-shadow:0 0 0 1px var(--line),0 12px 26px rgba(70,80,60,.16)}
.alb img{width:100%;height:100%;object-fit:cover;display:block}
section.paper{background:rgba(255,255,255,.18)}

/* ---------- layout ---------- */
main{position:relative;max-width:520px;margin:0 auto;padding-bottom:70px;overflow:hidden}
#hero{max-width:none}
section{position:relative;padding:64px 28px;text-align:center}
.corner{position:absolute;pointer-events:none;z-index:0;height:auto}
.corner.tr{top:-8px;right:-26px;width:min(52vw,250px)}
.corner.bl{bottom:-30px;left:-26px;width:min(50vw,240px)}
.corner.sm{width:min(40vw,190px);opacity:.95}
section>*:not(.corner){position:relative;z-index:1}
#hero>.stg,#hero>.blur,#hero>.more{position:absolute}#hero>.more{z-index:3}
h2{font:400 40px/1.15 var(--en);color:var(--sage3);margin:0 0 6px;white-space:pre-line}
html[lang=ar] h2{font:400 34px/1.5 var(--ruq)}
.sub{font-style:italic;color:var(--mute);font-size:17px}
html[lang=ar] .sub{font-style:normal;font-size:15.5px}
.orn{display:block;width:120px;height:14px;margin:14px auto;color:var(--sage2)}
.para{max-width:36ch;margin:0 auto;color:#4a5246;white-space:pre-line}
.rv{opacity:0;transform:translateY(24px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.26s}.rv.d3{transition-delay:.4s}

/* 2 · welcome */
#welcome{padding-top:120px;padding-bottom:40px}
.fam{font-style:italic;color:var(--sage2);font-size:20px}
html[lang=ar] .fam{font-style:normal;font:400 20px var(--ruq)}
.welcome-p{margin-top:18px}
.names{margin:26px -14px 0;font:400 clamp(50px,15vw,74px)/1.2 var(--scr);color:var(--sage3);white-space:nowrap}
.names .amp{font-size:.62em;color:var(--peony2);margin:0 .08em}
html[lang=ar] .names{font:400 clamp(46px,13vw,60px)/1.5 var(--ruq);white-space:normal}
html[lang=ar] .names .amp{font-size:.7em}
.getting{font-style:italic;font-size:22px;color:var(--sage2);margin-top:2px}
html[lang=ar] .getting{font:400 22px var(--ruq)}
.wdate{font:500 20px var(--en);letter-spacing:.14em;color:var(--sage3);margin-top:4px}
html[lang=ar] .wdate{font:500 18px var(--ar);letter-spacing:0}

/* 3 · save the date */
.bigday{font:400 120px/1 var(--en);color:var(--sage3);margin-top:10px}
.month{font:400 34px/1.2 var(--en);color:var(--sage3)}
html[lang=ar] .month{font:400 30px/1.5 var(--ruq)}
.year{font:400 30px var(--en);color:var(--sage3);letter-spacing:.06em}
.at{font:500 22px var(--en);color:var(--ink);margin-top:10px}
html[lang=ar] .at{font:500 19px var(--ar)}
.wday{font:italic 500 19px var(--en);color:var(--sage2);letter-spacing:.06em}
html[lang=ar] .wday{font:500 17px var(--ar);font-style:normal}

/* 4 · countdown */
.cdt{font-style:italic;color:var(--ink);font-size:19px;margin-bottom:16px}
html[lang=ar] .cdt{font-style:normal;font-size:17px}
.cd{display:flex;justify-content:center;gap:9px;direction:ltr}
.cd div{width:70px;padding:12px 0 8px;border-radius:12px;background:rgba(255,255,255,.55);border:1px solid var(--line);box-shadow:0 4px 12px rgba(80,90,70,.06)}
.cd b{display:block;font:500 32px/1 var(--en);color:var(--sage3);font-variant-numeric:tabular-nums}
.cd span{font-size:13px;color:var(--mute)}
html[lang=ar] .cd span{font-size:12px}
.cd-done{font:400 30px var(--scr);color:var(--peony2)}
html[lang=ar] .cd-done{font:400 26px var(--ruq)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:30px;border:1px solid var(--sage2);
  background:rgba(255,255,255,.4);color:var(--sage3);font-size:16px;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn.fill{background:linear-gradient(#6d8467,#5a7154);border-color:#5a7154;color:#fff;box-shadow:0 6px 16px rgba(79,100,73,.25)}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px;flex:none}
.calbox{margin-top:22px}
.gl{display:block;margin-top:10px;font-size:14px;color:var(--sage2)}

/* 5 · order of the day */
.tl{position:relative;max-width:350px;margin:22px auto 0}
.tl::before{content:"";position:absolute;top:6px;bottom:6px;left:61%;width:1px;background:linear-gradient(transparent,var(--sage) 8%,var(--sage) 92%,transparent)}
html[dir=rtl] .tl::before{left:39%}
.ti{display:grid;grid-template-columns:61% 39%;align-items:center;min-height:96px;text-align:start}
.ti .tx{padding-inline-end:18px}
.ti .t{font:500 22px var(--en);color:var(--ink)}
html[lang=ar] .ti .t{font:600 18px var(--ar)}
.ti .l{font-size:16px;color:var(--mute);line-height:1.35}
.ti .ic{position:relative;display:flex;justify-content:center}
.ti .ic::before{content:"";position:absolute;top:50%;left:-5px;width:9px;height:9px;border-radius:50%;background:#f6f0e4;border:1px solid var(--sage);transform:translateY(-50%)}
html[dir=rtl] .ti .ic::before{left:auto;right:-5px}
.ti .ic svg{width:58px;height:58px;color:var(--ink)}

/* 6 · venue */
.arch{max-width:330px;margin:20px auto 0;padding:48px 22px 30px;border:1px solid var(--line);border-radius:170px 170px 16px 16px;background:rgba(255,255,255,.38);
  box-shadow:inset 0 0 0 6px rgba(255,255,255,.35),0 10px 30px rgba(80,90,70,.08)}
.pin{display:block;width:138px;height:auto;margin:0 auto 14px;filter:drop-shadow(0 8px 12px rgba(60,75,55,.18))}
.vn{font:500 26px/1.3 var(--en);color:var(--ink)}
html[lang=ar] .vn{font:400 26px/1.5 var(--ruq)}
.va{font-style:italic;color:var(--mute);margin:2px 0 20px}
html[lang=ar] .va{font-style:normal}
.wait{margin-top:30px;font-style:italic;font-size:20px;color:var(--sage3)}
html[lang=ar] .wait{font:400 22px var(--ruq)}

/* 7 · dress code */
.pal{font-size:21px;color:var(--ink);margin-top:6px}
html[lang=ar] .pal{font-size:18px}
.pn{color:var(--mute);font-size:16px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;margin:24px auto 22px;max-width:330px}
.dot{width:84px;height:84px;border-radius:50%;position:relative;box-shadow:0 8px 18px rgba(70,70,60,.16),0 0 0 3px rgba(255,255,255,.75),0 0 0 4px var(--line)}
.dot{overflow:hidden}
.dot::before{content:"";position:absolute;inset:-20%;background:inherit;filter:blur(5px)}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(ellipse 55% 35% at 34% 24%,rgba(255,255,255,.55),transparent 70%),radial-gradient(circle at 72% 82%,rgba(0,0,0,.12),transparent 55%),
    linear-gradient(28deg,transparent 40%,rgba(255,255,255,.18) 50%,transparent 60%)}
.dnote{max-width:28ch;margin:0 auto;font-style:italic;color:var(--ink)}
html[lang=ar] .dnote{font-style:normal}

/* 8 · closing */
#closing h2{font-size:38px;line-height:1.2}
.cl{max-width:30ch;margin:0 auto;color:#4a5246}
.cl p{margin-top:18px;white-space:pre-line}

/* 9 · rsvp */
form{max-width:340px;margin:24px auto 0;text-align:start;display:grid;gap:16px}
.f{display:block;font-size:16px;color:var(--ink);margin-bottom:6px}
.inp{position:relative}
.inp svg{position:absolute;top:50%;inset-inline-start:13px;width:16px;height:16px;transform:translateY(-50%);color:var(--sage2);pointer-events:none}
input[type=text],textarea{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.68);border-radius:10px;padding:11px 14px;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.inp input{padding-inline-start:38px}
input:focus,textarea:focus{border-color:var(--sage2);box-shadow:0 0 0 3px rgba(111,138,106,.15)}
textarea{min-height:92px;resize:vertical}
.radio{display:grid;gap:8px}
.radio label{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:17px}
.radio input{appearance:none;-webkit-appearance:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--sage2);background:rgba(255,255,255,.7);display:grid;place-items:center;flex:none}
.radio input:checked::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--sage3)}
.step{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);background:rgba(255,255,255,.6);border-radius:10px;padding:5px;max-width:180px}
.step button{width:40px;height:40px;border-radius:8px;border:0;background:rgba(143,165,138,.18);font-size:22px;color:var(--sage3);cursor:pointer}
.step b{font:500 24px var(--en);color:var(--sage3)}
.err{color:#a14a4a;font-size:15px;min-height:1.2em;text-align:center}
#send{width:100%;min-height:50px;font-size:17px}
#send[disabled]{opacity:.6}
.done{display:none;max-width:340px;margin:22px auto 0;padding:28px 22px;border-radius:18px;background:rgba(255,255,255,.55);border:1px solid var(--line)}
.done.on{display:block;animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.done .big{font:400 30px/1.3 var(--scr);color:var(--sage3);margin:6px 0}
html[lang=ar] .done .big{font:400 25px/1.5 var(--ruq)}
.done svg{width:48px;height:48px;color:var(--sage2)}
.done .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
.thanks{margin-top:34px;font-style:italic;color:var(--ink)}
html[lang=ar] .thanks{font-style:normal}
.sign{font:400 44px/1.2 var(--scr);color:var(--sage3);margin-top:8px}
html[lang=ar] .sign{font:400 30px/1.5 var(--ruq)}
footer{position:relative;z-index:2;text-align:center;font-size:13px;color:var(--mute);padding:10px 0 40px}

 arrive:'<path d="M14 6h9l-1.2 12.5a3.4 3.4 0 0 1-6.6 0z" transform="rotate(-14 18 14)"/><path d="M17 21v12m-4 0h8" transform="rotate(-14 18 14)"/><path d="M27 8h9l-1.2 12.5a3.4 3.4 0 0 1-6.6 0z" transform="rotate(14 31 16)"/><path d="M31 23v12m-4 0h8" transform="rotate(14 31 16)"/><path d="M24 2v4M19 4l2 3M29 4l-2 3"/><circle cx="15" cy="12" r=".6"/><circle cx="33" cy="14" r=".6"/>',
 couple:'<circle cx="17" cy="8" r="3"/><path d="M13 14h8l1 14h-3l-1 16m-4-16-1 16m-1-16h-3l1-14"/><circle cx="32" cy="9" r="3"/><path d="M29.5 9.5c-.5 3 .3 4 1 4.5M30 15h4l1.5 9 5 20H23.5l5-20z"/><path d="M29 9c-3 4-4 10-4 10"/>',
 book:'<circle cx="18" cy="28" r="9"/><circle cx="30" cy="28" r="9"/><path d="m20 11 4-5 4 5-4 4z"/><path d="M24 15v4"/>',
 dance:'<circle cx="19" cy="7" r="3"/><circle cx="30" cy="9" r="3"/><path d="M19 11c-2 4-2 8 0 12l-4 9 4 12m0-21 4 8-1 13"/><path d="M30 13c1 3 0 6-2 8l-6-6m8 6 2 7 6 2-4 4-7-1"/><path d="M8 18c2-1 3 0 3 2m29-8c1.5-.5 2.5.5 2 2"/>',
 dinner:'<path d="M6 36h36M8 36a16 16 0 0 1 32 0"/><circle cx="24" cy="18" r="2"/><path d="M11 40h26"/><path d="M18 8c-1.5-2 1.5-3 0-5m6 5c-1.5-2 1.5-3 0-5m6 5c-1.5-2 1.5-3 0-5"/>',
 cake:'<path d="M8 42h32M10 42V32h28v10M14 32v-8h20v8M18 24v-6h12v6"/><path d="M10 36c3 2 5 2 7 0s5-2 7 0 5 2 7 0 5-2 7 0"/><path d="M24 18v-4m0-4c1.2 1 1.2 2.6 0 3.4-1.2-.8-1.2-2.4 0-3.4z"/>',
 photo:'<rect x="5" y="14" width="38" height="26" rx="4"/><circle cx="24" cy="27" r="8"/><circle cx="24" cy="27" r="4"/><path d="M16 14l3-5h10l3 5M37 19h2"/>',
 music:'<path d="M18 36V12l20-5v24"/><circle cx="13" cy="36" r="5"/><circle cx="33" cy="31" r="5"/><path d="M18 18l20-5"/>',
 star:'<path d="M24 6l3.5 11 11.5.2-9.3 6.8 3.5 11-9.2-6.8L14.8 35l3.5-11L9 17.2 20.5 17z"/>'};
var KW=[[/استقبال|وصول|welcome|arriv|reception|guests/i,"arrive",["استقبال الضيوف","Guests arrive"]],[/كتب|عقد|قران|ceremony|vows|katb/i,"book",["كتب الكتاب","Katb El-Ketab"]],
  [/دبل|خاتم|شبكة|ring/i,"book",["لبس الدبل","Exchange of rings"]],[/رقص|dance/i,"dance",["الرقصة الأولى","First dance"]],
  [/زف|دخول|entrance|zaffa|couple/i,"couple",["دخول العروسين","Grand entrance"]],[/عشاء|بوفيه|اكل|أكل|dinner|food|buffet/i,"dinner",["العشاء","Dinner"]],
  [/تورت|كيك|cake/i,"cake",["تقطيع التورتة","Cake cutting"]],[/صور|تصوير|photo/i,"photo",["الصور التذكارية","Photos"]],
  [/دي ?جي|مزيك|موسيق|غنا|dj|music|party|حفلة|celebrat/i,"music",["احتفال ورقص","Celebration & dancing"]]];
function prog(label){for(var i=0;i<KW.length;i++)if(KW[i][0].test(label))return{ic:KW[i][1],tr:KW[i][2]};return{ic:"star",tr:null}}
function svgI(k){return'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>'}

/* ---------- render ---------- */
function ini(){if(D.mono&&!isAr(D.mono))return D.mono.replace(/\s*&\s*/g,"").slice(0,3);var a=String(D.groomEn||"").trim().charAt(0),b=String(D.brideEn||"").trim().charAt(0);
  if(a&&b)return a.toUpperCase()+b.toUpperCase();var x=String(nm("groom")||"").trim().charAt(0),y=String(nm("bride")||"").trim().charAt(0);return x&&y?x+" و "+y:""}
function render(){
  var h=document.documentElement;h.lang=lang;h.dir=lang==="en"?"ltr":"rtl";$("lg").textContent=lang==="en"?"ع":"EN";
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.getAttribute("data-t"))});
  var d=dt(),en=lang==="en",loc=en?"en-GB":"ar-EG",N=function(n){return en?String(n):arN(n)};
  var G=nm("groom"),B=nm("bride"),amp=en?" & ":" و ";
  var monthName=d.toLocaleDateString(loc,{month:"long"});
  var studioIntro=en?"":D.intro;
  var F={names:G+amp+B,ini:ini(),
    dots:[("0"+d.getDate()).slice(-2),("0"+(d.getMonth()+1)).slice(-2),d.getFullYear()].join("."),
    intro:studioIntro||t("intro2"),longDate:en?(d.getDate()+" "+monthName+" "+d.getFullYear()):(N(d.getDate())+" "+monthName+" "+N(d.getFullYear())),
    weekday:d.toLocaleDateString(loc,{weekday:"long"}),day:N(d.getDate()),month:monthName,year:N(d.getFullYear()),at:t("at")+tm(D.time),
    venue:en?(D.venueEn||D.venue):D.venue,addr:en?(D.addrEn||D.addr):D.addr,
    dressNote:en?(D.dressEn||(isAr(D.dressNote)?"":D.dressNote)||"We'd love you to join us in soft pastel tones"):(D.dressNote||"يسعدنا تكونوا معانا بألوان باستيل هادية")};
  var cols=(D.dress||[]).filter(function(c){return/^#[0-9a-f]{6}$/i.test(c)}).map(function(c){return c.toLowerCase()});
  F.palNames=cols.map(function(c){return(DN[c]||["",""])[en?1:0]}).filter(Boolean).join(en?" · ":" · ");
  document.querySelectorAll("[data-f]").forEach(function(e){var k=e.getAttribute("data-f");if(k!=="namesHtml")e.textContent=F[k]==null?"":F[k]});
  var nh=document.querySelector('[data-f="namesHtml"]');nh.textContent="";
  [G,en?"&":"و",B].forEach(function(x,i){var s=document.createElement("span");if(i===1)s.className="amp";s.textContent=i===1?" "+x+" ":x;nh.appendChild(s)});
  requestAnimationFrame(function(){[nh].forEach(function(el){el.style.fontSize="";var fs=parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth>el.clientWidth+2&&fs>28){fs-=2;el.style.fontSize=fs+"px"}})});
  /* programme */
  var tl=$("tl");tl.innerHTML="";(D.program||[]).forEach(function(p,i){if(!p||!p[1])return;var info=prog(p[1]),label=p[1];
    if(info.tr&&(en?isAr(label):!isAr(label)))label=info.tr[en?1:0];
    var it=document.createElement("div");it.className="ti rv"+(i%2?" d1":"");
    it.innerHTML='<div class="tx"><div class="t"></div><div class="l"></div></div><div class="ic">'+svgI(info.ic)+'</div>';
    it.querySelector(".t").textContent=tm(p[0]);it.querySelector(".l").textContent=label;tl.appendChild(it)});
  $("program").classList.toggle("hide",!tl.children.length);
  /* dress code: satin swatches */
  var dots=$("dots");dots.innerHTML="";cols.forEach(function(c){var e=document.createElement("div");e.className="dot";
    e.style.background="linear-gradient(118deg,"+shade(c,-.08)+" 0%,"+shade(c,.42)+" 17%,"+c+" 31%,"+shade(c,-.14)+" 44%,"+shade(c,.3)+" 60%,"+c+" 74%,"+shade(c,-.1)+" 88%,"+shade(c,.25)+" 100%)";dots.appendChild(e)});
  var allPastel=cols.length&&cols.every(function(c){return PASTEL.indexOf(c)>-1});$("palT").textContent=allPastel?t("pastel"):t("colours");
  $("dress").classList.toggle("hide",!cols.length&&!D.dressNote);
  $("place").classList.toggle("hide",!D.venue&&!D.addr&&!D.venueEn);
  /* closing */
  var cl=$("cl");cl.innerHTML="";var lines=[];
  if(!en&&D.closing)lines.push(D.closing);else lines.push(t("c1"),t("c2"));
  if(!en&&D.notes)lines.push(D.notes);else if(en&&D.notes&&!isAr(D.notes))lines.push(D.notes);else lines.push(t("c3"));
  lines.push(t("c4"));lines.forEach(function(x){var p=document.createElement("p");p.textContent=x;cl.appendChild(p)});
  /* bismillah (Arabic, unless the couple turned it off) */
  $("bism").classList.toggle("hide",en||D.bism===false);
  var pgs=document.querySelectorAll(".pg"),dts=document.querySelectorAll("#dotsP i");pgs[2].classList.toggle("skip",D.bism===false);dts[2].classList.toggle("hide",D.bism===false);
  /* album */
  var al=$("alb");al.innerHTML="";(D.album||[]).slice(0,8).forEach(function(u){var f=document.createElement("figure"),im=document.createElement("img");im.src=u;im.alt="";im.loading="lazy";f.appendChild(im);al.appendChild(f)});
  $("album").classList.toggle("hide",!al.children.length);
  /* map + calendar */
  $("mapBtn").href=D.map||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([D.venue,D.addr].filter(Boolean).join(" ")));
  $("gcal").href=gcal();
  document.title=F.names+" · "+(en?"Wedding Invitation":"دعوة فرح");$("gate").setAttribute("aria-label",t("tap"));
  showCnt();watch();tick();
}

/* ---------- countdown ---------- */
var timer;function tick(){clearTimeout(timer);var ms=dt()-new Date();
  if(ms<=0){$("cd").classList.add("hide");$("cdDone").classList.remove("hide");return}
  var s=Math.floor(ms/1e3),v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
  ["cdD","cdH","cdM","cdS"].forEach(function(id,i){var x=i?("0"+v[i]).slice(-2):v[i];$(id).textContent=lang==="en"?x:arN(x)});timer=setTimeout(tick,1000-new Date()%1000)}

/* ---------- calendar ---------- */
function z(d){return d.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"")}
function evt(){var s=dt(),e=new Date(+s+5*3600e3);return{s:s,e:e,title:(lang==="en"?"Wedding of ":"فرح ")+nm("groom")+(lang==="en"?" & ":" و ")+nm("bride"),
  loc:[lang==="en"?(D.venueEn||D.venue):D.venue,lang==="en"?(D.addrEn||D.addr):D.addr].filter(Boolean).join(" - ")}}
function gcal(){var v=evt();return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(v.title)+"&dates="+z(v.s)+"/"+z(v.e)+"&location="+encodeURIComponent(v.loc)}
$("ics").onclick=function(){var v=evt(),q=function(s){return String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n")};
  var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Farhetna//Invite//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+z(v.s)+"-"+Math.random().toString(36).slice(2)+"@farhetna","DTSTAMP:"+z(new Date()),
    "DTSTART:"+z(v.s),"DTEND:"+z(v.e),"SUMMARY:"+q(v.title),"LOCATION:"+q(v.loc),"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+q(v.title),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  var url=URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="wedding.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000)};

/* ---------- reveals ---------- */
var io=("IntersectionObserver"in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.15,rootMargin:"0px 0px -6% 0px"}):null;
function watch(){document.querySelectorAll(".rv:not(.in)").forEach(function(e){if(io)io.observe(e);else e.classList.add("in")})}

/* ---------- music (the romantic piano by default) ---------- */
var au=$("bgm");if(D.music==="none"){au.removeAttribute("src");$("mu").hidden=true}else if(D.music)au.src=D.music;
var playing=false;function setMu(on){playing=on;$("mu").classList.toggle("off",!on);
  if(on){au.volume=0;var p=au.play();if(p&&p.catch)p.catch(function(){playing=false;$("mu").classList.add("off")});var v=0,f=setInterval(function(){v+=.05;au.volume=Math.min(.85,v);if(v>=.85)clearInterval(f)},120)}else au.pause()}
$("mu").onclick=function(){setMu(!playing)};

$("lg").onclick=function(){lang=lang==="en"?"ar":"en";render();document.querySelectorAll("main .rv").forEach(function(e){e.classList.add("in")})};

/* ---------- petals ---------- */
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function petals(n){if(reduce)return;var box=$("petals");for(var i=0;i<n;i++)(function(i){setTimeout(function(){var p=document.createElement("i");p.className="pt"+(Math.random()<.35?" w":"");
  var dur=8+Math.random()*6;p.style.left=(Math.random()*100)+"vw";p.style.setProperty("--dx",(Math.random()*140-70)+"px");p.style.setProperty("--r",(Math.random()*720-360)+"deg");
  p.style.animationDuration=dur+"s";p.style.scale=(.6+Math.random()*.7);box.appendChild(p);setTimeout(function(){p.remove()},dur*1000+200)},i*380)})(i)}

/* ---------- open the envelope ---------- */
var opened=false,pi=-1,ptimer;
function page(i){var ps=document.querySelectorAll(".pg:not(.skip)"),ds=document.querySelectorAll("#dotsP i:not(.hide)");pi=(i+ps.length)%ps.length;
  ps.forEach(function(p,j){p.classList.toggle("on",j===pi)});ds.forEach(function(d,j){d.classList.toggle("on",j===pi)});
  clearTimeout(ptimer);ptimer=setTimeout(function(){page(pi+1)},pi===0?5200:4600)}
$("pages").addEventListener("click",function(){if(opened)page(pi+1)});
function openGate(){if(opened)return;opened=true;var g=$("gate");g.classList.add("s1");if(D.music!=="none")setMu(true);
  if(navigator.vibrate)navigator.vibrate(12);
  setTimeout(function(){g.classList.add("s2");document.body.classList.add("open")},reduce?50:250);
  setTimeout(function(){page(0)},reduce?100:3200);
  setTimeout(function(){g.classList.add("gone");document.body.classList.remove("locked");$("main").removeAttribute("aria-hidden");petals(16);watch()},reduce?300:3800);
  setInterval(function(){if(!document.hidden)petals(4)},13000)}
$("gate").addEventListener("click",openGate);$("gate").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openGate()}});

/* ---------- RSVP ---------- */
var cnt=1,DEV=(function(){try{var k="farhetna_dev",v=localStorage.getItem(k);if(!v){v=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,v)}return v}catch(e){return""}})();
var RK="farhetna_rsvp_sga_"+(D.slug||D.groom+D.date);
function att(){return document.querySelector('input[name=att]:checked').value==="1"}
document.querySelectorAll('input[name=att]').forEach(function(r){r.onchange=function(){$("cntBox").classList.toggle("hide",!att())}});
function showCnt(){$("cnt").textContent=lang==="en"?cnt:arN(cnt)}
$("minus").onclick=function(){if(cnt>1){cnt--;showCnt()}};$("plus").onclick=function(){if(cnt<10){cnt++;showCnt()}};
function waLink(r){var wa=String(D.wa||"").replace(/\D/g,"");if(!wa)return"";if(/^0/.test(wa))wa="2"+wa;
  var B=D.bride||D.brideEn,G=D.groom||D.groomEn,m=r.yes?("السلام عليكم 🤍\nأنا "+r.name+"، وبأكد حضوري فرح "+B+" و"+G+" إن شاء الله\nعدد الحضور: "+r.count):("السلام عليكم 🤍\nأنا "+r.name+"، وللأسف مش هقدر أحضر فرح "+B+" و"+G+". ألف مبروك!");
  if(r.msg)m+="\n"+r.msg;return"https://wa.me/"+wa+"?text="+encodeURIComponent(m)}
function done(r,sub){$("rf").classList.add("hide");$("done").classList.add("on");$("dBig").textContent=r.yes?t("okYes"):t("okNo");$("dSub").textContent=sub||t("okSub");
  var w=waLink(r);$("dWa").classList.toggle("hide",!w||MODE!=="live");if(w)$("dWa").href=w}
$("dEdit").onclick=function(){$("done").classList.remove("on");$("rf").classList.remove("hide");$("rn").focus()};
try{var prev=JSON.parse(localStorage.getItem(RK)||"null");if(prev&&MODE==="live"){$("rn").value=prev.name;cnt=prev.count||1;
  document.querySelector('input[name=att][value="'+(prev.yes?1:0)+'"]').checked=true;$("cntBox").classList.toggle("hide",!prev.yes);$("rm").value=prev.msg||"";done(prev)}}catch(e){}
$("rf").onsubmit=function(e){e.preventDefault();var r={name:$("rn").value.trim(),yes:att(),count:att()?cnt:0,msg:$("rm").value.trim()};$("err").textContent="";
  if(r.name.length<2){$("err").textContent=t("errName");$("rn").focus();return}
  if(MODE!=="live"){done(r,MODE==="preview"?t("prevNote"):t("demoNote"));$("dWa").classList.add("hide");return}
  var btn=$("send"),lbl=btn.querySelector("span");btn.disabled=true;lbl.textContent=t("sending");
  var finish=function(){btn.disabled=false;lbl.textContent=t("send")};
  var toWa=function(){var w=waLink(r);if(w){$("err").textContent=t("toWa");setTimeout(function(){location.href=w},800)}else $("err").textContent=t("errNet");finish()};
  if(!D.slug){toWa();return}   /* no saved-invitation link → the reply goes to the couple on WhatsApp; nothing is shown as "saved" */
  fetch(SB.url+"/rest/v1/rpc/add_rsvp",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.key,Authorization:"Bearer "+SB.key},
    body:JSON.stringify({p_slug:D.slug,p_name:r.name,p_attending:r.yes,p_guests:r.count,p_note:r.msg,p_device:DEV})})
  .then(function(res){if(!res.ok)throw new Error(res.status);return res.json()})
  .then(function(){try{localStorage.setItem(RK,JSON.stringify(r))}catch(e){}finish();done(r);if(navigator.vibrate)navigator.vibrate([8,30,8])})
  .catch(toWa)};

render();
})();
</script>
