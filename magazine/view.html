<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a22">
<meta name="robots" content="noindex">
<title>My Magazine · فرحتنا</title>
<meta property="og:title" content="مجلة معمولة مخصوص ليك 💌">
<meta property="og:description" content="My Magazine من فرحتنا">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,800;0,900;1,400;1,600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="engine.css">
<style>.msg{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;background:#0f2a22;color:#efe3c4;font-family:"Noto Naskh Arabic",serif;font-size:17px;line-height:1.9}.msg.on{display:flex}</style>
</head>
<body class="ed-emerald">
<div class="msg" id="msg"></div>
<div class="intro" id="intro">
  <span class="demo" id="demoTag" hidden></span>
  <div class="k">FARHETNA · EMERALD EDITION</div>
  <div class="for" id="iFor"></div>
  <div class="ttl foil" id="iT"></div>
  <div class="mag3d" aria-hidden="true"><div class="vol"><div class="back"></div><div class="edge"></div><div class="front" id="mini"></div><div class="gloss"></div></div></div>
  <button class="open" id="open" type="button"><span id="iO"></span><svg viewBox="0 0 24 24"><path d="M4 6c3-1.5 5.5-1.5 8 0v13c-2.5-1.5-5-1.5-8 0zM20 6c-3-1.5-5.5-1.5-8 0v13c2.5-1.5 5-1.5 8 0z"/></svg></button>
  <small id="iH"></small>
</div>

<div class="stage">
  <div class="book" id="book"></div>
  <div class="nav">
    <button class="pv" id="prev" aria-label="prev"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="cnt" id="cnt"></span>
    <button class="nx" id="next" aria-label="next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="toc" id="toc" type="button"></button>
    
  </div>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><h3 id="tocT"></h3><ol id="tocL"></ol></div>
<audio id="aud" preload="none"></audio>

<script src="../memories/config.js"></script>
<script src="editions.js"></script>
<script src="compose.js"></script>
<script src="reader.js"></script>
<script>
(()=>{
const C=window.FM,msg=t=>{const m=document.getElementById("msg");m.textContent=t;m.classList.add("on")};
const show=(p,opts)=>{if(!p||!p.data){msg("المجلة دي مش متاحة دلوقتي.");return}
  const d=Object.assign({},p.data,{lang:p.lang||p.data.lang,recipient:p.data.recipient||p.recipient});
  MAG_MOUNT(MAG_COMPOSE(d),p.edition||d.edition,d.recipient,opts)};
/* preview from the builder (same device, nothing published) */
if(location.hash==="#preview"){addEventListener("message",e=>{if(e.origin!==location.origin||!e.data||e.data.t!=="mag-preview")return;show(e.data.p,{tag:"معاينة — مش منشورة"})});
  (window.opener||window.parent).postMessage({t:"mag-ready"},location.origin);return}
const slug=(location.hash||"").slice(1).replace(/[^a-z0-9]/gi,"").toLowerCase();if(!slug){msg("اللينك ناقص.");return}
fetch(C.sbUrl+"/rest/v1/rpc/mag_public",{method:"POST",headers:{"Content-Type":"application/json",apikey:C.sbKey,Authorization:"Bearer "+C.sbKey},body:JSON.stringify({p_slug:slug})})
  .then(r=>r.ok?r.json():null).then(p=>{if(p&&p.ended){msg("انتهت مدة عرض المجلة دي.");return}if(!p){msg("المجلة دي لسه مش منشورة، أو اللينك مش صحيح.");return}show(p)})
  .catch(()=>msg("في مشكلة في الاتصال، جرّب تاني."));
})();
</script>
</body>
</html>
