<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>✨ Golden Night · فرحتنا</title>
<meta name="description" content="دعوة عيد ميلاد تفاعلية من فرحتنا">
<meta name="theme-color" content="#0f0c16">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../bday/core.css">
<style>
:root{--bg:#0f0c16;--ink:#efe6d2;--sub:#b9ad95;--name:#e9c977;--head:#f1d894;--card:rgba(255,255,255,.035);--cell:rgba(233,201,119,.08);--num:#f1d894;--line:rgba(233,201,119,.28);--btn:linear-gradient(135deg,#f3dc95,#c99b45);--btnInk:#1a1408;--field:rgba(255,255,255,.04);--chip:rgba(233,201,119,.14);--chipInk:#f1d894}
body{background:
  radial-gradient(70% 40% at 50% 0%,rgba(233,201,119,.13),transparent 70%),
  radial-gradient(circle,rgba(233,201,119,.18) 1px,transparent 1.5px) 0 0/34px 34px,
  radial-gradient(circle,rgba(255,255,255,.08) 1px,transparent 1.5px) 17px 17px/34px 34px,#0f0c16}
.card{border:1px solid rgba(233,201,119,.25);box-shadow:inset 0 0 0 5px rgba(15,12,22,.6),inset 0 0 0 6px rgba(233,201,119,.12)}
.hero h1{background:linear-gradient(180deg,#fff1c4 0%,#e9c977 45%,#b8873a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px rgba(233,201,119,.25))}
.age{border:1.5px solid rgba(233,201,119,.6);box-shadow:0 0 0 6px rgba(233,201,119,.08),0 0 40px rgba(233,201,119,.18)}
.age b{background:linear-gradient(180deg,#fff1c4,#d7a94f);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:70px}
.age small{color:#d9c08a}
.photo{border:2px solid #e9c977;box-shadow:0 0 0 7px rgba(233,201,119,.1),0 0 50px rgba(233,201,119,.2)}
.hero .k{letter-spacing:.02em}
.hero::before{content:"✦  ✦  ✦";display:block;color:#e9c977;letter-spacing:.3em;font-size:12px;margin-bottom:12px;opacity:.8}
.bt{box-shadow:0 8px 22px -12px rgba(233,201,119,.6)}
.bt.gh{color:#f1d894}
.two button[aria-pressed=true]{background:linear-gradient(135deg,#f3dc95,#c99b45);color:#1a1408}
form input::placeholder,form textarea::placeholder{color:#7f7562}
.send{background:linear-gradient(135deg,#f3dc95,#c99b45);color:#1a1408}
.err{color:#ff9c8a}
footer a{color:#f1d894}

/* gate */
#gate{background:radial-gradient(90% 60% at 50% 45%,#211a2c 0%,#120e19 60%,#0b0910 100%);color:#efe6d2}
#gate .stars{position:absolute;inset:0;background:radial-gradient(circle,rgba(241,216,148,.55) 1px,transparent 1.6px) 0 0/46px 46px,radial-gradient(circle,rgba(255,255,255,.3) 1px,transparent 1.6px) 23px 30px/46px 46px;animation:tw 4s ease-in-out infinite alternate;opacity:.6}
@keyframes tw{to{opacity:.95}}
#gate .gk{position:relative;font-family:"Aref Ruqaa",serif;font-size:36px;font-weight:700;margin-bottom:10px;background:linear-gradient(180deg,#fff1c4,#d7a94f);-webkit-background-clip:text;background-clip:text;color:transparent}
#gate .gk small{display:block;font-family:"Noto Naskh Arabic",serif;font-size:15px;font-weight:500;color:#b9ad95;-webkit-text-fill-color:#b9ad95}
#gate .gt{position:relative;background:rgba(233,201,119,.12);color:#f1d894;box-shadow:inset 0 0 0 1px rgba(233,201,119,.35)}
.cake{position:relative;width:250px;height:260px}
.cake svg{width:100%;height:100%;overflow:visible}
.fl{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);opacity:0;transition:transform .45s cubic-bezier(.2,1.6,.4,1),opacity .2s}
#gate.lit .fl{transform:scale(1);opacity:1;animation:fk .18s ease-in-out infinite alternate}
#gate.lit .fl:nth-of-type(2){animation-delay:.07s}#gate.lit .fl:nth-of-type(3){animation-delay:.13s}
@keyframes fk{from{transform:scale(1,1) skewX(-3deg)}to{transform:scale(.92,1.08) skewX(3deg)}}
.halo{position:absolute;left:50%;top:6%;width:300px;height:220px;margin-left:-150px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,210,120,.55),rgba(255,210,120,0));opacity:0;transition:opacity .8s}
#gate.lit .halo{opacity:1}
#gate.lit .cake{animation:none}
.cake{animation:fl 3.5s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.sp{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe7a6;box-shadow:0 0 10px 3px rgba(255,214,120,.8)}
</style>
</head>
<body class="locked">
<div class="flag" id="demoFlag">تجربة</div>
<button id="mu" class="off" type="button" aria-label="المزيكا"><svg class="pa" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg class="pl" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
<audio id="bgm" loop preload="none"></audio>

<div id="gate" role="button" tabindex="0" aria-label="افتح الدعوة">
  <div class="stars"></div>
  <div class="gk">عندك دعوة ✨<small>لليلة مميزة</small></div>
  <div class="cake">
    <div class="halo"></div>
    <svg viewBox="0 0 250 260" aria-hidden="true">
      <defs>
        <linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b2338"/><stop offset="1" stop-color="#1a1524"/></linearGradient>
        <linearGradient id="gd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b8873a"/><stop offset=".5" stop-color="#f6e2a2"/><stop offset="1" stop-color="#b8873a"/></linearGradient>
        <linearGradient id="cd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9dcc0"/><stop offset=".5" stop-color="#fffaf0"/><stop offset="1" stop-color="#e2d3b4"/></linearGradient>
        <radialGradient id="fg" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#fff8d6"/><stop offset=".45" stop-color="#ffd36b"/><stop offset="1" stop-color="#ff8a2a"/></radialGradient>
      </defs>
      <ellipse cx="125" cy="248" rx="112" ry="10" fill="rgba(233,201,119,.12)"/>
      <rect x="18" y="234" width="214" height="10" rx="5" fill="url(#gd)"/>
      <rect x="34" y="160" width="182" height="76" rx="10" fill="url(#t1)"/>
      <rect x="34" y="160" width="182" height="8" fill="url(#gd)"/><rect x="34" y="214" width="182" height="5" fill="url(#gd)" opacity=".7"/>
      <path d="M34 168 q 15 16 30 0 q 15 16 30 0 q 15 16 30 0 q 15 16 30 0 q 15 16 30 0 q 16 16 32 0" fill="none" stroke="#e9c977" stroke-width="2" opacity=".75"/>
      <rect x="62" y="104" width="126" height="58" rx="9" fill="url(#t1)"/>
      <rect x="62" y="104" width="126" height="7" fill="url(#gd)"/>
      <g fill="#e9c977" opacity=".9"><circle cx="80" cy="134" r="2.5"/><circle cx="100" cy="140" r="2.5"/><circle cx="125" cy="134" r="2.5"/><circle cx="150" cy="140" r="2.5"/><circle cx="170" cy="134" r="2.5"/></g>
      <g fill="#e9c977" opacity=".75"><circle cx="58" cy="196" r="2"/><circle cx="88" cy="190" r="2"/><circle cx="125" cy="196" r="2"/><circle cx="162" cy="190" r="2"/><circle cx="192" cy="196" r="2"/></g>
      <rect x="93" y="62" width="10" height="44" rx="3" fill="url(#cd)"/><rect x="120" y="54" width="10" height="52" rx="3" fill="url(#cd)"/><rect x="147" y="62" width="10" height="44" rx="3" fill="url(#cd)"/>
      <g stroke="#3a2e1c" stroke-width="2" stroke-linecap="round"><path d="M98 62v-6"/><path d="M125 54v-6"/><path d="M152 62v-6"/></g>
      <path class="fl" d="M98 57 C 88 44, 96 34, 98 26 C 100 34, 108 44, 98 57 Z" fill="url(#fg)"/>
      <path class="fl" d="M125 49 C 115 36, 123 26, 125 18 C 127 26, 135 36, 125 49 Z" fill="url(#fg)"/>
      <path class="fl" d="M152 57 C 142 44, 150 34, 152 26 C 154 34, 162 44, 152 57 Z" fill="url(#fg)"/>
    </svg>
  </div>
  <div class="gt">المس الشمعة ونوّرها 🕯️</div>
</div>
<div class="fx" id="fx"></div>

<main id="main" aria-hidden="true"></main>

<script>
(function(){
var COLS=["#f6e2a2","#e9c977","#c99b45","#fff4d6","#d7a94f","#b8873a"];
BDAY.start({key:"bdn",colors:COLS,kicker:"بكل حب، بندعوكم لعيد ميلاد",
  ageLabel:function(n){return n>=11?"سنة":(n===2?"سنتين":"سنين")},
  demo:{name:"كريم",age:"30",date:"2027-02-14",time:"20:00",venue:"Sky Lounge",addr:"الزمالك، القاهرة",map:"",wa:"",
    intro:"٣٠ سنة من الحكايات الحلوة ✨\nوأحلى حكاية إنكم تكونوا معانا الليلة دي",
    program:[["20:00","الاستقبال"],["21:00","العشاء"],["22:00","التورتة والشموع"],["22:30","الحفلة والدي جي"]],
    dress:"أسود ودهبي ✨",gift:"",notes:"",photos:[],hero:"",music:""},
  open:function(g,confetti){g.classList.add("lit");var r=g.querySelector(".cake").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.18;
    setTimeout(function(){confetti(80,[cx,cy]);var fx=document.getElementById("fx");
      for(var i=0;i<24;i++){var s=document.createElement("i");s.className="sp";s.style.left=cx+"px";s.style.top=cy+"px";fx.appendChild(s);
        var a=Math.random()*Math.PI*2,d=80+Math.random()*170;
        s.animate([{transform:"translate(-50%,-50%) scale(1)",opacity:1},{transform:"translate("+(Math.cos(a)*d)+"px,"+(Math.sin(a)*d)+"px) scale(.2)",opacity:0}],{duration:1100+Math.random()*700,easing:"cubic-bezier(.1,.7,.3,1)",fill:"forwards"}).onfinish=function(){this.effect.target.remove()}}},450);
    return 1700}});
})();
</script>
