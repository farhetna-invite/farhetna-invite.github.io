<style>
:root{--rose:#b47a7c;--rose2:#9c6466;--ink:#6e5548;--mute:#9a8173;--line:rgba(156,100,102,.3);--paper:#f3e2d3;
  --ar:"Noto Naskh Arabic",serif;--ruq:"Aref Ruqaa","Noto Naskh Arabic",serif;--en:"Cormorant Garamond",Georgia,serif;--scr:"Pinyon Script","Cormorant Garamond",cursive;

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-feature-settings:"lnum" 1}
html,body{height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ar);color:var(--ink)}
html[lang=en] body{font-family:var(--en)}

/* every envelope layer shares one 941×1672 stage that covers the screen */
.view{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.stg{position:absolute;left:50%;top:50%;width:min(100vw,100svh*941/1672);aspect-ratio:941/1672;transform:translate(-50%,-50%)}
.lay{position:absolute;inset:0;background:no-repeat top center/100% auto}
/* the envelope is shown whole; the spare space above/below is the same paper, softly blurred */
.bl{position:absolute;inset:-40px;background:no-repeat center/cover;filter:blur(22px) saturate(.95);transform:scale(1.08)}
#vClosed .bl{background-image:url(img/envelope.webp);transition:opacity 1.3s ease .5s}
#vBack .bl{background-image:url(img/open.webp);transition:opacity 1.6s ease .6s}
#vClosed.drop .bl{opacity:0}
body.rise #vBack .bl{opacity:0}
#vBack{z-index:1}#s3{z-index:2}#vFront{z-index:3}#vClosed{z-index:4}

/* ---------- scene 3 · the palace card (rises out of the pocket and becomes the page) ---------- */
#s3{position:fixed;inset:0;background:transparent;transition:background-color 1.6s ease 1s}
body.rise #s3{background-color:#efdcc9}
.clip{position:absolute;inset:0;transition:clip-path 2.4s var(--ease)}
.pal{position:absolute;inset:0;margin:auto;width:min(100vw,100svh*850/1851);aspect-ratio:850/1851;height:auto;transform-origin:0 0;transition:transform 2.4s var(--ease)}
.pal .bg{position:absolute;inset:0;background:url(img/palace.webp) center/100% 100% no-repeat}
.jet{position:absolute;mix-blend-mode:screen;opacity:.5;
  background:repeating-linear-gradient(180deg,transparent 0 5px,rgba(255,255,255,.85) 7px,transparent 10px 16px);background-size:100% 32px;animation:fall 1s linear infinite;
  -webkit-mask:radial-gradient(50% 50% at 50% 50%,#000 30%,transparent 75%);mask:radial-gradient(50% 50% at 50% 50%,#000 30%,transparent 75%)}
@keyframes fall{to{background-position:0 32px}}
.pool{position:absolute;mix-blend-mode:screen;opacity:.32;
  background:repeating-linear-gradient(95deg,transparent 0 12px,rgba(255,255,255,.5) 15px,transparent 19px 34px);background-size:180px 100%;animation:ripple 10s linear infinite;
  -webkit-mask:radial-gradient(50% 50% at 50% 50%,#000 35%,transparent 80%);mask:radial-gradient(50% 50% at 50% 50%,#000 35%,transparent 80%)}
@keyframes ripple{to{background-position:180px 0}}

/* text slides in the empty centre: one at a time, like the reference */
.txt{position:absolute;left:14%;right:14%;top:17%;height:34%;font-size:min(4.3vw,1.98svh)}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  opacity:0;transform:translateY(14px);filter:blur(4px);transition:opacity .7s ease,filter .7s ease,transform 0s linear .75s;pointer-events:none}
.sl.first{transition-delay:.2s!important}
.sl.on{opacity:1;transform:none;filter:none;pointer-events:auto;transition:opacity 1.4s ease .8s,transform 1.4s var(--ease) .8s,filter 1.4s ease .8s}
.sl>*+*{margin-top:.45em}
.bism{font:400 1.8em/1.7 var(--ruq);color:var(--rose2);white-space:nowrap}
.verse{font:400 1.6em/2 "Amiri Quran","Amiri",serif;color:var(--ink);white-space:nowrap}
.ref{font-size:.82em;color:var(--mute)}
.orn{width:8.5em;height:1.1em;color:var(--rose)}
.mono{font:400 4.2em/1.2 var(--ruq);color:var(--rose)}
.mono i{font:400 .55em var(--scr);font-style:normal;margin:0 .15em;color:var(--rose2)}
.dnum{font:500 1.15em var(--en);letter-spacing:.32em;color:var(--rose2);direction:ltr}
.msg{font:400 1.55em/1.9 var(--ruq);color:var(--rose2);white-space:pre-line}
.inv{font:400 1.3em/1.85 var(--ruq);color:var(--ink);white-space:pre-line}
.names{font:400 2.5em/1.35 var(--ruq);color:var(--rose2);white-space:nowrap}
.names i{font:400 .8em var(--scr);font-style:normal;margin:0 .2em;color:var(--rose)}
.lead{font:400 1.3em/1.7 var(--ruq);color:var(--rose2)}
.rows{display:flex;flex-direction:column;gap:.55em;align-items:center}
.row{display:flex;flex-direction:column;align-items:center;gap:.15em;color:var(--ink);font-size:1.05em;line-height:1.45}
.row svg{width:1.6em;height:1.6em;color:var(--rose)}
.row a{color:inherit;text-decoration:none}
.row small{font-size:.86em;color:var(--mute)}
.row .en{font:500 1.05em var(--en);letter-spacing:.12em;direction:ltr}
html[lang=en] .msg,html[lang=en] .inv,html[lang=en] .lead{font:italic 500 1.35em/1.5 var(--en)}
html[lang=en] .names{font:400 2.7em/1.15 var(--scr)}
html[lang=en] .mono{font:400 4em/1.1 var(--scr)}
html[lang=en] .bism{font:italic 500 1.35em/1.45 var(--en);white-space:normal}
html[lang=en] .verse{font:italic 500 1.4em/1.5 var(--en);white-space:normal}
html[lang=en] .row{font:500 1.15em/1.4 var(--en)}
html[lang=en] .txt{left:19%;right:19%}
html[lang=en] .lead{font-size:1.2em}

  later(function(){vc.classList.add("lift")},1050*R);
  later(function(){vc.classList.add("drop")},2300*R);
  later(function(){vc.classList.add("gone")},4300*R);
  later(function(){risen=true;document.body.classList.add("rise");$("clip").style.clipPath="polygon(0px 0px,"+innerWidth+"px 0px,"+innerWidth+"px 0px,"+innerWidth+"px "+innerHeight+"px,0px "+innerHeight+"px,0px 0px)";$("pal").style.transform="none";show(act()[0])},5200*R);
  later(function(){$("vFront").classList.add("gone");$("vBack").classList.add("gone");$("clip").style.clipPath="none"},7700*R);
}
$("seal").addEventListener("click",open);
if(/[?&]open=1/.test(location.search)){risen=true;vc.classList.add("gone");$("vFront").classList.add("gone");$("vBack").classList.add("gone");document.body.classList.add("rise");$("pal").style.transform="none";$("clip").style.clipPath="none";show(act()[0])}
})();
</script>
