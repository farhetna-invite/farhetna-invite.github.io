<title>💌 دعوة</title>
<script>
  // Short invitation links: farhetna-invite.github.io/omar-malika -> the invitation page
  (function () {
    var slug = location.pathname.replace(/^\/+|\/+$/g, "").split("/")[0].toLowerCase();
    if (/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(slug)) {
      location.replace("/studio.html#s=" + slug);
    } else {
      location.replace("/");
    }
  })();
</script>
