<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palace Gate · فرحتنا</title>
<meta name="theme-color" content="#f3e6d3">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preload" as="image" href="img/envclean.webp" fetchpriority="high">
<link rel="preload" as="image" href="img/seal.webp">
<link rel="preload" as="image" href="img/palace.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--g1:#c9a463;--g2:#8a6630;--g3:#b48d4f;--ink:#6a4e2a;--mute:#8e7656;--paper:#f3e6d3;
  --ar:"Noto Naskh Arabic","Amiri",serif;--en:"Cormorant Garamond",Georgia,serif;--scr:"Pinyon Script",cursive;--ease:cubic-bezier(.45,.05,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-feature-settings:"lnum" 1}
html,body{height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ar);color:var(--ink)}
.fill{position:fixed;inset:-40px;background:no-repeat center/cover;filter:blur(22px) saturate(.95);transform:scale(1.08)}
#fP{background-image:url(img/palace.webp)}
#fE{background-image:url(img/envclean.webp);transition:opacity 1.4s ease}
body.inside #fE{opacity:0}
.stg{position:fixed;left:50%;top:50%;width:min(100vw,100svh*941/1672);aspect-ratio:941/1672;transform:translate(-50%,-50%);font-size:min(4vw,1.9svh)}
.lay{position:absolute;inset:0;background:no-repeat center/100% 100%}

/* ---------- the palace (scenes 3–5) ---------- */
#palace{transform:scale(1.22);transform-origin:50% 40%;transition:transform 3.6s cubic-bezier(.3,.1,.2,1)}
#palace .bg{background-image:url(img/palace.webp)}
body.inside #palace{transform:none}
.glow{position:absolute;left:28%;right:28%;top:6%;height:24%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,226,150,.55),rgba(255,220,150,0));mix-blend-mode:screen;opacity:0;transition:opacity 2s ease 1.2s;animation:gl 4.5s ease-in-out infinite}
body.inside .glow{opacity:1}
@keyframes gl{50%{filter:brightness(1.35);transform:scale(1.06)}}
.spark{position:absolute;width:1.6%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff7dc,rgba(255,240,200,0) 70%);mix-blend-mode:screen;animation:tw 2.6s ease-in-out infinite;opacity:0}
@keyframes tw{50%{opacity:.95;transform:scale(1.4)}}

/* text panels (scene 4: names · scene 5: details) */
.panel{position:absolute;left:24%;right:24%;top:26%;bottom:28%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.panel>*{opacity:0;transform:translateY(14px);filter:blur(4px);transition:opacity 1.3s ease,transform 1.3s var(--ease),filter 1.3s ease}
.panel.on>*{opacity:1;transform:none;filter:none}
.panel.out>*{opacity:0;transform:translateY(-8px);filter:blur(3px);transition:opacity .9s ease,transform .9s ease,filter .9s ease;transition-delay:0s!important}
.gold{background:linear-gradient(170deg,#d8b874,#94703a 55%,#c49d5a);-webkit-background-clip:text;background-clip:text;color:transparent}
/* scene 4 */
#p4.on>*:nth-child(2){transition-delay:1.2s}#p4.on>*:nth-child(3){transition-delay:1.9s}#p4.on>*:nth-child(4){transition-delay:2.6s}#p4.on>*:nth-child(5){transition-delay:3.3s}#p4.on>*:nth-child(6){transition-delay:3.7s}
.mono{position:relative;width:11.5em;height:9em}
.mono svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:70%;color:var(--g3)}
.mono .a,.mono .b,.mono .amp{position:absolute;font-family:var(--en);font-style:italic;font-weight:600;line-height:1}
.mono .a{font-size:5.6em;left:24%;top:-2%}
.mono .amp{font-size:2.4em;left:46%;top:30%}
.mono .b{font-size:5.6em;left:52%;top:22%}
.dv{display:flex;align-items:center;justify-content:center;gap:.4em;color:#b08a4c;width:12em;margin:.5em 0}
.dv b{flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor 25%,currentColor 75%,transparent)}
.dv svg{flex:none}
.dv.h svg{width:1.3em;height:1.1em}.dv.o svg{width:2.8em;height:1em}.dv.s{width:7em}.dv.s svg{width:2em;height:.8em}
.names{font:700 2.45em/1.4 var(--ar);white-space:nowrap}
html[lang=en] .names{font:400 2.7em/1.25 var(--scr)}
.date{font:600 1.85em var(--en);letter-spacing:.06em;color:#8a6630;direction:ltr;word-spacing:.2em}
/* scene 5 */
#p5{top:25%;bottom:24%}
#p5>*{transition-duration:1.1s}
#p5.on>*:nth-child(2){transition-delay:.25s}#p5.on>*:nth-child(3){transition-delay:.5s}
#p5.on>*:nth-child(4){transition-delay:2.2s}#p5.on>*:nth-child(5){transition-delay:2.45s}#p5.on>*:nth-child(6){transition-delay:2.7s}
#p5.on>*:nth-child(7){transition-delay:4.2s}#p5.on>*:nth-child(8){transition-delay:4.45s}#p5.on>*:nth-child(9){transition-delay:4.7s}
#p5.on>*:nth-child(10){transition-delay:6.2s}#p5.on>*:nth-child(11){transition-delay:6.45s}
.ic{width:2.6em;height:2.6em;color:#9a7536;margin-bottom:.15em}
.k{font:700 1.55em/1.5 var(--ar);color:#7d5b2c}
.v{font:600 1.3em/1.6 var(--ar);color:#7d5b2c}
.v small{display:block;font-size:.88em;font-weight:500;color:var(--mute)}
.v a{color:inherit;text-decoration:none}
html[lang=en] .k{font:600 1.5em/1.4 var(--en);letter-spacing:.04em}
html[lang=en] .v{font:600 1.3em/1.5 var(--en)}
#p5 .dv{margin:.55em 0 .45em}
.dots{display:flex;gap:.8em;justify-content:center;margin-top:.45em}
.dots i{width:2.2em;height:2.2em;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08),0 3px 8px -3px rgba(90,60,20,.35)}
#dressWrap{display:flex;flex-direction:column;align-items:center}#dressWrap[hidden]{display:none}
.replay{position:fixed;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 46px);transform:translateX(-50%);z-index:31;border:1px solid rgba(176,138,76,.5);background:rgba(255,250,240,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  color:#7d5b2c;font:600 .9em var(--ar);padding:.5em 1.1em;border-radius:2em;cursor:pointer;opacity:0;pointer-events:none;transition:opacity 1s}
body.done .replay{opacity:1;pointer-events:auto}

/* ---------- the envelope (scene 1–2): body with an opening, flap and seal on separate layers ---------- */
#env{position:absolute;inset:0;transform-origin:50% 33%;perspective:1500px;perspective-origin:50% 0}
#env .body{background-image:url(img/envclean.webp);clip-path:polygon(0 22.97%,49.41% 51.91%,100% 22.25%,100% 100%,0 100%)}
#flap{position:absolute;left:0;top:0;width:100%;height:51.91%;transform-origin:50% 0;transform-style:preserve-3d;transition:transform 3.2s cubic-bezier(.55,.05,.3,1)}
#flap .f,#flap .bk{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
#flap .f{background:url(img/envclean.webp) no-repeat top center/100% 192.63%;clip-path:polygon(0 0,100% 0,100% 42.86%,49.41% 100%,0 44.24%)}
#flap .bk{transform:rotateX(180deg);clip-path:polygon(0 100%,100% 100%,100% 57.14%,49.41% 0,0 55.76%);
  background:linear-gradient(0deg,#f6ead9,#efdfc8);box-shadow:inset 0 0 0 2px #d5b77a}
#seal{position:absolute;left:33.16%;top:37.14%;width:31.88%;aspect-ratio:300/312;background:url(img/seal.webp) no-repeat center/100% 100%;z-index:4;
  filter:drop-shadow(0 6px 10px rgba(90,60,20,.25));transition:transform 1.1s cubic-bezier(.5,0,.3,1),opacity .8s ease .3s;cursor:pointer}
#seal::after{content:"";position:absolute;inset:3%;border-radius:50%;box-shadow:0 0 0 0 rgba(255,236,190,.75);animation:br 2.6s ease-in-out infinite}
@keyframes br{50%{box-shadow:0 0 0 16px rgba(255,236,190,0)}}
.hint{position:absolute;left:0;right:0;top:57.5%;text-align:center;color:#8a6630;font-size:1em;text-shadow:0 1px 6px rgba(255,248,236,.9);animation:pl 2.4s ease-in-out infinite;transition:opacity .4s}
html[lang=en] .hint{font:italic 600 1.15em var(--en)}
@keyframes pl{50%{opacity:.45}}
body.go #seal::after,body.go .hint{animation:none;opacity:0}
body.go #seal{animation:sTug .45s ease-in-out}
body.go2 #seal{transform:translateY(-12%) scale(1.12);opacity:0}
@keyframes sTug{40%{transform:scale(.96)}}
body.lift #flap{transform:rotateX(-176deg)}
body.inside #env{transform:scale(3.4);opacity:0;transition:transform 3.4s cubic-bezier(.45,0,.2,1),opacity 1.4s ease 1.3s}
body.gone #env{display:none}


/* ---------- scrolling continuation: the formal arch card ---------- */
#more{position:fixed;inset:0;z-index:20;overflow:hidden;pointer-events:none;-webkit-overflow-scrolling:touch;overflow-x:hidden}
body.gone #more{overflow-y:auto;overflow-x:hidden;pointer-events:auto}
.spacer{height:100svh;pointer-events:none}
.cardpg{position:relative;min-height:100svh;overflow:hidden;background:#ecdcc4 url(img/arch.webp) no-repeat center/cover;box-shadow:0 -24px 40px -12px rgba(90,60,20,.25)}
.cardpg .pin{position:absolute;left:50%;top:50%;width:min(100vw,100svh*941/1672);aspect-ratio:941/1672;transform:translate(-50%,-50%);font-size:min(4vw,1.9svh)}
.formal{position:absolute;left:14%;right:14%;top:17.5%;bottom:15%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.25em}
.formal>*{opacity:0;transform:translateY(14px);transition:opacity 1.2s ease,transform 1.2s var(--ease)}
.formal.in>*{opacity:1;transform:none}
.formal.in>*:nth-child(2){transition-delay:.5s}.formal.in>*:nth-child(3){transition-delay:1s}.formal.in>*:nth-child(4){transition-delay:1.5s}.formal.in>*:nth-child(5){transition-delay:2s}
.formal.in>*:nth-child(6){transition-delay:2.5s}.formal.in>*:nth-child(7){transition-delay:3s}.formal.in>*:nth-child(8){transition-delay:3.5s}
.fBism{font:400 1.85em/1.6 "Amiri",serif;color:#8a6630;white-space:nowrap}
.fMsg{font:500 1.15em/2 var(--ar);color:var(--ink);white-space:pre-line;margin-top:.4em}
.fNames{font:700 2.2em/1.5 var(--ar);margin:.15em 0}
.fNames .gold{display:block}
.fNames i{display:block;font:400 .55em/1 var(--en);font-style:italic;color:#b08a4c;margin:.1em 0}
.fLine{font:600 1.12em/1.8 var(--ar);color:#7d5b2c}
.fLine a{color:inherit;text-decoration:none;border-bottom:1px dotted rgba(176,138,76,.6)}
.fLine small{display:block;font-size:.88em;font-weight:500;color:var(--mute)}
.fEnd{font:500 1.05em/1.9 var(--ar);color:var(--mute);margin-top:.4em}
html[lang=en] .fBism{font:italic 600 1.2em/1.5 var(--en);white-space:normal}
html[lang=en] .fMsg,html[lang=en] .fEnd{font:italic 500 1.25em/1.6 var(--en)}
html[lang=en] .fNames{font:400 2.3em/1.3 var(--scr)}
html[lang=en] .fLine{font:600 1.25em/1.6 var(--en)}
.cue{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:2px;color:#7d5b2c;font-size:13px;
  background:rgba(255,250,242,.85);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 14px 4px;border-radius:20px;border:1px solid rgba(176,138,76,.4);opacity:0;pointer-events:none;transition:opacity .8s}
.cue svg{width:16px;height:16px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
body.done .cue{opacity:1}body.scrolled .cue{opacity:0}
body.scrolled .replay{opacity:0;pointer-events:none}


/* countdown in the arch */
.cdpg{margin-top:-1px}
.cdin{position:absolute;left:12%;right:12%;top:22%;bottom:45%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
.cdin>*{opacity:0;transform:translateY(14px);transition:opacity 1.1s ease,transform 1.1s var(--ease)}
.cdin.in>*{opacity:1;transform:none}.cdin.in>*:nth-child(2){transition-delay:.35s}.cdin.in>*:nth-child(3){transition-delay:.7s}
.cdT{font:700 2.1em/1.4 var(--ar)}
html[lang=en] .cdT{font:600 2.1em/1.3 var(--en);font-style:italic}
.cdg{display:grid;grid-template-columns:repeat(4,1fr);gap:.55em;width:100%;margin-top:1.4em;direction:ltr}
.cdb{position:relative;aspect-ratio:.82;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cdb svg{position:absolute;inset:0;width:100%;height:100%;color:#c4a061}
.cdb b{position:relative;font:600 2.15em/1 var(--en);color:#8a6630}
.cdb small{position:relative;font:600 .95em var(--ar);color:#8a6630;margin-top:.2em}
html[lang=en] .cdb small{font:600 .95em var(--en);letter-spacing:.06em}
.cdDone{font:700 1.7em/1.6 var(--ar);margin-top:1.2em}
.hg{position:absolute;left:20.19%;top:52.66%;width:56.32%;height:22.14%;background:url(img/hourglass.webp) no-repeat center/100% 100%;opacity:0;transform:translateY(16px);transition:opacity 1.3s ease 1s,transform 1.3s var(--ease) 1s}
.cdin.in~.hg{opacity:1;transform:none}
.sand{position:absolute;left:51.9%;width:.5%;top:44.6%;height:24%;border-radius:2px;background:repeating-linear-gradient(180deg,rgba(205,160,80,.95) 0 3px,rgba(205,160,80,.2) 3px 6px);background-size:100% 12px;animation:fall .55s linear infinite}
@keyframes fall{to{background-position:0 12px}}
.shim{position:absolute;left:40%;width:24%;top:22%;height:16%;border-radius:50%;background:radial-gradient(closest-side,rgba(255,245,210,.5),transparent);mix-blend-mode:screen;animation:sh 3.6s ease-in-out infinite}
@keyframes sh{50%{opacity:.25}}


/* ---------- scenes 7–12 (same scroll) ---------- */
.pp{background-image:url(img/paper.webp)}
.al{background-image:url(img/archlily.webp)}
.blk{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center}
.blk>*{opacity:0;transform:translateY(16px);transition:opacity 1.1s ease,transform 1.1s var(--ease)}
.blk.in>*{opacity:1;transform:none}
.blk.in>*:nth-child(2){transition-delay:.3s}.blk.in>*:nth-child(3){transition-delay:.6s}.blk.in>*:nth-child(4){transition-delay:.9s}.blk.in>*:nth-child(5){transition-delay:1.2s}.blk.in>*:nth-child(6){transition-delay:1.5s}
.hS{font:400 3.3em/1.2 var(--scr);color:#9a7032}
.hS.ar{font:700 2.1em/1.5 var(--ar)}
.hA{font:700 1.5em/1.6 var(--ar);color:#7d5b2c}
.sm2{font:500 1.05em/1.7 var(--ar);color:var(--mute)}
html[lang=en] .sm2{font:italic 500 1.2em/1.5 var(--en)}
/* timeline */
.tl{position:relative;margin-top:1.4em;width:100%;max-width:19em;display:grid;gap:1.6em;padding:.6em 0}
.tl::before{content:"";position:absolute;top:0;bottom:0;left:38%;width:1.5px;background:#a07a3e;transform-origin:top;transform:scaleY(0);transition:transform 1.6s var(--ease) .4s}
.blk.in .tl::before{transform:scaleY(1)}
.tr{display:grid;grid-template-columns:38% 62%;align-items:center;direction:ltr;opacity:0;transform:translateY(10px);transition:opacity .9s ease,transform .9s var(--ease)}
.blk.in .tr{opacity:1;transform:none}
.tr b{font:600 1.75em var(--en);color:#7d5b2c;text-align:right;padding-right:1.1em}
.tr span{position:relative;font:italic 500 1.55em/1.25 var(--en);color:#6e4f26;text-align:left;padding-left:1.1em}
.tr span::before{content:"";position:absolute;left:-.22em;top:50%;width:.45em;height:.45em;margin-top:-.22em;border-radius:50%;background:#a07a3e}
html[lang=ar] .tr span{font:600 1.3em/1.4 var(--ar);font-style:normal}
/* venue */
.vimg{width:100%;aspect-ratio:4/5;border-radius:1.2em;background:#e7d6bd no-repeat center/cover;box-shadow:0 18px 30px -18px rgba(90,60,20,.55);margin-top:1em}
.vname{font:700 1.6em/1.5 var(--ar);color:#7d5b2c;margin-top:.2em}
html[lang=en] .vname{font:600 1.7em/1.3 var(--en)}
/* dress */
.guests{width:100%;aspect-ratio:941/830;background:url(img/guests.webp) no-repeat center/100% 100%;margin-top:.4em}
.sw4{display:flex;gap:.9em;justify-content:center;margin-top:.9em;flex-wrap:wrap}
.sw4 i{width:3.3em;height:3.3em;border-radius:50%;border:2px solid #d4b273;box-shadow:0 4px 10px -4px rgba(90,60,20,.45)}
/* rsvp */
.dl{position:relative;width:6.4em;aspect-ratio:.82;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:.7em 0 .3em}
.dl svg.fr{position:absolute;inset:0;width:100%;height:100%;color:#c4a061}
.dl svg.cal{position:relative;width:1.6em;height:1.6em;color:#9a7536}
.dl b{position:relative;font:600 2.3em/1 var(--en);color:#7d5b2c}
.dl small{position:relative;font:700 1em var(--ar);color:#7d5b2c}
.rbtns{display:grid;gap:.75em;width:100%;max-width:17em;margin-top:.9em}
.rb{display:flex;align-items:center;justify-content:center;gap:.6em;min-height:3em;border-radius:2em;font:600 1.1em var(--ar);cursor:pointer;border:1.5px solid #c9a463}
.rb.y{background:#565a2f;color:#fff8ea;box-shadow:0 8px 16px -10px rgba(50,50,20,.8)}
.rb.n{background:rgba(255,251,242,.85);color:#6e4f26}
.rb svg{width:1.4em;height:1.4em}
.rb.on{outline:2px solid #c9a463;outline-offset:3px}
html[lang=en] .rb{font:600 1.15em var(--en)}
.rform{display:grid;grid-template-columns:minmax(0,1fr);gap:.6em;width:100%;max-width:17em;margin-top:.8em}
.rform[hidden]{display:none}
.fld{display:flex;align-items:center;gap:.6em;min-height:2.9em;padding:0 1em;border-radius:2em;background:rgba(255,251,244,.92);border:1px solid rgba(176,138,76,.45)}
.fld input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-size:16px;color:var(--ink)}
.lb{flex:1;color:var(--mute);text-align:start}
.stp{display:flex;align-items:center;gap:.6em;direction:ltr}
.stp button{width:2em;height:2em;border-radius:50%;border:1px solid rgba(176,138,76,.5);background:#fffaf2;font-size:1.1em;color:#7d5b2c;cursor:pointer}
.stp b{font:600 1.2em var(--en);color:#7d5b2c;min-width:1em;text-align:center}
.send{min-height:2.9em;border-radius:2em;border:0;background:linear-gradient(170deg,#c8a466,#94703a);color:#fff;font:600 1.05em var(--ar);cursor:pointer}
.send[disabled]{opacity:.6}
.err{color:#a14a4a;font-size:.9em;min-height:1em}
.ok{display:flex;flex-direction:column;align-items:center;gap:.3em;margin-top:.8em}
.ok[hidden]{display:none}
.ok svg{width:2.8em;height:2.8em;color:#9a7536}
.ok b{font:700 1.5em/1.5 var(--ar);color:#7d5b2c}
.ok p{font-size:.92em;color:var(--mute);line-height:1.7;max-width:17em}
.ok button{margin-top:.4em;border:1px solid #c9a463;background:rgba(255,251,242,.85);color:#7d5b2c;font:600 .95em var(--ar);padding:.45em 1.2em;border-radius:2em;cursor:pointer}
/* map */
.map{position:relative;width:100%;aspect-ratio:1.85;border-radius:1.1em;overflow:hidden;border:1.5px solid #d4b273;background:#efe3cf;margin-top:1em;box-shadow:0 10px 22px -14px rgba(90,60,20,.5)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:sepia(.35) saturate(.85) brightness(1.04)}
.mbtn{display:flex;align-items:center;justify-content:center;gap:.6em;width:100%;min-height:3em;margin-top:1.1em;border-radius:2em;background:#565a2f;color:#fff8ea;border:1.5px solid #c9a463;font:600 1.05em var(--ar);text-decoration:none}
.mbtn svg{width:1.4em;height:1.4em}
/* thank you */
.ty{font:400 4.2em/1.1 var(--scr);color:#9a7032}
.tym{font:600 1.35em/1.9 var(--ar);color:#7d5b2c;white-space:pre-line}
html[lang=en] .tym{font:italic 600 1.45em/1.6 var(--en)}
.rings{width:6.5em;height:5em;color:#a07a3e;margin-top:.6em}
.rings .shine{animation:sh2 3.2s ease-in-out infinite}

  var G=en?(D.groomEn||D.groom):(D.groom||D.groomEn),B=en?(D.brideEn||D.bride):(D.bride||D.brideEn);

  if(/م|pm/i.test(ts)&&h<12)h+=12;if(/ص|am/i.test(ts)&&h===12)h=0;

  var v=en?(D.venueEn||D.venue):D.venue,a=en?(D.addrEn||D.addr):D.addr,ve=$("vVenue");ve.textContent="";
  var an=document.createElement("a");an.target="_blank";an.rel="noopener";an.textContent=v||"";
  an.href=D.map||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([D.venue,D.addr].filter(Boolean).join(" ")));ve.appendChild(an);
  if(a){var sm=document.createElement("small");sm.textContent=a;ve.appendChild(sm)}
  var dn=en?(D.dressEn||""):(D.dressNote||""),cols=(D.dress||[]).slice(0,5);

  var dots=$("dots");dots.innerHTML="";cols.forEach(function(c){var i=document.createElement("i");i.style.background=c;dots.appendChild(i)});
  $("dressWrap").hidden=!(cols.length||dn);
  $("cueT").textContent=t("scroll");$("fBism").textContent=t("bism");
  var intro=String(D.intro||"");$("fMsg").textContent=(!en&&intro)||t("msg");
  $("fG").textContent=G||"";$("fB").textContent=B||"";
  $("fWhen").textContent=$("vDate").textContent+" · "+$("vTime").textContent;
  var fw=$("fWhere");fw.textContent="";var fa=an.cloneNode(true);fw.appendChild(fa);if(a){var s2=document.createElement("small");s2.textContent=a;fw.appendChild(s2)}

  var g=$("cdg");g.innerHTML="";t("u").forEach(function(u,i){var c=document.createElement("div");c.className="cdb";
    c.innerHTML='<svg viewBox="0 0 82 100" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M41 3c4 5 10 7 16 7 3 0 5 2 5 5 0 4 3 6 7 6 4 0 7 3 7 7v44c0 4-3 7-7 7-4 0-7 2-7 6 0 3-2 5-5 5-6 0-12 2-16 7-4-5-10-7-16-7-3 0-5-2-5-5 0-4-3-6-7-6-4 0-7-3-7-7V28c0-4 3-7 7-7 4 0 7-2 7-6 0-3 2-5 5-5 6 0 12-2 16-7z" fill="rgba(255,251,242,.7)"/></svg><b>0</b><small></small>';
    c.querySelector("small").textContent=u;g.appendChild(c)});tick();
  /* 7 · programme */
  var pr=(D.program&&D.program.length)?D.program:(L?[]:t("defProg"));$("secProg").hidden=!pr.length;$("hProg").textContent=t("hProg");
  var tl=$("tl");tl.innerHTML="";pr.forEach(function(r,i){var d=document.createElement("div");d.className="tr";d.style.transitionDelay=(.7+i*.45)+"s";
    var b=document.createElement("b");b.textContent=r[0]||"";var sp=document.createElement("span");sp.textContent=r[1]||"";d.appendChild(b);d.appendChild(sp);tl.appendChild(d)});

  $("hVen").textContent=t("hVen");$("vName").textContent=v||"";$("vCity").textContent=a||"";
  $("vImg").style.backgroundImage="url('"+String(D.venuePhoto||"img/venue.webp").replace(/'/g,"%27")+"')";

  var by=D.rsvpBy?new Date(D.rsvpBy+"T12:00:00"):null;$("dlWrap").style.display=by&&!isNaN(by)?"flex":"none";

var au=$("bgm"),playing=false;if(D.music==="none"){au.removeAttribute("src");$("mu").hidden=true}else if(D.music)au.src=D.music;
function setMu(on){playing=on;$("mu").classList.toggle("off",!on);if(on){var pr=au.play();if(pr&&pr.catch)pr.catch(function(){setMu(false)})}else au.pause()}
$("mu").addEventListener("click",function(){setMu(!playing)});

var R=matchMedia("(prefers-reduced-motion:reduce)").matches?.15:1,TM=[];
function later(f,ms){TM.push(setTimeout(f,ms*R))}
var p4=$("p4"),p5=$("p5");
function story(){                        /* scene 4 → scene 5, then rest on the details */
  p4.classList.remove("out");p5.classList.remove("on","out");p4.classList.add("on");
  later(function(){p4.classList.add("out")},8500);
  later(function(){p4.classList.remove("on","out");p5.classList.add("on")},9500);
  later(function(){document.body.classList.add("done")},17500)}
$("replay").addEventListener("click",function(){TM.forEach(clearTimeout);TM=[];document.body.classList.remove("done");p5.classList.add("out");setTimeout(story,900)});

/* live countdown to the couple's date and time */
function tgt(){var ts=String(D.time||"20:00").replace(/[٠-٩]/g,function(c){return AD.indexOf(c)}),tp=ts.match(/\d+/g)||["20","00"],h=+tp[0]||0;
  if(/م|pm/i.test(ts)&&h<12)h+=12;if(/ص|am/i.test(ts)&&h===12)h=0;var d=new Date((D.date||"2027-01-01")+"T00:00:00");d.setHours(h,+(tp[1]||0),0,0);return d}
function tick(){var b=document.querySelectorAll("#cdg b");if(!b.length)return;var ms=tgt()-new Date();
  if(ms<=0){$("cdg").hidden=true;$("cdDone").hidden=false;return}$("cdg").hidden=false;$("cdDone").hidden=true;
  var s=Math.floor(ms/1000),v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
  b.forEach(function(e,i){e.textContent=v[i]})}
setInterval(tick,1000);

/* map: a real Google map of the couple's venue, loaded only when it comes into view */
function loadMap(){var m=$("map");if(m.firstChild)return;var q=[D.venue,D.addr].filter(Boolean).join(" ");
  var f=document.createElement("iframe");f.loading="lazy";f.referrerPolicy="no-referrer-when-downgrade";f.title=q;
  f.src="https://maps.google.com/maps?q="+encodeURIComponent(q)+"&z=15&output=embed&hl="+(lang==="en"?"en":"ar");m.appendChild(f)}
/* RSVP: real buttons, saved to Farhetna's replies */
var att=null,cntV=1,DEV=(function(){try{var k="farhetna_dev",v=localStorage.getItem(k);if(!v){v=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,v)}return v}catch(e){return""}})();
var RK="farhetna_rsvp_pgt_"+(D.slug||D.groom+D.date);
document.querySelectorAll(".rb").forEach(function(b){b.onclick=function(){att=b.getAttribute("data-a")==="1";
  document.querySelectorAll(".rb").forEach(function(x){x.classList.toggle("on",x===b)});$("rf").hidden=false;$("cntBox").style.display=att?"":"none";$("rn").focus()}});
$("minus").onclick=function(){if(cntV>1){cntV--;$("cnt").textContent=cntV}};$("plus").onclick=function(){if(cntV<10){cntV++;$("cnt").textContent=cntV}};
function waLink(r){var wa=String(D.wa||"").replace(/\D/g,"");if(!wa)return"";if(/^0/.test(wa))wa="2"+wa;
  var B=D.bride||D.brideEn,G=D.groom||D.groomEn,m=r.yes?("السلام عليكم 🤍\nأنا "+r.name+"، وبأكد حضوري فرح "+B+" و"+G+" إن شاء الله\nعدد الحضور: "+r.count):("السلام عليكم 🤍\nأنا "+r.name+"، وللأسف مش هقدر أحضر فرح "+B+" و"+G+". ألف مبروك!");
  return"https://wa.me/"+wa+"?text="+encodeURIComponent(m)}
function okShow(r,sub){$("rbtns").hidden=true;$("rf").hidden=true;$("ok").hidden=false;$("okB").textContent=r.yes?t("okY"):t("okN");$("okP").textContent=sub||t("okP")}
$("okE").onclick=function(){$("ok").hidden=true;$("rbtns").hidden=false;$("rf").hidden=false};
try{var prev=JSON.parse(localStorage.getItem(RK)||"null");if(prev&&MODE==="live"){$("rn").value=prev.name;att=prev.yes;cntV=prev.count||1;$("cnt").textContent=cntV;okShow(prev)}}catch(e){}
$("rf").onsubmit=function(e){e.preventDefault();if(att===null)return;var r={name:$("rn").value.trim(),yes:att,count:att?cntV:0,msg:""};$("err").textContent="";
  if(r.name.length<2){$("err").textContent=t("errName");$("rn").focus();return}
  if(MODE!=="live"){okShow(r,MODE==="preview"?t("prevNote"):t("demoNote"));return}
  var btn=$("send");btn.disabled=true;btn.textContent=t("sending");var fin=function(){btn.disabled=false;btn.textContent=t("send")};
  var toWa=function(){var w=waLink(r);if(w){$("err").textContent=t("toWa");setTimeout(function(){location.href=w},800)}else $("err").textContent=t("errNet");fin()};
  if(!D.slug){toWa();return}
  fetch(SB.url+"/rest/v1/rpc/add_rsvp",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.key,Authorization:"Bearer "+SB.key},
    body:JSON.stringify({p_slug:D.slug,p_name:r.name,p_attending:r.yes,p_guests:r.count,p_note:r.msg,p_device:DEV})})
  .then(function(res){if(!res.ok)throw new Error(res.status);return res.json()})
  .then(function(){try{localStorage.setItem(RK,JSON.stringify(r))}catch(e){}fin();okShow(r);if(navigator.vibrate)navigator.vibrate([8,30,8])}).catch(toWa)};
var more=$("more");
more.addEventListener("scroll",function(){if(more.scrollTop>30)document.body.classList.add("scrolled")},{passive:true});
function unlock(){more.removeAttribute("aria-hidden");
  var io="IntersectionObserver" in window?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{root:more,threshold:.2}):null;
  ["formal","cdin","bProg","bVen","bDress","bRsvp","bMap","bTy"].forEach(function(k){io?io.observe($(k)):$(k).classList.add("in")});
  var mo="IntersectionObserver" in window?new IntersectionObserver(function(es){if(es[0].isIntersecting){loadMap();mo.disconnect()}},{root:more,rootMargin:"0px 0px 400px 0px"}):null;mo?mo.observe($("map")):loadMap()}
var opened=false;
function open(){if(opened)return;opened=true;if(D.music!=="none")setMu(true);if(navigator.vibrate)navigator.vibrate(10);
  document.body.classList.add("go");                                  /* tap → the seal gives */
  later(function(){document.body.classList.add("go2")},450);          /* the seal releases */
  later(function(){document.body.classList.add("lift")},1100);        /* the flap lifts; the palace shows inside */
  later(function(){document.body.classList.add("inside")},3600);      /* we move through the opening */
  later(function(){document.body.classList.add("gone");unlock()},7200);
  later(story,6600)}
$("seal").addEventListener("click",open);
$("seal").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});
if(/[?&]open=1/.test(location.search)){opened=true;document.body.classList.add("go","go2","lift","inside","gone");unlock();story()}
})();
