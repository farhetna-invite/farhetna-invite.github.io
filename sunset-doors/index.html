<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sunset Doors · فرحتنا</title>
<meta name="theme-color" content="#f3e6d6">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preload" as="image" href="img/clean.webp" fetchpriority="high">
<link rel="preload" as="image" href="img/scene.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--gold:#a07d45;--gold2:#7d5b2c;--ink:#5e4a33;--mute:#8f7a62;--line:rgba(160,125,69,.35);--paper:#f3e6d6;
  --ar:"Noto Naskh Arabic",serif;--ruq:"Aref Ruqaa","Noto Naskh Arabic",serif;--en:"Cormorant Garamond",Georgia,serif;--scr:"Pinyon Script",cursive;
  --ease:cubic-bezier(.45,.05,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-feature-settings:"lnum" 1}
html,body{height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ar);color:var(--ink)}
/* the artwork is always shown whole; spare space above/below is the same picture, softly blurred */
.fill{position:fixed;inset:-40px;background:no-repeat center/cover;filter:blur(22px) saturate(.95);transform:scale(1.08)}
#fScene{background-image:url(img/scene.webp)}
#fDoor{background-image:url(img/clean.webp);transition:opacity 1.6s ease .8s}
body.open #fDoor{opacity:0}
.stg{position:fixed;left:50%;top:50%;width:min(100vw,100svh*941/1672);aspect-ratio:941/1672;transform:translate(-50%,-50%);perspective:1700px;perspective-origin:50% 48%}
.lay{position:absolute;inset:0;background:no-repeat center/100% 100%}

/* ---------- scene behind the doors ---------- */
#world{position:absolute;inset:0;transform-origin:49.4% 43.9%;transform:scale(1.18);filter:blur(3px) brightness(.97);transition:transform 3.4s var(--ease),filter 2.6s ease}
body.open #world{transform:scale(1);filter:none}
body.zoom #world{transform:scale(1.36);transition:transform 2.6s var(--ease)}
#scene{background-image:url(img/scene.webp)}
.flick{position:absolute;width:3%;height:2.4%;border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.85),rgba(255,200,120,0) 70%);mix-blend-mode:screen;animation:fl 2.2s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:.55;transform:scale(1)}40%{opacity:.95;transform:scale(1.15)}70%{opacity:.7;transform:scale(.95)}}

/* ---------- the doors: a real bow unties (separate ribbon layers), then both leaves swing open ---------- */
#door{position:absolute;inset:0;transform-origin:50% 54%;perspective:1600px;perspective-origin:50% 50%;transition:transform 3.4s cubic-bezier(.45,0,.55,1),opacity 1s ease}
#door .fr{position:absolute;inset:0;background:url(img/clean.webp) no-repeat center/100% 100%;z-index:3;pointer-events:none;
  clip-path:polygon(0 0,28.9% 0,27.1% 4.2%,22.3% 9%,14.9% 12.9%,6.4% 15.3%,2.9% 15.7%,2.9% 95.7%,97% 95.7%,97% 15.7%,93.6% 15.3%,85.1% 12.9%,77.7% 9%,72.9% 4.2%,71.1% 0,100% 0,100% 100%,0 100%)}
.lf{position:absolute;inset:0;background:url(img/clean.webp) no-repeat center/100% 100%;transition:transform 4s cubic-bezier(.62,0,.38,1),filter 4s ease;will-change:transform}
.lf.l{clip-path:inset(0 50% 4.3% 2.9%);transform-origin:2.9% 50%}
.lf.r{clip-path:inset(0 3% 4.3% 50%);transform-origin:97% 50%}
#bow{position:absolute;inset:0;z-index:2;pointer-events:none}
#bow i{position:absolute;background-repeat:no-repeat;background-size:100% 100%;will-change:transform,opacity}
#rTL{background-image:url(img/r_tailL.webp);left:32.412%;top:49.222%;width:18.597%;height:26.914%;transform-origin:85% 0}
#rTR{background-image:url(img/r_tailR.webp);left:50.159%;top:49.222%;width:17.428%;height:25.897%;transform-origin:15% 0}
#rLL{background-image:url(img/r_loopL.webp);left:35.813%;top:45.156%;width:12.752%;height:6.160%;transform-origin:100% 50%}
#rLR{background-image:url(img/r_loopR.webp);left:52.604%;top:45.156%;width:11.796%;height:6.160%;transform-origin:0 50%}
#rK{background-image:url(img/r_knot.webp);left:47.396%;top:47.189%;width:6.270%;height:2.572%;transform-origin:50% 50%}
/* 1 · a gentle tug on the knot */
body.untie #rK{animation:kTug .5s ease-in-out,kGo 1s cubic-bezier(.5,0,.7,1) 1.9s forwards}
body.untie #rTL{animation:tPullL .5s ease-in-out,tFallL 1.05s cubic-bezier(.55,0,.9,.6) 1.9s forwards}
body.untie #rTR{animation:tPullR .5s ease-in-out,tFallR 1.05s cubic-bezier(.55,0,.9,.6) 1.95s forwards}
/* 2 · the loops slide through the knot and collapse */
body.untie #rLL{animation:lGoL 1.7s cubic-bezier(.55,0,.6,1) .45s forwards}
body.untie #rLR{animation:lGoR 1.7s cubic-bezier(.55,0,.6,1) .55s forwards}
@keyframes kTug{40%{transform:scale(1.05) translateY(-2%)}}
@keyframes kGo{30%{transform:scale(.86) rotate(-6deg)}100%{transform:scale(.45) translateY(60%) rotate(-14deg);opacity:0}}
@keyframes tPullL{40%{transform:rotate(1.6deg)}}
@keyframes tPullR{40%{transform:rotate(-1.6deg)}}
@keyframes lGoL{0%{transform:none}35%{transform:scaleX(.72) scaleY(.92) rotate(3deg)}70%{transform:scaleX(.3) scaleY(.7) rotate(8deg);opacity:1}100%{transform:scaleX(.04) scaleY(.4) rotate(12deg);opacity:0}}
@keyframes lGoR{0%{transform:none}35%{transform:scaleX(.72) scaleY(.92) rotate(-3deg)}70%{transform:scaleX(.3) scaleY(.7) rotate(-8deg);opacity:1}100%{transform:scaleX(.04) scaleY(.4) rotate(-12deg);opacity:0}}
/* 3 · the freed ends slip down and fall away, swaying like fabric */
@keyframes tFallL{0%{transform:none}18%{transform:translateY(6%) rotate(2deg)}40%{transform:translateY(30%) rotate(-2.5deg)}62%{transform:translateY(80%) rotate(2deg)}82%{transform:translateY(150%) rotate(-1.5deg)}100%{transform:translateY(240%) rotate(1deg)}}
@keyframes tFallR{0%{transform:none}18%{transform:translateY(6%) rotate(-2deg)}40%{transform:translateY(30%) rotate(2.5deg)}62%{transform:translateY(80%) rotate(-2deg)}82%{transform:translateY(150%) rotate(1.5deg)}100%{transform:translateY(240%) rotate(-1deg)}}
/* 4 · then both leaves open slowly and together */
body.open .lf.l{transform:rotateY(-86deg);filter:brightness(.86)}
body.open .lf.r{transform:rotateY(86deg);filter:brightness(.86)}
body.through #door{transform:scale(1.65);opacity:0;transition:transform 3s cubic-bezier(.45,0,.55,1),opacity 1.1s ease 1.6s}
#tap{position:absolute;left:28%;right:28%;top:42%;height:30%;border:0;background:none;cursor:pointer;border-radius:40%}
#tap::after{content:"";position:absolute;inset:18%;border-radius:50%;box-shadow:0 0 0 0 rgba(255,250,236,.7);animation:br 2.6s ease-in-out infinite}
@keyframes br{50%{box-shadow:0 0 0 18px rgba(255,250,236,0)}}
.hint{position:absolute;left:0;right:0;top:66%;text-align:center;color:var(--gold2);font-size:min(4vw,1.9svh);text-shadow:0 1px 6px rgba(255,248,236,.9);animation:pl 2.4s ease-in-out infinite;transition:opacity .4s}
@keyframes pl{50%{opacity:.5}}
body.untie #tap::after,body.untie .hint{animation:none;opacity:0}
body.gone #door,body.gone #tap,body.gone .hint{display:none}

/* ---------- text inside the gold oval ---------- */
.txt{position:absolute;left:25%;right:25%;top:25.5%;bottom:32.5%;font-size:min(3.05vw,1.42svh);color:var(--ink)}
.txt::before{content:"";position:absolute;inset:-6% -14%;background:radial-gradient(closest-side,rgba(250,242,228,.72),rgba(250,242,228,0));pointer-events:none}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s ease}
.sl.on{opacity:1;pointer-events:auto}
.sl>*{opacity:0;transform:translateY(10px);filter:blur(4px);transition:opacity 1.2s ease,transform 1.2s var(--ease),filter 1.2s ease}
.sl.on>*{opacity:1;transform:none;filter:none}
.sl.on>*:nth-child(2){transition-delay:1.1s}.sl.on>*:nth-child(3){transition-delay:2.2s}.sl.on>*:nth-child(4){transition-delay:3.3s}
.sl.on>*:nth-child(5){transition-delay:4.4s}
.s1.on>*:nth-child(2){transition-delay:.7s}.s1.on>*:nth-child(3){transition-delay:1.2s}.s1.on>*:nth-child(4){transition-delay:1.7s}.s1.on>*:nth-child(5){transition-delay:2.1s}.s1.on>*:nth-child(6){transition-delay:2.5s}
.s1>*+*{margin-top:.35em}.sl.on>*:nth-child(6){transition-delay:5.5s}.sl.on>*:nth-child(7){transition-delay:6.6s}
.sl>*+*{margin-top:.55em}
/* slide 1: script initials, names, date */
.ini{position:relative;direction:ltr;line-height:1;height:8.6em;width:13em}
.ini span,.ini i{font-family:var(--en);font-style:italic;font-weight:500;background:linear-gradient(170deg,#d2b06e,#9a7234 55%,#c49d5a);-webkit-background-clip:text;background-clip:text;color:transparent}
#iniA{font-size:6em;position:absolute;left:23%;top:0}
.ini i{font-size:3em;position:absolute;left:47%;top:30%}
#iniB{font-size:6em;position:absolute;left:58%;top:28%}
.sprig{position:absolute;left:4%;top:24%;width:3.6em;height:4.2em;color:#b8914f}
.dv,.dv2,.dv3{display:flex;align-items:center;justify-content:center;gap:.4em;color:#b08a4c;width:13em}
.dv b,.dv2 b,.dv3 b{flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor 30%,currentColor 70%,transparent)}
.dv svg{width:1.3em;height:1.1em;flex:none}.dv2 svg{width:2.6em;height:.9em;flex:none}.dv3{width:7em}.dv3 svg{width:1.8em;height:.7em;flex:none}
.nm1{font:700 2.2em/1.3 var(--ruq);white-space:nowrap;background:linear-gradient(170deg,#c8a466,#8a6630 60%,#b89155);-webkit-background-clip:text;background-clip:text;color:transparent}
html[lang=en] .nm1{font:400 2.3em/1.2 var(--scr)}
/* old monogram */
.mono{position:relative;width:8.2em;height:8.2em;display:grid;place-items:center}
.mono svg{position:absolute;inset:0;width:100%;height:100%;color:var(--gold)}
.mono b{font:700 4.6em/1 var(--ruq);background:linear-gradient(170deg,#c8a466,#8a6630 60%,#b89155);-webkit-background-clip:text;background-clip:text;color:transparent;transform:translateY(-.06em)}
.lat{font:500 1.15em var(--en);letter-spacing:.32em;color:var(--mute);direction:ltr;white-space:nowrap}
.dt{font:600 1.75em var(--en);letter-spacing:.06em;color:#8a6630;direction:ltr;word-spacing:.15em}
/* slide 2 */
.bism{font:400 1.55em/1.6 "Amiri Quran","Amiri",serif;color:var(--gold2);white-space:nowrap}
.poem{font:400 1.06em/2 var(--ar);color:var(--ink);white-space:pre-line}
.inv{font:500 1.12em/1.8 var(--ar);color:var(--ink)}
.names{display:flex;align-items:center;justify-content:center;gap:.35em;white-space:nowrap}
.names span{font:700 2.35em/1.3 var(--ruq);background:linear-gradient(170deg,#c8a466,#8a6630 60%,#b89155);-webkit-background-clip:text;background-clip:text;color:transparent}
.names svg{width:2.3em;height:1.5em;color:var(--gold);flex:none}
/* slide 3 */
.lead{font:500 1.15em/1.6 var(--ar);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.9em 1.6em;align-items:start}
.it{display:flex;flex-direction:column;align-items:center;gap:.2em;font-size:.98em;line-height:1.45;color:var(--ink)}
.it svg{width:2.1em;height:2.1em;color:var(--gold2)}
.it small{color:var(--mute);font-size:.92em}
.it.full{grid-column:1/-1}
.it a{color:inherit;text-decoration:none}
.closing{font:600 1.08em/1.7 var(--ar);color:var(--ink)}
.notes{font:500 1em/1.6 var(--ar);color:var(--mute)}
.nokid{width:1.9em;height:1.9em;color:var(--gold2)}
html[lang=en] .poem,html[lang=en] .inv,html[lang=en] .lead,html[lang=en] .closing,html[lang=en] .notes{font-family:var(--en);font-size:1.18em;font-style:italic}
html[lang=en] .names span{font:400 2.4em/1.2 var(--scr)}
html[lang=en] .bism{font:italic 500 1.1em/1.5 var(--en);white-space:normal}
html[lang=en] .it{font:500 1.08em/1.4 var(--en)}


/* ---------- below the hero: countdown, dress code, reply ---------- */
#more{position:fixed;inset:0;z-index:20;overflow:hidden;pointer-events:none;-webkit-overflow-scrolling:touch}
body.gone #more{overflow-y:auto;pointer-events:auto}
.spacer{height:100svh}
.pg{position:relative;min-height:100svh;background:#f4e4d0 url(img/wall.webp) no-repeat center/cover;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:19svh 19% 25svh 10%;text-align:center;font-size:min(4vw,1.9svh)}
.pg+.pg{margin-top:-1px}
.pg:first-of-type{box-shadow:0 -30px 40px -10px rgba(120,90,50,.18)}
.pg h2{font:700 2.2em/1.3 var(--ruq);background:linear-gradient(170deg,#c8a466,#8a6630 60%,#b89155);-webkit-background-clip:text;background-clip:text;color:transparent}
html[lang=en] .pg h2{font:400 2.5em/1.2 var(--scr)}
.pg .sub{color:var(--mute);margin-top:.3em;line-height:1.7}
.orn2{width:9em;height:1.1em;color:#b08a4c;margin:.5em auto .2em;display:block}
.rv{opacity:0;transform:translateY(16px);transition:opacity 1s ease,transform 1s var(--ease)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.15s}.rv.d2{transition-delay:.3s}.rv.d3{transition-delay:.45s}
/* countdown */
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:.6em;margin-top:1.2em;width:100%;max-width:20em}
.cd div{aspect-ratio:1;border-radius:50%;border:1px solid rgba(176,138,76,.6);box-shadow:inset 0 0 0 4px rgba(255,250,240,.6),0 6px 16px -8px rgba(120,90,50,.35);
  background:radial-gradient(circle at 50% 35%,#fffaf1,#f3e3c9);display:flex;flex-direction:column;align-items:center;justify-content:center}
.cd b{font:600 1.7em/1 var(--en);color:#7d5b2c}
.cd small{font-size:.72em;color:var(--mute);margin-top:.2em}
.cdDone{font:700 1.6em var(--ruq);color:#8a6630;margin-top:1em}
/* dress code: fabric ribbons that unfurl */
.drs{display:flex;justify-content:center;gap:.7em;margin-top:1.3em;height:11em;align-items:flex-start}
.fab{position:relative;width:2.6em;height:100%;cursor:pointer;transform-origin:50% 0}
.fab .rod{position:absolute;left:-.25em;right:-.25em;top:0;height:.45em;border-radius:.3em;background:linear-gradient(#e2c98f,#a9833f);box-shadow:0 1px 2px rgba(0,0,0,.2);z-index:2}
.fab .cl{position:absolute;left:0;right:0;top:.2em;bottom:0;transform-origin:50% 0;transform:scaleY(0);transition:transform 1.4s cubic-bezier(.3,1.25,.4,1);
  clip-path:polygon(0 0,100% 0,100% 92%,82% 97%,62% 93%,42% 99%,22% 94%,0 98%);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.05)}
.fab .cl::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.14),rgba(255,255,255,.28) 30%,rgba(0,0,0,.05) 55%,rgba(255,255,255,.22) 75%,rgba(0,0,0,.12));
  background-size:200% 100%;animation:sheen 5s ease-in-out infinite}
@keyframes sheen{50%{background-position:100% 0}}
.drs.in .fab .cl{transform:scaleY(1)}
.drs.in .fab:nth-child(2) .cl{transition-delay:.15s}.drs.in .fab:nth-child(3) .cl{transition-delay:.3s}.drs.in .fab:nth-child(4) .cl{transition-delay:.45s}.drs.in .fab:nth-child(5) .cl{transition-delay:.6s}.drs.in .fab:nth-child(6) .cl{transition-delay:.75s}
.fab.sw .cl{animation:sway 1.6s ease-in-out}
@keyframes sway{20%{transform:scaleY(1) rotate(5deg)}45%{transform:scaleY(1) rotate(-4deg)}70%{transform:scaleY(1) rotate(2deg)}}
.dnote{margin-top:1.1em;color:var(--ink);line-height:1.8}
.tapc{font-size:.8em;color:var(--mute);margin-top:.5em}
/* reply */
form{display:grid;grid-template-columns:minmax(0,1fr);gap:.75em;width:100%;max-width:18em;margin:1.2em auto 0;text-align:start}
.yn{min-width:0}
.fld{display:flex;align-items:center;gap:.6em;min-height:3em;padding:0 1em;border-radius:2em;background:rgba(255,251,244,.85);border:1px solid rgba(176,138,76,.4)}
.fld>svg{width:1.25em;height:1.25em;flex:none;color:#a07d45}
#rn{flex:1;min-width:0;border:0;background:transparent;outline:none;font:inherit;font-size:16px;color:var(--ink)}
.lb{flex:1;color:var(--mute)}
.stp{display:flex;align-items:center;gap:.6em;direction:ltr}
.stp button{width:2em;height:2em;border-radius:50%;border:1px solid rgba(176,138,76,.5);background:#fffaf2;font-size:1.1em;line-height:1;color:#7d5b2c;cursor:pointer}
.stp b{font:600 1.25em var(--en);color:#7d5b2c;min-width:1em;text-align:center}
.yns{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.yn{position:relative;display:flex;flex-direction:column;align-items:center;gap:.15em;padding:.65em .4em;border-radius:1.4em;border:1px solid rgba(176,138,76,.4);background:rgba(255,251,244,.85);cursor:pointer;color:var(--ink);text-align:center;font-size:.92em}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn i{font-style:normal;width:1.9em;height:1.9em;border-radius:50%;border:1.5px solid #a07d45;display:grid;place-items:center;color:#7d5b2c}
.yn.on{box-shadow:0 0 0 2px #b08a4c;background:#fbf0de}
#note{background:none;border:0;color:#7d5b2c;font:inherit;font-size:.9em;text-decoration:underline;cursor:pointer}
#rm{width:100%;min-height:5em;border:1px solid rgba(176,138,76,.4);border-radius:1.2em;background:rgba(255,251,244,.85);padding:.7em .9em;font:inherit;font-size:16px;outline:none;resize:vertical}
.hide{display:none!important}
.err{color:#a14a4a;font-size:.9em;min-height:1.1em;text-align:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:3em;padding:0 1.4em;border-radius:2em;border:1px solid #a07d45;background:rgba(255,251,244,.9);color:#7d5b2c;font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn.gbtn{background:linear-gradient(170deg,#c8a466,#94703a);color:#fff;border:0;box-shadow:0 8px 18px -10px rgba(120,90,50,.7)}
.btn svg{width:1.1em;height:1.1em}
#send{width:100%}#send[disabled]{opacity:.6}
.done{display:none;margin-top:1em;flex-direction:column;align-items:center}
.done.on{display:flex;animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.done svg{width:3em;height:3em;color:#a07d45}
.done .big{font:700 1.7em/1.5 var(--ruq);color:#8a6630}
.done .sm{font-size:.9em;color:var(--mute);line-height:1.7}
.done .row{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;margin-top:.8em}
.rsvp-on #rf{display:none}
.thx{font:500 1.15em/1.9 var(--ar);color:var(--ink)}
.thx b{display:block;font:700 2.2em/1.4 var(--ruq);background:linear-gradient(170deg,#c8a466,#8a6630 60%,#b89155);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:.2em}
html[lang=en] .thx{font:italic 500 1.3em/1.6 var(--en)}html[lang=en] .thx b{font:400 2.2em/1.2 var(--scr);font-style:normal}
.foot{margin-top:2em;font-size:.85em}.foot a{color:var(--mute);text-decoration:none;border-bottom:1px dotted var(--line)}
/* scroll cue on the hero */
.cue{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;align-items:center;gap:2px;color:#7d5b2c;font-size:13px;
  background:rgba(255,250,242,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 14px 4px;border-radius:20px;border:1px solid var(--line);opacity:0;pointer-events:none;transition:opacity .8s}
.cue svg{width:16px;height:16px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
body.cueOn .cue{opacity:1}
body.scrolled .cue{opacity:0}

/* chrome */
.ctl{position:fixed;z-index:60;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,250,242,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--gold2);display:grid;place-items:center;cursor:pointer}

var tgt=(function(){var ts=String(D.time||"20:00").replace(/[٠-٩]/g,function(c){return AD.indexOf(c)}),tp=ts.match(/\d+/g)||["20","00"],h=+tp[0]||0;
  if(/م|pm/i.test(ts)&&h<12)h+=12;if(/ص|am/i.test(ts)&&h===12)h=0;var d=new Date((D.date||"2027-01-01")+"T00:00:00");d.setHours(h,+(tp[1]||0),0,0);return d})();
function num(n){return lang==="en"?String(n):String(n).replace(/\d/g,function(x){return AD[x]})}
function tick(){var ms=tgt-new Date();if(ms<=0){$("cd").classList.add("hide");$("cdDone").classList.remove("hide");return}
  var s=Math.floor(ms/1000);$("cdD").textContent=num(Math.floor(s/86400));$("cdH").textContent=num(Math.floor(s%86400/3600));$("cdM").textContent=num(Math.floor(s%3600/60));$("cdS").textContent=num(s%60)}
tick();setInterval(tick,1000);
$("cal").onclick=function(){var p=function(x){return(x<10?"0":"")+x},dt=tgt,f=function(d){return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+p(d.getHours())+p(d.getMinutes())+"00"};
  var end=new Date(dt.getTime()+4*3600e3),G=D.groom||D.groomEn,B=D.bride||D.brideEn;
  var ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Farhetna//EN\r\nBEGIN:VEVENT\r\nUID:"+Date.now()+"@farhetna\r\nDTSTART:"+f(dt)+"\r\nDTEND:"+f(end)+"\r\nSUMMARY:"+(lang==="en"?"Wedding of ":"فرح ")+B+" & "+G+"\r\nLOCATION:"+[D.venue,D.addr].filter(Boolean).join(" - ")+"\r\nEND:VEVENT\r\nEND:VCALENDAR";
  var a=document.createElement("a");a.href="data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);a.download="farhetna.ics";document.body.appendChild(a);a.click();a.remove()};
/* reply */
var DEV=(function(){try{var k="farhetna_dev",v=localStorage.getItem(k);if(!v){v=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,v)}return v}catch(e){return""}})();
var RK="farhetna_rsvp_snd_"+(D.slug||D.groom+D.date);
function att(){return document.querySelector('input[name=att]:checked').value==="1"}
function ynSync(){document.querySelectorAll(".yn").forEach(function(l){l.classList.toggle("on",l.querySelector("input").checked)})}
document.querySelectorAll('input[name=att]').forEach(function(r){r.onchange=function(){$("cntBox").style.visibility=att()?"":"hidden";ynSync()}});
$("note").onclick=function(){$("note").classList.add("hide");$("rm").classList.remove("hide");$("rm").focus()};
function showCnt(){$("cnt").textContent=num(cntV)}
$("minus").onclick=function(){if(cntV>1){cntV--;showCnt()}};$("plus").onclick=function(){if(cntV<10){cntV++;showCnt()}};
function waLink(r){var wa=String(D.wa||"").replace(/\D/g,"");if(!wa)return"";if(/^0/.test(wa))wa="2"+wa;
  var B=D.bride||D.brideEn,G=D.groom||D.groomEn,m=r.yes?("السلام عليكم 🤍\nأنا "+r.name+"، وبأكد حضوري فرح "+B+" و"+G+" إن شاء الله\nعدد الحضور: "+r.count):("السلام عليكم 🤍\nأنا "+r.name+"، وللأسف مش هقدر أحضر فرح "+B+" و"+G+". ألف مبروك!");
  if(r.msg)m+="\n"+r.msg;return"https://wa.me/"+wa+"?text="+encodeURIComponent(m)}
function done(r,sub){$("rsvp").classList.add("rsvp-on");$("done").classList.add("on");$("dBig").textContent=r.yes?t("okYes"):t("okNo");$("dSub").textContent=sub||t("okSub");
  var w=waLink(r);$("dWa").classList.toggle("hide",!w||MODE!=="live");if(w)$("dWa").href=w}
$("dEdit").onclick=function(){$("done").classList.remove("on");$("rsvp").classList.remove("rsvp-on");$("rn").focus()};
try{var prev=JSON.parse(localStorage.getItem(RK)||"null");if(prev&&MODE==="live"){$("rn").value=prev.name;cntV=prev.count||1;showCnt();
  document.querySelector('input[name=att][value="'+(prev.yes?1:0)+'"]').checked=true;$("cntBox").style.visibility=prev.yes?"":"hidden";ynSync();$("rm").value=prev.msg||"";done(prev)}}catch(e){}
$("rf").onsubmit=function(e){e.preventDefault();var r={name:$("rn").value.trim(),yes:att(),count:att()?cntV:0,msg:$("rm").value.trim()};$("err").textContent="";
  if(r.name.length<2){$("err").textContent=t("errName");$("rn").focus();return}
  if(MODE!=="live"){done(r,MODE==="preview"?t("prevNote"):t("demoNote"));$("dWa").classList.add("hide");return}
  var btn=$("send"),lbl=btn.querySelector("span");btn.disabled=true;lbl.textContent=t("sending");
  var finish=function(){btn.disabled=false;lbl.textContent=t("send")};
  var toWa=function(){var w=waLink(r);if(w){$("err").textContent=t("toWa");setTimeout(function(){location.href=w},800)}else $("err").textContent=t("errNet");finish()};
  if(!D.slug){toWa();return}
  fetch(SB.url+"/rest/v1/rpc/add_rsvp",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.key,Authorization:"Bearer "+SB.key},
    body:JSON.stringify({p_slug:D.slug,p_name:r.name,p_attending:r.yes,p_guests:r.count,p_note:r.msg,p_device:DEV})})
  .then(function(res){if(!res.ok)throw new Error(res.status);return res.json()})
  .then(function(){try{localStorage.setItem(RK,JSON.stringify(r))}catch(e){}finish();done(r);if(navigator.vibrate)navigator.vibrate([8,30,8])})
  .catch(toWa)};
function unlock(){more.removeAttribute("aria-hidden");revealAll()}
var opened=false,R=matchMedia("(prefers-reduced-motion:reduce)").matches?.15:1;
function later(f,ms){setTimeout(f,ms*R)}
function open(){if(opened)return;opened=true;if(D.music!=="none")setMu(true);if(navigator.vibrate)navigator.vibrate(10);
  document.body.classList.add("untie");                                   /* ribbon unties: 0 → 3s */
  later(function(){document.body.classList.add("open")},3050);             /* doors open only after the ribbon is gone */
  later(function(){document.body.classList.add("through")},5750);
  later(function(){document.body.classList.add("zoom")},7550);
  later(function(){document.body.classList.add("gone");unlock()},8150);
  later(function(){document.body.classList.add("cueOn")},20750);
  later(function(){show(0)},9350)}
$("tap").addEventListener("click",open);
if(/[?&]open=1/.test(location.search)){document.body.classList.add("untie","open","through","gone","zoom","cueOn");unlock();show(0)}
})();
</script>
</body>
</html>
