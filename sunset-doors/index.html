<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sunset Doors · فرحتنا</title>
<meta name="theme-color" content="#f3e6d6">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preload" as="image" href="img/doors.webp" fetchpriority="high">
<link rel="preload" as="image" href="img/untie.webp">
<link rel="preload" as="image" href="img/ajar.webp">
<link rel="preload" as="image" href="img/scene.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--gold:#a07d45;--gold2:#7d5b2c;--ink:#5e4a33;--mute:#8f7a62;--line:rgba(160,125,69,.35);--paper:#f3e6d6;
  --ar:"Noto Naskh Arabic",serif;--ruq:"Aref Ruqaa","Noto Naskh Arabic",serif;--en:"Cormorant Garamond",Georgia,serif;--scr:"Pinyon Script",cursive;
  --ease:cubic-bezier(.45,.05,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-feature-settings:"lnum" 1}
html,body{height:100%;background:var(--paper);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ar);color:var(--ink)}
/* the artwork is always shown whole; spare space above/below is the same picture, softly blurred */
.fill{position:fixed;inset:-40px;background:no-repeat center/cover;filter:blur(22px) saturate(.95);transform:scale(1.08)}
#fScene{background-image:url(img/scene.webp)}
#fDoor{background-image:url(img/doors.webp);transition:opacity 1.6s ease .8s}
body.open #fDoor{opacity:0}
.stg{position:fixed;left:50%;top:50%;width:min(100vw,100svh*941/1672);aspect-ratio:941/1672;transform:translate(-50%,-50%);perspective:1700px;perspective-origin:50% 48%}
.lay{position:absolute;inset:0;background:no-repeat center/100% 100%}

/* ---------- scene behind the doors ---------- */
#world{position:absolute;inset:0;transform-origin:49.4% 43.9%;transform:scale(1.18);filter:blur(3px) brightness(.97);transition:transform 3.4s var(--ease),filter 2.6s ease}
body.open #world{transform:scale(1);filter:none}
body.zoom #world{transform:scale(1.36);transition:transform 2.6s var(--ease)}
#scene{background-image:url(img/scene.webp)}
.flick{position:absolute;width:3%;height:2.4%;border-radius:50%;background:radial-gradient(circle,rgba(255,226,160,.85),rgba(255,200,120,0) 70%);mix-blend-mode:screen;animation:fl 2.2s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:.55;transform:scale(1)}40%{opacity:.95;transform:scale(1.15)}70%{opacity:.7;transform:scale(.95)}}

/* ---------- the doors: closed → ribbon unties → doors ajar → leaves swing in ---------- */
#closed,#ajar{position:absolute;inset:0;transform-origin:50% 54%}
#closed{transition:transform 3.2s cubic-bezier(.4,0,.6,1),opacity .9s ease}
#closed .a,#closed .b{position:absolute;inset:0;background:no-repeat center/100% 100%}
#closed .a{background-image:url(img/doors.webp)}
#closed .b{background-image:url(img/untie.webp);opacity:0;transition:opacity 1.6s ease .2s}
body.untie #closed{transform:scale(1.14)}
body.untie #closed .b{opacity:1}
body.ajar #closed{opacity:0}
#ajar{perspective:1500px;opacity:0;transform:scale(.97);transition:opacity .9s ease,transform 3.2s cubic-bezier(.45,0,.55,1)}
.leaf{position:absolute;inset:0;background:url(img/ajar.webp) no-repeat center/100% 100%;transition:transform 2.9s cubic-bezier(.5,.05,.3,1),filter 2.9s ease}
.leaf.l{clip-path:inset(0 56.3% 1.6% 0);transform-origin:0 50%}
.leaf.r{clip-path:inset(0 0 1.6% 59.1%);transform-origin:100% 50%}
body.ajar #ajar{opacity:1;transform:scale(1)}
body.open #ajar{transform:scale(1.7);opacity:0;transition:transform 3.2s cubic-bezier(.45,0,.55,1),opacity 1s ease 2.2s}
body.open .leaf.l{transform:rotateY(82deg);filter:brightness(.9)}
body.open .leaf.r{transform:rotateY(-82deg);filter:brightness(.9)}
#tap{position:absolute;left:28%;right:28%;top:42%;height:30%;border:0;background:none;cursor:pointer;border-radius:40%}
#tap::after{content:"";position:absolute;inset:18%;border-radius:50%;box-shadow:0 0 0 0 rgba(255,250,236,.7);animation:br 2.6s ease-in-out infinite}
@keyframes br{50%{box-shadow:0 0 0 18px rgba(255,250,236,0)}}
.hint{position:absolute;left:0;right:0;top:66%;text-align:center;color:var(--gold2);font-size:min(4vw,1.9svh);text-shadow:0 1px 6px rgba(255,248,236,.9);animation:pl 2.4s ease-in-out infinite;transition:opacity .4s}
@keyframes pl{50%{opacity:.5}}
body.untie #tap::after,body.untie .hint{animation:none;opacity:0}
body.gone #closed,body.gone #ajar,body.gone #tap,body.gone .hint{display:none}

/* ---------- text inside the gold oval ---------- */
.txt{position:absolute;left:25%;right:25%;top:25.5%;bottom:32.5%;font-size:min(3.05vw,1.42svh);color:var(--ink)}
.txt::before{content:"";position:absolute;inset:-6% -14%;background:radial-gradient(closest-side,rgba(250,242,228,.72),rgba(250,242,228,0));pointer-events:none}
.sl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s ease}
.sl.on{opacity:1;pointer-events:auto}
.sl>*{opacity:0;transform:translateY(10px);filter:blur(4px);transition:opacity 1.2s ease,transform 1.2s var(--ease),filter 1.2s ease}
.sl.on>*{opacity:1;transform:none;filter:none}
.sl.on>*:nth-child(2){transition-delay:1.1s}.sl.on>*:nth-child(3){transition-delay:2.2s}.sl.on>*:nth-child(4){transition-delay:3.3s}
.sl.on>*:nth-child(5){transition-delay:4.4s}
.s1.on>*:nth-child(2){transition-delay:.7s}.s1.on>*:nth-child(3){transition-delay:1.2s}.s1.on>*:nth-child(4){transition-delay:1.7s}.s1.on>*:nth-child(5){transition-delay:2.1s}.s1.on>*:nth-child(6){transition-delay:2.5s}
.s1>*+*{margin-top:.35em}.sl.on>*:nth-child(6){transition-delay:5.5s}.sl.on>*:nth-child(7){transition-delay:6.6s}
.sl>*+*{margin-top:.55em}
/* slide 1: script initials, names, date */
.ini{position:relative;direction:ltr;line-height:1;height:8.6em;width:13em}
.ini span,.ini i{font-family:var(--scr);font-style:normal;background:linear-gradient(170deg,#d2b06e,#9a7234 55%,#c49d5a);-webkit-background-clip:text;background-clip:text;color:transparent}
#iniA{font-size:6.6em;position:absolute;left:24%;top:-2%}
.ini i{font-size:2.8em;position:absolute;left:47%;top:34%}
#iniB{font-size:6.6em;position:absolute;left:56%;top:30%}
.sprig{position:absolute;left:4%;top:24%;width:3.6em;height:4.2em;color:#b8914f}
.dv,.dv2,.dv3{display:flex;align-items:center;justify-content:center;gap:.4em;color:#b08a4c;width:13em}
.dv b,.dv2 b,.dv3 b{flex:1;height:1px;background:linear-gradient(90deg,transparent,currentColor 30%,currentColor 70%,transparent)}
.dv svg{width:1.3em;height:1.1em;flex:none}.dv2 svg{width:2.6em;height:.9em;flex:none}.dv3{width:7em}.dv3 svg{width:1.8em;height:.7em;flex:none}
.nm1{font:700 2.2em/1.3 var(--ruq);white-space:nowrap;background:linear-gradient(170deg,#c8a466,#8a6630 60%,#b89155);-webkit-background-clip:text;background-clip:text;color:transparent}
html[lang=en] .nm1{font:400 2.3em/1.2 var(--scr)}
/* old monogram */
.mono{position:relative;width:8.2em;height:8.2em;display:grid;place-items:center}
.mono svg{position:absolute;inset:0;width:100%;height:100%;color:var(--gold)}
.mono b{font:700 4.6em/1 var(--ruq);background:linear-gradient(170deg,#c8a466,#8a6630 60%,#b89155);-webkit-background-clip:text;background-clip:text;color:transparent;transform:translateY(-.06em)}
.lat{font:500 1.15em var(--en);letter-spacing:.32em;color:var(--mute);direction:ltr;white-space:nowrap}
.dt{font:600 1.75em var(--en);letter-spacing:.06em;color:#8a6630;direction:ltr;word-spacing:.15em}
/* slide 2 */
.bism{font:400 1.55em/1.6 "Amiri Quran","Amiri",serif;color:var(--gold2);white-space:nowrap}
.poem{font:400 1.06em/2 var(--ar);color:var(--ink);white-space:pre-line}
.inv{font:500 1.12em/1.8 var(--ar);color:var(--ink)}
.names{display:flex;align-items:center;justify-content:center;gap:.35em;white-space:nowrap}
.names span{font:700 2.35em/1.3 var(--ruq);background:linear-gradient(170deg,#c8a466,#8a6630 60%,#b89155);-webkit-background-clip:text;background-clip:text;color:transparent}
.names svg{width:2.3em;height:1.5em;color:var(--gold);flex:none}
/* slide 3 */
.lead{font:500 1.15em/1.6 var(--ar);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.9em 1.6em;align-items:start}
.it{display:flex;flex-direction:column;align-items:center;gap:.2em;font-size:.98em;line-height:1.45;color:var(--ink)}
.it svg{width:2.1em;height:2.1em;color:var(--gold2)}
.it small{color:var(--mute);font-size:.92em}
.it.full{grid-column:1/-1}
.it a{color:inherit;text-decoration:none}
.closing{font:600 1.08em/1.7 var(--ar);color:var(--ink)}
.notes{font:500 1em/1.6 var(--ar);color:var(--mute)}
.nokid{width:1.9em;height:1.9em;color:var(--gold2)}
html[lang=en] .poem,html[lang=en] .inv,html[lang=en] .lead,html[lang=en] .closing,html[lang=en] .notes{font-family:var(--en);font-size:1.18em;font-style:italic}
html[lang=en] .names span{font:400 2.4em/1.2 var(--scr)}
html[lang=en] .bism{font:italic 500 1.1em/1.5 var(--en);white-space:normal}
html[lang=en] .it{font:500 1.08em/1.4 var(--en)}

/* chrome */
.ctl{position:fixed;z-index:60;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,250,242,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--gold2);display:grid;place-items:center;cursor:pointer}
#lg{top:max(14px,env(safe-area-inset-top));right:14px;font:600 14px var(--en)}
#mu{bottom:max(16px,env(safe-area-inset-bottom));left:14px}
#mu svg{width:20px;height:20px}
#mu .bars rect{transform-origin:center bottom;animation:eq 1s ease-in-out infinite}
#mu .bars rect:nth-child(2){animation-delay:-.4s}#mu .bars rect:nth-child(3){animation-delay:-.7s}#mu .bars rect:nth-child(4){animation-delay:-.2s}
#mu.off .bars rect{animation:none;transform:scaleY(.35)}
@keyframes eq{50%{transform:scaleY(.35)}}
.flag{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:60;background:var(--gold2);color:#fff;font:500 12px var(--ar);padding:5px 12px;border-radius:20px}
@media (prefers-reduced-motion:reduce){.flick,#tap::after,.hint,#mu .bars rect{animation:none}.leaf,#closed,#ajar,#world{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
<body>
<div class="fill" id="fScene"></div><div class="fill" id="fDoor"></div>
<div class="stg" id="stg">
  <div id="world"><div class="lay" id="scene"></div>

  <i class="flick" style="left:91.6%;top:64.6%"></i><i class="flick" style="left:84.6%;top:72.4%"></i><i class="flick" style="left:77.2%;top:78.6%"></i><i class="flick" style="left:13%;top:82.6%"></i>
  <div class="txt" id="txt">

      <div class="dv"><b></b><svg viewBox="0 0 24 20" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 17C6 12.6 3 9.6 3 6.4A4.2 4.2 0 0 1 12 4.6 4.2 4.2 0 0 1 21 6.4c0 3.2-3 6.2-9 10.6z"/></svg><b></b></div>
      <div class="nm1"><span id="n1G"></span> &amp; <span id="n1B"></span></div>
      <div class="dv2"><b></b><svg viewBox="0 0 40 12" fill="none" stroke="currentColor" stroke-width="1"><path d="M20 2c-3 0-4 4-7 4S9 3 6 6M20 2c3 0 4 4 7 4s4-3 7 0M20 2v8"/><circle cx="20" cy="6" r="1.6" fill="currentColor"/></svg><b></b></div>

    </div>
    <div class="sl">
      <div class="bism" id="bism"></div>
      <div class="poem" id="poem"></div>
      <div class="inv" id="inv"></div>
      <div class="names"><span id="nG"></span><svg viewBox="0 0 60 40" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="23" cy="23" r="12"/><circle cx="37" cy="23" r="12"/><path d="M33 10l4-5 4 5-4 3z" fill="currentColor" fill-opacity=".25"/></svg><span id="nB"></span></div>
    </div>
    <div class="sl">
      <div class="lead" id="lead"></div>

      </div>
      <div class="closing" id="closing"></div>
      <div class="notes" id="notes"></div>
      <svg class="nokid" id="nokid" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="10"/><path d="M5 5l14 14"/><circle cx="12" cy="8.2" r="1.8"/><path d="M9.3 18.5v-4.2l-1.6-2.1M14.7 18.5v-4.2l1.6-2.1M9.3 12.3h5.4"/></svg>
    </div>
  </div></div>
  <div id="closed"><div class="a"></div><div class="b"></div></div>
  <div id="ajar"><div class="leaf l"></div><div class="leaf r"></div></div>

  <div class="hint" id="hint"></div>
</div>
<button class="ctl" id="lg" type="button" aria-label="اللغة / Language">EN</button>
<button class="ctl off" id="mu" type="button" aria-label="Music"><svg class="bars" viewBox="0 0 20 20" fill="currentColor"><rect x="3" y="5" width="2" height="11" rx="1"/><rect x="7.5" y="3" width="2" height="13" rx="1"/><rect x="12" y="6" width="2" height="10" rx="1"/><rect x="16" y="4" width="2" height="12" rx="1"/></svg></button>

<script>
(function(){
"use strict";
/* demo data — replaced by the couple's details from the studio */
var D={groom:"سامح",bride:"تمارا",groomEn:"Sameh",brideEn:"Tamara",mono:"",date:"2026-11-29",time:"20:00",
  venue:"قاعة الأفراح",venueEn:"The Grand Hall",addr:"",addrEn:"",map:"",intro:"",kind:"",closing:"",notes:"جنة الأطفال منازلهم",music:"",lang:"ar"};
var L=window.farhetnaData&&farhetnaData("snd");
if(L){D=Object.assign({},D,{notes:""},L);D.lang=(L.groom||L.bride)?"ar":"en"}
var MODE=window.farhetnaMode||null,$=function(i){return document.getElementById(i)};
var lang=(function(){var q=location.search.match(/[?&]lang=(ar|en)/);return q?q[1]:(D.lang==="en"?"en":"ar")})();
var AD="٠١٢٣٤٥٦٧٨٩";
function ev(en){var k=String(D.kind||"");
  if(/خطوب|engag/i.test(k))return en?"engagement":"خطوبة";
  if(/كتب|قران|katb/i.test(k))return en?"marriage ceremony":"عقد قران";
  if(/حن|henna/i.test(k))return en?"henna night":"حنة";
  return en?"wedding":"زفاف"}
var T={
 ar:{tap:"المسوا الفيونكة لفتح الدعوة",bism:"بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ",
   poem:"ابتدأ العمر بك، وبدأت الحكاية معك\nفكان اللقاء قدرًا، وكانت السعادة أنت",
   inv:"نتشرف بدعوتكم لحضور حفل ",lead:"وذلك بمشيئة الله تعالى",tl:"الساعة",closing:"بحضوركم يتم لنا الفرح والسرور",
   pm:"مساءً",am:"صباحًا",demo:"تجربة",open:"افتح الدعوة"},
 en:{tap:"Tap the bow to open",bism:"In the name of God, the Most Gracious, the Most Merciful",
   poem:"Life began with you, and our story began together;\nmeeting you was fate, and happiness was you",
   inv:"We are honoured to invite you to our ",lead:"God willing, we will celebrate on",tl:"Time",closing:"Your presence completes our joy",
   pm:"PM",am:"AM",demo:"Demo",open:"Open the invitation"}};
function t(k){return T[lang][k]}
function render(){
  var en=lang==="en";document.documentElement.lang=lang;document.documentElement.dir=en?"ltr":"rtl";
  $("lg").textContent=en?"ع":"EN";$("hint").textContent=t("tap");$("tap").setAttribute("aria-label",t("open"));
  $("demoFlag").textContent=t("demo");$("demoFlag").hidden=!!MODE;
  var G=en?(D.groomEn||D.groom):(D.groom||D.groomEn),B=en?(D.brideEn||D.bride):(D.bride||D.brideEn);
  var gE=D.groomEn||G,bE=D.brideEn||B;
  var mi=(D.mono||"").replace(/[^A-Za-z]/g,"");
  $("iniA").textContent=(mi.charAt(0)||gE.charAt(0)||"").toUpperCase();$("iniB").textContent=(mi.charAt(1)||bE.charAt(0)||"").toUpperCase();
  $("n1G").textContent=G||"";$("n1B").textContent=B||"";
  var d=new Date((D.date||"2027-01-01")+"T12:00:00"),p=function(x){return(x<10?"0":"")+x};
  var dot=d.getFullYear()+"."+p(d.getMonth()+1)+"."+p(d.getDate());
  $("dt").textContent=p(d.getDate())+" . "+p(d.getMonth()+1)+" . "+d.getFullYear();
  $("bism").textContent=t("bism");
  var intro=String(D.intro||"");if(/^يتشرف أهل العروسين/.test(intro))intro="";

  $("nG").textContent=B||"";$("nB").textContent=G||"";

  if(/م|pm/i.test(ts)&&h<12)h+=12;if(/ص|am/i.test(ts)&&h===12)h=0;
  $("tl").textContent=t("tl");$("time").textContent=(h%12||12)+":"+(tp[1]||"00")+" "+(h>=12?t("pm"):t("am"));
  var v=en?(D.venueEn||D.venue):D.venue,a=en?(D.addrEn||D.addr):D.addr;
  $("venue").textContent=v||"";$("addr").textContent=a||"";$("addr").hidden=!a;
  $("venue").href=D.map||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([D.venue,D.addr].filter(Boolean).join(" ")));
  $("closing").textContent=(!en&&D.closing)||t("closing");
  var n=en?"":String(D.notes||"");$("notes").textContent=n;$("notes").hidden=!n;
  $("nokid").style.display=/أطفال|اطفال|children|kids/i.test(n)?"":"none";
}
render();
$("lg").addEventListener("click",function(){lang=lang==="en"?"ar":"en";render()});

var au=$("bgm"),playing=false;if(D.music==="none"){au.removeAttribute("src");$("mu").hidden=true}else if(D.music)au.src=D.music;
function setMu(on){playing=on;$("mu").classList.toggle("off",!on);if(on){var pr=au.play();if(pr&&pr.catch)pr.catch(function(){setMu(false)})}else au.pause()}
$("mu").addEventListener("click",function(){setMu(!playing)});

/* slides inside the oval: same order and pacing as the reference */
var SL=[].slice.call(document.querySelectorAll(".sl")),cur=-1,timer=null,DUR=[6500,10500,0];
function show(i){if(cur>=0)SL[cur].classList.remove("on");cur=i;
  setTimeout(function(){SL[cur].classList.add("on")},cur===i&&i>0?700:0);
  clearTimeout(timer);if(cur<SL.length-1)timer=setTimeout(function(){show(cur+1)},DUR[cur])}
$("txt").addEventListener("click",function(e){if(!document.body.classList.contains("open")||e.target.closest("a"))return;show((cur+1)%SL.length)});

var opened=false,R=matchMedia("(prefers-reduced-motion:reduce)").matches?.15:1;
function later(f,ms){setTimeout(f,ms*R)}
function open(){if(opened)return;opened=true;if(D.music!=="none")setMu(true);if(navigator.vibrate)navigator.vibrate(10);
  document.body.classList.add("untie");
  later(function(){document.body.classList.add("ajar")},2200);
  later(function(){document.body.classList.add("open")},3300);
  later(function(){document.body.classList.add("zoom")},6200);
  later(function(){document.body.classList.add("gone")},6600);
  later(function(){show(0)},8200)}
$("tap").addEventListener("click",open);
if(/[?&]open=1/.test(location.search)){document.body.classList.add("untie","ajar","open","gone","zoom");show(0)}
})();
</script>
</body>
