<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#140709">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@700&display=swap" rel="stylesheet">
<style>
:root{--gold:#e9cd8c;--gold2:#c79a4b;--gold3:#f8e7bd;--ink:#f6ead2}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;font-family:"Amiri",serif;color:var(--ink);background:radial-gradient(120% 60% at 50% 0%,#3a1218,#140709 60%) fixed;padding:28px 16px 60px}
.w{max-width:460px;margin:0 auto}
h1{font-family:"Aref Ruqaa",serif;font-size:34px;color:var(--gold);text-align:center;line-height:1.3}
.sub{text-align:center;color:var(--gold3);opacity:.8;font-size:16px;margin:4px 0 22px}
.card{padding:22px 18px;border-radius:22px;background:linear-gradient(180deg,rgba(70,22,28,.55),rgba(30,9,12,.75));border:1px solid rgba(233,205,140,.45);box-shadow:0 20px 40px rgba(0,0,0,.45)}
label{display:block;font-size:16px;color:var(--gold3);margin-bottom:8px}
input{width:100%;padding:14px;border-radius:14px;border:1px solid rgba(233,205,140,.5);background:rgba(15,5,7,.6);color:var(--ink);font:inherit;font-size:20px;text-align:center;letter-spacing:2px;direction:ltr;outline:none}
input:focus{border-color:var(--gold)}
.btn{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:999px;font:inherit;font-size:18px;font-weight:700;color:#3a1309;background:linear-gradient(180deg,#f8e2a6,#d8aa58 55%,#b98535);cursor:pointer}
.btn:disabled{opacity:.6}
.btn.g{background:none;border:1px solid rgba(233,205,140,.5);color:var(--gold3);font-weight:400;font-size:15px;padding:10px}
.err{min-height:22px;margin-top:10px;text-align:center;color:#ffb4a8;font-size:15px}
.ok{color:#bfe3b4}
</style><title>ردود الحضور · د. أحمد & الآنسة إسراء</title>
<style>
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 14px}
.sum div{padding:12px 4px;border-radius:16px;text-align:center;background:rgba(15,5,7,.5);border:1px solid rgba(233,205,140,.35)}
.sum b{display:block;font-size:30px;color:var(--gold);line-height:1.2}
.sum span{font-size:14px;color:var(--gold3);opacity:.8}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:9px 4px;border-radius:999px;border:1px solid rgba(233,205,140,.35);background:none;color:var(--gold3);font:inherit;font-size:15px}
.tabs button.on{background:rgba(233,205,140,.2);border-color:var(--gold)}
.row{padding:12px 14px;border-radius:16px;background:rgba(15,5,7,.45);border:1px solid rgba(233,205,140,.2);margin-top:8px}
.row .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:18px}
.row .s{font-size:14px;white-space:nowrap}
.row .y{color:#bfe3b4}.row .n{color:#ffb4a8}
.row .nt{margin-top:6px;font-size:15px;opacity:.85;line-height:1.7}
.row .d{margin-top:4px;font-size:12.5px;opacity:.5}
.empty{text-align:center;padding:16px;opacity:.7}
#out{display:none}
</style></head><body><div class="w">
<h1>ردود الحضور</h1><p class="sub">د. أحمد &amp; الآنسة إسراء · الجمعة ٢٧ نوفمبر</p>
<div class="card" id="login"><label for="c">اكتب الكود اللي وصلك من فرحتنا</label>
<input id="c" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="الكود">
<button class="btn" id="go">عرض الردود</button><p class="err" id="m"></p></div>
<div id="out"><div class="sum"><div><b id="sY">٠</b><span>هيحضروا</span></div><div><b id="sP">٠</b><span>عدد الأفراد</span></div><div><b id="sN">٠</b><span>معتذرين</span></div></div>
<div class="tabs"><button class="on" data-f="all">الكل</button><button data-f="y">هيحضروا</button><button data-f="n">معتذرين</button></div>
<div id="list"></div><button class="btn g" id="re">تحديث 🔄</button><button class="btn g" id="lo">خروج</button></div>
</div>
<script>
var SB={url:"https://fjoyqftndulavcjcxaya.supabase.co",key:"sb_publishable_RaxsucJi-Mlswbr0ZCQSKw_GAq79mui"};function rpc(n,a){return fetch(SB.url+"/rest/v1/rpc/"+n,{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.key,Authorization:"Bearer "+SB.key},body:JSON.stringify(a)}).then(function(r){return r.text().then(function(t){var j;try{j=JSON.parse(t)}catch(e){j=t}if(!r.ok)throw new Error((j&&j.message)||t||r.status);return j})})}
var $=function(i){return document.getElementById(i)},AD="٠١٢٣٤٥٦٧٨٩",K="farhetna_ae_code",rows=[],f="all";
function ar(n){return String(n).replace(/\d/g,function(d){return AD[d]})}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dt(s){try{var d=new Date(s);return d.toLocaleDateString("ar-EG",{day:"numeric",month:"long"})+"، "+d.toLocaleTimeString("ar-EG",{hour:"numeric",minute:"2-digit"})}catch(e){return""}}
function draw(){var y=rows.filter(function(x){return x.attending});
  $("sY").textContent=ar(y.length);$("sP").textContent=ar(y.reduce(function(a,x){return a+(x.guests||1)},0));$("sN").textContent=ar(rows.length-y.length);
  var v=rows.filter(function(x){return f==="all"||(f==="y")===!!x.attending});
  $("list").innerHTML=v.length?v.map(function(x){return '<div class="row"><div class="t"><b>'+esc(x.name)+'</b><span class="s '+(x.attending?'y':'n')+'">'+(x.attending?'هيحضر · '+ar(x.guests||1)+' '+((x.guests||1)>2&&(x.guests||1)<11?'أفراد':'فرد'):'معتذر')+'</span></div>'+(x.note?'<p class="nt">'+esc(x.note)+'</p>':'')+(x.created_at?'<p class="d">'+dt(x.created_at)+'</p>':'')+'</div>'}).join(""):'<p class="empty">لسه محدش رد</p>'}
document.querySelectorAll(".tabs button").forEach(function(b){b.onclick=function(){f=b.dataset.f;document.querySelectorAll(".tabs button").forEach(function(x){x.classList.toggle("on",x===b)});draw()}});
function load(code){var m=$("m");m.textContent="";$("go").disabled=true;$("go").textContent="بنجيب الردود…";
  rpc("rsvps_by_code",{p_code:code}).then(function(r){rows=(r||[]).slice().sort(function(a,b){return String(b.created_at||"").localeCompare(String(a.created_at||""))});
    try{localStorage.setItem(K,code)}catch(e){}$("login").style.display="none";$("out").style.display="block";draw()})
  .catch(function(){m.textContent="الكود مش صحيح أو في مشكلة في النت، جرّب تاني";try{localStorage.removeItem(K)}catch(e){}})
  .then(function(){$("go").disabled=false;$("go").textContent="عرض الردود"})}
$("go").onclick=function(){var c=$("c").value.trim().toUpperCase();if(c.length<6){$("m").textContent="اكتب الكود";return}load(c)};
$("re").onclick=function(){var c=null;try{c=localStorage.getItem(K)}catch(e){}if(c)load(c)};
$("lo").onclick=function(){try{localStorage.removeItem(K)}catch(e){}location.reload()};
try{var s=localStorage.getItem(K);if(s){$("c").value=s;load(s)}}catch(e){}
</script></body></html>
