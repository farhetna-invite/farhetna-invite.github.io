<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3e0610">
<title>Burgundy Bloom · Interactive · فرحتنا (معاينة)</title>
<link rel="preload" as="image" href="img/top.webp">
<link rel="preload" as="image" href="img/bot.webp">
<link rel="preload" as="image" href="img/seal.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --burg:#640b15;--burg2:#7a1424;--deep:#3e0610;--paper:#f4e2d4;--ivory:#fbf3ea;--ivory2:#f8ece2;--line:rgba(100,11,21,.5);--cream:#f6e6d8;
  --script:"Pinyon Script",cursive;--serif:"Cormorant Garamond",Georgia,serif;--ar:"Noto Naskh Arabic","Amiri",serif;--ruq:"Aref Ruqaa",serif;
  --i-top:url(img/top.webp);--i-bot:url(img/bot.webp);--i-seal:url(img/seal.webp);--i-card:url(img/card.webp);
  --i-paper:url(img/paper.webp);--i-velvet:url(img/velvet.webp);--i-ltl:url(img/leaf-tl.webp);--i-lbr:url(img/leaf-br.webp);
  --ease:cubic-bezier(.22,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--deep);overscroll-behavior:none}
body{font-family:var(--serif);color:var(--burg);-webkit-tap-highlight-color:transparent;touch-action:none}
html[dir=rtl] body{font-family:var(--ar)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
.velvet{background:var(--deep) var(--i-velvet) center/276px auto}
.velvet::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 65% at 50% 45%,rgba(130,18,34,.38),rgba(16,0,4,.6));pointer-events:none}
.paperbg{background:var(--paper) var(--i-paper) center/600px auto}
.paperbg::before{content:"";position:absolute;inset:0;background:radial-gradient(100% 70% at 50% 40%,rgba(255,250,244,.35),rgba(120,60,50,.12));pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===================== GATE (approved cover) ===================== */
.gate{position:fixed;inset:0;z-index:50;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--paper) var(--i-paper) center/520px auto}
.gate::after{content:"";position:absolute;inset:0;background:var(--deep) var(--i-velvet) center/276px auto;opacity:0;transition:opacity 1.1s ease}
.gate.st-dark::after{opacity:1}
.gate.gone{display:none}
.stage{position:relative;z-index:1;width:min(100vw,56.28svh);aspect-ratio:941/1672}
.pnl{position:absolute;left:0;width:100%;background-size:100% 100%;will-change:transform;filter:drop-shadow(0 8px 14px rgba(40,4,10,.35));transition:transform 1.9s cubic-bezier(.66,0,.22,1)}
.pnl.top{top:0;height:calc(854 / 1672 * 100%);background-image:var(--i-top);z-index:3}
.pnl.bot{top:calc(804 / 1672 * 100%);height:calc(868 / 1672 * 100%);background-image:var(--i-bot);z-index:4}
.pnl.top::before,.pnl.bot::after{content:"";position:absolute;left:0;right:0;height:60vh;background-image:inherit;background-size:100% auto}
.pnl.top::before{bottom:calc(100% - 1px);background-position:top;transform:scaleY(-1)}
.pnl.bot::after{top:calc(100% - 1px);background-position:bottom;transform:scaleY(-1)}
.gseal{position:absolute;z-index:6;left:calc(284 / 941 * 100%);top:calc(667 / 1672 * 100%);width:calc(331 / 941 * 100%);aspect-ratio:331/322;background:var(--i-seal) center/100% 100% no-repeat;filter:drop-shadow(0 7px 9px rgba(40,4,10,.45));transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.gtap{position:absolute;z-index:8;left:50%;top:calc(828 / 1672 * 100%);width:calc(420 / 941 * 100%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%}
.gring{position:absolute;z-index:5;left:50%;top:calc(828 / 1672 * 100%);width:calc(340 / 941 * 100%);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;animation:ring 3.4s ease-in-out 1.6s infinite}
@keyframes ring{0%,62%{box-shadow:0 0 0 0 rgba(255,244,228,0)}74%{box-shadow:0 0 0 2px rgba(255,244,228,.75),0 0 26px 6px rgba(255,236,214,.45)}100%{box-shadow:0 0 0 18px rgba(255,244,228,0)}}
.gshine{position:absolute;z-index:7;left:calc(284 / 941 * 100%);top:calc(667 / 1672 * 100%);width:calc(331 / 941 * 100%);aspect-ratio:331/322;pointer-events:none;-webkit-mask:var(--i-seal) center/100% 100%;mask:var(--i-seal) center/100% 100%;
  background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.7) 50%,transparent 62%) 160% 0/300% 100% no-repeat;animation:shine 3.4s ease-in-out 1.2s infinite}
@keyframes shine{0%{background-position:160% 0}45%,100%{background-position:-60% 0}}
.pcard{position:absolute;z-index:2;left:50%;top:50%;width:62%;aspect-ratio:881/1321;transform:translate(-50%,-50%) scale(.42);opacity:0;background:var(--i-card) center/100% 100% no-repeat;filter:drop-shadow(0 18px 26px rgba(40,4,10,.38))}
.ghint{position:absolute;z-index:9;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;pointer-events:none;transition:opacity .5s}
.ghint span,.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;background:rgba(251,243,234,.92);color:var(--burg);font:600 15.5px var(--serif);letter-spacing:.05em;box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
html[dir=rtl] .ghint span,html[dir=rtl] .pill{font:600 15px var(--ar);letter-spacing:0}
.ghint span{animation:hintIn 1s ease 1.2s both}
.ghint svg,.pill svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
@keyframes hintIn{from{opacity:0;transform:translateY(8px)}}
.gate.st-press .gseal{transform:scale(.94)}
.gate.st-press .gring,.gate.st-press .gshine{animation:none;opacity:0}
.gate.st-press .ghint{opacity:0}
.gate.st-free .gseal{transform:translateY(-10%) scale(1.14) rotate(-7deg);opacity:0;transition:transform .9s var(--ease),opacity .7s ease .15s}
.gate.st-part .pnl.top{transform:translateY(-104%)}
.gate.st-part .pnl.bot{transform:translateY(104%)}
.gate.st-card .pcard{opacity:1;transform:translate(-50%,-50%) scale(.72);transition:opacity .9s ease,transform 1.6s var(--ease)}
.gate.st-fade{opacity:0;transition:opacity .7s ease;pointer-events:none}

/* ===================== DECK (8 scenes) ===================== */
.deck{position:fixed;inset:0;overflow:hidden}
.track{position:absolute;inset:0;transition:transform .75s cubic-bezier(.65,0,.2,1);will-change:transform}
.scene{position:absolute;left:0;right:0;height:100%;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(54px + env(safe-area-inset-top)) 22px calc(96px + env(safe-area-inset-bottom))}
.scene>*{position:relative}
.scene{text-align:center}
/* entrance of the active scene's content */
.scene .in{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .8s var(--ease)}
.scene.act .in{opacity:1;transform:none}
.scene.act .in.d1{transition-delay:.15s}.scene.act .in.d2{transition-delay:.3s}.scene.act .in.d3{transition-delay:.45s}.scene.act .in.d4{transition-delay:.6s}
.kick{font:600 11.5px var(--serif);letter-spacing:.34em;text-transform:uppercase;opacity:.75}
html[dir=rtl] .kick{font:600 13.5px var(--ar);letter-spacing:0}
.ttl{font:400 44px/1.15 var(--script);margin:2px 0 4px}
html[dir=rtl] .ttl{font:700 30px/1.5 var(--ruq)}
.on-v{color:var(--cream)}
.dvd{display:flex;align-items:center;gap:10px;width:150px;margin:6px auto 0}
.dvd i{flex:1;height:1px;background:currentColor;opacity:.55}.dvd svg{width:24px;height:auto;fill:currentColor}
.tapme{position:absolute;inset:-10px;border-radius:inherit;pointer-events:none;animation:tapme 2.6s ease-in-out infinite}
@keyframes tapme{0%,55%{box-shadow:0 0 0 0 rgba(122,20,36,0)}70%{box-shadow:0 0 0 3px rgba(122,20,36,.28)}100%{box-shadow:0 0 0 16px rgba(122,20,36,0)}}
.on-v .tapme{animation-name:tapmeL}
@keyframes tapmeL{0%,55%{box-shadow:0 0 0 0 rgba(255,240,228,0)}70%{box-shadow:0 0 0 3px rgba(255,240,228,.4)}100%{box-shadow:0 0 0 16px rgba(255,240,228,0)}}
.done .tapme{display:none}
.hintx{margin-top:12px;font:italic 500 15px var(--serif);opacity:.7;transition:opacity .4s}
html[dir=rtl] .hintx{font:500 14px var(--ar);font-style:normal}
.done .hintx{opacity:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 24px;border-radius:999px;background:linear-gradient(135deg,#7d1626,#4d0812);color:#fbefe4;
  font:600 15.5px var(--serif);letter-spacing:.07em;box-shadow:0 12px 22px -12px rgba(62,6,16,.85),inset 0 1px 0 rgba(255,255,255,.15)}
html[dir=rtl] .btn{font:600 15px var(--ar);letter-spacing:0}
.btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn.iv{background:linear-gradient(180deg,#fbf3ea,#efdccb);color:var(--burg);box-shadow:0 12px 22px -12px rgba(0,0,0,.6)}
.btn.ghost{background:transparent;color:var(--burg);box-shadow:inset 0 0 0 1px var(--line)}

/* --- 1. reveal / welcome --- */
#s-reveal{justify-content:center;gap:clamp(14px,2.6svh,26px)}
.rcard{width:min(80vw,46svh,400px);aspect-ratio:881/1321;container-type:inline-size;background:var(--i-card) center/100% 100% no-repeat;filter:drop-shadow(0 22px 30px rgba(10,0,2,.55));position:relative}
.rcard>*{position:absolute;left:0;right:0;text-align:center;color:var(--burg)}
.r-lead{top:22%;font:600 3.2cqw/1.7 var(--serif);letter-spacing:.24em;text-transform:uppercase}
.r-names{top:30.5%;font:400 13cqw/1.2 var(--script);white-space:nowrap}
.r-names .amp{font-size:.62em}
.ni{display:inline-block;white-space:nowrap}
.r-div{top:50%;width:52%;margin:0 auto;display:flex;align-items:center;gap:2.4cqw}
.r-div i{flex:1;height:1px;background:var(--burg);opacity:.8}.r-div svg{width:8cqw;fill:var(--burg)}
.r-msg{top:56%;font:italic 500 5.2cqw/1.5 var(--serif);padding:0 15%}
html[dir=rtl] .r-lead{font:600 4cqw/1.7 var(--ar);letter-spacing:0;top:21%}
html[dir=rtl] .r-names{font:700 11cqw/1.35 var(--ruq)}
html[dir=rtl] .r-names .amp{font-family:var(--script)}
html[dir=rtl] .r-msg{font:500 4.6cqw/1.8 var(--ar);font-style:normal}
.rcard>*{opacity:0;transform:translateY(1.4cqw);filter:blur(3px);transition:opacity 1s ease,transform 1.1s var(--ease),filter 1s ease}
body.shown .rcard>*{opacity:1;transform:none;filter:none}
body.shown .r-names{transition-delay:.25s}body.shown .r-div{transition-delay:.5s}body.shown .r-msg{transition-delay:.7s}
.quick{display:flex;gap:clamp(10px,4vw,20px);opacity:0;transform:translateY(10px);transition:opacity .8s ease 1.1s,transform .8s var(--ease) 1.1s}
body.shown .quick{opacity:1;transform:none}
.quick button{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--cream);font:600 11px var(--serif);letter-spacing:.14em;text-transform:uppercase}
html[dir=rtl] .quick button{font:600 12px var(--ar);letter-spacing:0}
.quick i{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fffaf3,#ead6c4);color:var(--burg);box-shadow:0 6px 14px -6px rgba(0,0,0,.6),inset 0 -2px 3px rgba(100,11,21,.15)}
.quick svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* --- 2. calendar --- */
.cal{width:min(86vw,360px);border-radius:14px;background:linear-gradient(180deg,#fdf7f0,#f3e3d4);box-shadow:0 26px 40px -24px rgba(60,8,16,.55),0 0 0 1px rgba(100,11,21,.12),inset 0 1px 0 #fff;position:relative;margin-top:14px;perspective:1200px}
.cal::before,.cal::after{content:"";position:absolute;top:-9px;width:12px;height:22px;border-radius:6px;background:linear-gradient(90deg,#8a1b2c,#4d0812);box-shadow:0 2px 3px rgba(0,0,0,.3);z-index:3}
.cal::before{left:24%}.cal::after{right:24%}
.cal-hd{border-radius:14px 14px 0 0;padding:16px 0 12px;text-align:center;color:var(--cream);position:relative;overflow:hidden}
.cal-hd b{display:block;font:400 34px/1.1 var(--script)}
html[dir=rtl] .cal-hd b{font:700 24px/1.5 var(--ruq)}
.cal-hd span{font:600 13px var(--serif);letter-spacing:.32em}
.cal-body{position:relative;padding:12px 14px 16px;min-height:252px}
.cal-wk,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-wk span{font:700 11px var(--serif);letter-spacing:.12em;opacity:.6;padding-bottom:6px}
html[dir=rtl] .cal-wk span{font:600 11px var(--ar);letter-spacing:0}
.cal-grid span{position:relative;height:34px;display:grid;place-items:center;font:600 16px var(--serif);opacity:0;transform:scale(.6);transition:opacity .35s ease,transform .45s cubic-bezier(.3,1.5,.5,1)}
html[dir=rtl] .cal-grid span{font:600 15px var(--ar)}
.cal.open .cal-grid span{opacity:1;transform:none}
.cal-grid .wed{color:var(--burg);font-weight:700}
.cal-grid .wed svg{position:absolute;left:50%;top:50%;width:46px;height:46px;transform:translate(-50%,-50%);overflow:visible}
.cal-grid .wed circle{fill:none;stroke:var(--burg);stroke-width:2;stroke-linecap:round;stroke-dasharray:140;stroke-dashoffset:140;transition:stroke-dashoffset 1s var(--ease) .1s}
.cal.marked .cal-grid .wed circle{stroke-dashoffset:0}
.cal-grid .wed .hrt{position:absolute;right:-3px;top:-4px;width:14px;fill:var(--burg);opacity:0;transform:scale(.3);transition:all .5s cubic-bezier(.3,1.6,.5,1) .9s}
.cal.marked .cal-grid .wed .hrt{opacity:1;transform:none}
.cal-cover{position:absolute;inset:0;border-radius:0 0 14px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transform-origin:50% 0;
  transition:transform 1s cubic-bezier(.6,0,.2,1),opacity .4s ease .55s;backface-visibility:hidden;z-index:2;overflow:hidden}
.cal-cover .ic{position:relative;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fffaf3,#ead6c4);box-shadow:0 10px 18px -8px rgba(0,0,0,.6),inset 0 -3px 4px rgba(100,11,21,.15)}
.cal-cover .ic svg{width:40px;height:40px;fill:none;stroke:var(--burg);stroke-width:1.4;stroke-linecap:round}
.cal-cover p{color:var(--cream);font:italic 500 16px var(--serif)}
html[dir=rtl] .cal-cover p{font:500 15px var(--ar);font-style:normal}
.cal.open .cal-cover{transform:rotateX(-100deg);opacity:0;pointer-events:none}
.cal-after{margin-top:18px;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .7s ease .3s,transform .7s var(--ease) .3s}
.cal.marked~.cal-after{opacity:1;transform:none}
.fulldate{font:600 20px var(--serif);letter-spacing:.04em;margin-bottom:12px}
html[dir=rtl] .fulldate{font:700 18px var(--ar)}

/* --- 3. clock --- */
.clock{position:relative;width:min(72vw,40svh,300px);aspect-ratio:1;margin-top:16px;border-radius:50%}
.clock svg.face{width:100%;height:100%;filter:drop-shadow(0 22px 26px rgba(0,0,0,.55))}
.clock .hand{transform-origin:150px 150px;transition:transform 2.2s cubic-bezier(.45,0,.15,1)}
.clock .tapme{inset:-8px;border-radius:50%}
.time-after{margin-top:20px;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .7s ease,transform .7s var(--ease)}
.done .time-after{opacity:1;transform:none}
.bigtime{font:600 30px var(--serif);letter-spacing:.06em}
html[dir=rtl] .bigtime{font:700 24px var(--ar)}
.cdn{display:flex;gap:10px;justify-content:center;margin-top:12px}
.cdn div{min-width:64px;padding:9px 6px 7px;border-radius:10px;background:rgba(251,243,234,.08);box-shadow:inset 0 0 0 1px rgba(251,236,222,.28)}
.cdn b{display:block;font:600 24px/1 var(--serif)}
.cdn span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
html[dir=rtl] .cdn span{font:500 12px var(--ar);letter-spacing:0}

/* --- 4. venue --- */
.vwrap{position:relative;width:min(86vw,360px);height:min(58svh,440px);margin-top:12px;perspective:1400px}
.venv{position:absolute;left:50%;bottom:6%;width:74%;aspect-ratio:1.45;transform:translateX(-50%);transition:transform .9s var(--ease),opacity .6s ease .5s}
.venv .back,.venv .front,.venv .flap{position:absolute;border-radius:10px;background:var(--deep) var(--i-velvet) center/200px auto}
.venv .back{inset:0;box-shadow:0 22px 30px -16px rgba(40,4,10,.65)}
.venv .front{inset:34% 0 0 0;border-radius:0 0 10px 10px;z-index:3;clip-path:polygon(0 0,50% 42%,100% 0,100% 100%,0 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.venv .flap{left:0;right:0;top:0;height:62%;z-index:4;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .9s cubic-bezier(.6,0,.25,1);filter:brightness(1.12)}
.venv .vs{position:absolute;z-index:5;left:50%;top:62%;width:24%;aspect-ratio:331/322;transform:translate(-50%,-50%);background:var(--i-seal) center/100% 100%;filter:drop-shadow(0 4px 5px rgba(0,0,0,.45));transition:transform .6s var(--ease),opacity .5s}
.venv .pin{position:absolute;z-index:4;left:50%;top:84%;transform:translateX(-50%);width:16px;fill:rgba(251,236,222,.55)}
.venv .tapme{border-radius:12px}
.vcard{position:absolute;left:50%;bottom:8%;width:86%;transform:translate(-50%,40%) scale(.7);opacity:0;z-index:2;border-radius:12px;overflow:hidden;
  background:linear-gradient(180deg,#fdf7f0,#f3e3d4);box-shadow:0 28px 40px -20px rgba(40,4,10,.6),0 0 0 1px rgba(100,11,21,.12);transition:transform 1s var(--ease) .35s,opacity .5s ease .35s;text-align:center}
.vcard .ph{height:min(19svh,150px);background:var(--deep) var(--i-velvet) center/200px auto;position:relative;display:grid;place-items:center;overflow:hidden}
.vcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vcard .ph .fb{position:absolute;inset:0;background:var(--i-ltl) left top/48% auto no-repeat,var(--i-lbr) right bottom/44% auto no-repeat;mix-blend-mode:screen;opacity:.35}
.vcard .ph svg{position:relative;width:34px;fill:var(--cream);filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.vcard .tx{padding:16px 18px 18px}
.vcard h3{font:600 22px/1.3 var(--serif)}
html[dir=rtl] .vcard h3{font:700 19px/1.6 var(--ar)}
.vcard p{font-size:15.5px;opacity:.8;margin:4px 0 14px;line-height:1.55}
html[dir=rtl] .vcard p{font-size:14.5px}
.done .venv{transform:translate(-50%,46%) scale(.92);opacity:0;pointer-events:none}
.done .venv .flap{transform:rotateX(-178deg)}
.done .venv .vs{transform:translate(-50%,-90%) scale(1.15);opacity:0}
.done .vcard{transform:translate(-50%,0) scale(1);opacity:1}
.opening .venv .flap{transform:rotateX(-178deg)}
.opening .venv .vs{transform:translate(-50%,-90%) scale(1.15);opacity:0}

/* --- 5. timeline --- */
.tl{position:relative;width:min(88vw,360px);margin-top:16px;padding:6px 0}
.tl::before{content:"";position:absolute;left:50%;top:22px;bottom:22px;width:1.5px;margin-left:-.75px;background:linear-gradient(var(--burg),var(--burg));transform-origin:top;transform:scaleY(var(--p,0));transition:transform .45s ease;opacity:.6}
.st{position:relative;display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;gap:12px;min-height:min(10.5svh,76px);width:100%;text-align:end}
.st .tm{font:600 18px var(--serif);direction:ltr;opacity:0;transform:translateX(-10px);transition:all .5s var(--ease)}
.st .nm{text-align:start;font:600 17px/1.3 var(--serif);opacity:0;transform:translateX(10px);transition:all .5s var(--ease)}
html[dir=rtl] .st .tm{font:700 16px var(--ar);transform:translateX(10px)}
html[dir=rtl] .st .nm{font:600 15.5px/1.5 var(--ar);transform:translateX(-10px)}
.st .sl{width:46px;aspect-ratio:331/322;margin:auto;background:var(--i-seal) center/100% 100%;filter:drop-shadow(0 4px 5px rgba(60,8,16,.35));transform:scale(.2) rotate(-40deg);opacity:0;transition:transform .55s cubic-bezier(.3,1.6,.5,1),opacity .3s}
.st.on .sl{transform:none;opacity:1}.st.on .tm,.st.on .nm{opacity:1;transform:none}
.st.hl .sl{transform:scale(1.15)}
.st.hl .nm{color:var(--burg2)}
.tl-all{margin-top:14px}

/* --- 6. story --- */
.stack{position:relative;width:min(74vw,40svh,320px);aspect-ratio:4/5;margin-top:18px;touch-action:none}
.ph-c{position:absolute;inset:0;padding:10px 10px 38px;background:linear-gradient(180deg,#fdf7f0,#f1e0cf);border-radius:4px;box-shadow:0 18px 30px -16px rgba(0,0,0,.7);
  transition:transform .55s var(--ease),opacity .45s;will-change:transform}
.ph-c img{width:100%;height:100%;object-fit:cover;border-radius:2px;pointer-events:none}
.ph-c small{position:absolute;left:0;right:0;bottom:9px;text-align:center;font:400 20px var(--script);color:var(--burg)}
.stack-nav{display:flex;align-items:center;gap:18px;margin-top:18px}
.stack-nav button{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(251,243,234,.12);box-shadow:inset 0 0 0 1px rgba(251,236,222,.35);color:var(--cream)}
.stack-nav button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stack-nav span{font:600 14px var(--serif);letter-spacing:.2em;min-width:56px;text-align:center}

/* --- 7. rsvp --- */
.rcv{position:relative;color:var(--burg);width:min(88vw,370px);margin-top:12px;padding:30px 22px 24px;border-radius:6px;text-align:center;background:linear-gradient(180deg,#fdf7f0,#f3e3d4);box-shadow:0 26px 40px -24px rgba(60,8,16,.55)}
.rcv::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);border-radius:3px;pointer-events:none}
.rcv .lfc{position:absolute;width:38%;aspect-ratio:422/382;left:0;top:0;background:var(--i-ltl) left top/100% 100% no-repeat;mix-blend-mode:overlay;pointer-events:none}
.rcv .lfc.br{left:auto;top:auto;right:0;bottom:0;width:32%;aspect-ratio:482/552;background-image:var(--i-lbr)}
.rcv>*{position:relative}
.rq{font:600 20px/1.4 var(--serif);margin-bottom:16px}
html[dir=rtl] .rq{font:700 18px/1.6 var(--ar)}
.choice{display:grid;gap:10px}
.choice button{padding:15px 12px;border-radius:10px;font:600 17px var(--serif);background:#fffaf4;box-shadow:inset 0 0 0 1px rgba(100,11,21,.3);transition:all .25s}
html[dir=rtl] .choice button{font:600 16px var(--ar)}
.choice button.y{background:linear-gradient(135deg,#7d1626,#4d0812);color:#fbefe4;box-shadow:0 10px 18px -10px rgba(62,6,16,.8)}
.rf{display:none;text-align:start}
.rf label{display:block;font:600 12.5px var(--serif);letter-spacing:.14em;text-transform:uppercase;margin:12px 0 6px}
html[dir=rtl] .rf label{font:600 13.5px var(--ar);letter-spacing:0}
.rf input,.rf textarea{width:100%;padding:11px 13px;border-radius:8px;border:1px solid rgba(100,11,21,.28);background:#fffaf4;font:500 16px var(--serif);color:var(--burg);outline:none;touch-action:auto}
html[dir=rtl] .rf input,html[dir=rtl] .rf textarea{font:500 15.5px var(--ar)}
.rf input:focus,.rf textarea:focus{border-color:var(--burg)}
.stp{display:flex;align-items:center;justify-content:space-between;border-radius:8px;box-shadow:inset 0 0 0 1px rgba(100,11,21,.28);background:#fffaf4}
.stp button{width:48px;height:42px;font-size:22px}.stp b{font:600 19px var(--serif)}
.rf .row{display:flex;gap:10px;margin-top:16px}.rf .row .btn{flex:1}
.rf .back{flex:0 0 auto;padding:13px 16px}
.rdone{display:none;padding:6px 0}
.rdone .stamp{width:96px;aspect-ratio:331/322;margin:0 auto 12px;background:var(--i-seal) center/100% 100%;filter:drop-shadow(0 6px 8px rgba(60,8,16,.4));animation:stamp .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:scale(2) rotate(-25deg);opacity:0}}
.rdone h3{font:400 38px/1.2 var(--script)}
html[dir=rtl] .rdone h3{font:700 24px/1.6 var(--ruq)}
.rdone p{font-size:16.5px;line-height:1.6;opacity:.85;margin-top:6px}
.rdone .chg{margin-top:12px;font:600 13px var(--serif);text-decoration:underline;opacity:.7}
.rcv[data-st="form"] .choice,.rcv[data-st="form"] .rq,.rcv[data-st="done"] .choice,.rcv[data-st="done"] .rq{display:none}
.rcv[data-st="form"] .rf{display:block;animation:fadeUp .5s var(--ease)}
.rcv[data-st="done"] .rdone{display:block;animation:fadeUp .5s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}}

/* --- 8. thank you --- */
.letter{position:relative;color:var(--burg);width:min(84vw,360px);padding:34px 26px 30px;text-align:center;border-radius:4px;background:linear-gradient(180deg,#fdf7f0,#f1e0cf);box-shadow:0 30px 44px -22px rgba(0,0,0,.75);margin-top:10px}
.letter::before{content:"";position:absolute;inset:8px;border:1px solid var(--line);pointer-events:none}
.letter .lfc{position:absolute;width:40%;aspect-ratio:422/382;left:0;top:0;background:var(--i-ltl) left top/100% 100% no-repeat;mix-blend-mode:overlay;pointer-events:none}
.letter>*{position:relative}
.letter .ty{font:400 50px/1.1 var(--script)}
html[dir=rtl] .letter .ty{font:700 32px/1.5 var(--ruq)}
.letter p{font:italic 500 18px/1.65 var(--serif);margin:12px 0 14px;opacity:.9}
html[dir=rtl] .letter p{font:500 16px/1.9 var(--ar);font-style:normal}
.letter .sig{font:400 32px/1.2 var(--script)}
html[dir=rtl] .letter .sig{font:700 22px/1.6 var(--ruq)}
.letter .sl{position:absolute;left:50%;bottom:-34px;width:78px;aspect-ratio:331/322;transform:translateX(-50%);background:var(--i-seal) center/100% 100%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.replay{margin-top:58px}

/* ===================== NAV ===================== */
.dots{position:fixed;z-index:40;top:50%;right:10px;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;opacity:0;transition:opacity .6s}
html[dir=rtl] .dots{right:auto;left:10px}
.dots button{width:22px;height:22px;display:grid;place-items:center}
.dots button i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35;transition:all .35s}
.dots button.on i{opacity:1;height:16px;border-radius:3px}
.navb{position:fixed;z-index:40;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:10px;opacity:0;transition:opacity .6s;pointer-events:none}
.navb>*{pointer-events:auto}
.navb .prev{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(251,243,234,.9);color:var(--burg);box-shadow:0 8px 18px -10px rgba(0,0,0,.6);transition:opacity .3s}
.navb .prev svg,.navb .next svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.navb .next{min-height:44px}
body.deck-on .dots,body.deck-on .navb{opacity:1}
.navb .off{opacity:0;pointer-events:none}
.on-v-ui .dots{color:var(--cream)}.on-p-ui .dots{color:var(--burg)}
.mute{position:fixed;z-index:45;top:calc(10px + env(safe-area-inset-top));right:12px;width:40px;height:40px;border-radius:50%;background:rgba(251,243,234,.9);color:var(--burg);display:none;place-items:center;box-shadow:0 6px 16px -6px rgba(0,0,0,.45)}
html[dir=rtl] .mute{right:auto;left:12px}
.mute.on{display:grid}.mute svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.demo{position:fixed;z-index:70;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font:600 11px var(--ar);color:var(--burg);background:rgba(251,243,234,.88);padding:3px 10px;border-radius:999px;pointer-events:none}

/* sheets / lightbox */
.sheet{position:fixed;inset:0;z-index:90;background:rgba(20,0,4,.55);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in2{width:100%;max-width:480px;background:var(--ivory);border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:fadeUp .35s var(--ease)}
.sheet h4{text-align:center;font:600 18px var(--serif);margin-bottom:12px}
html[dir=rtl] .sheet h4{font:700 16px var(--ar)}
.sheet .btn{width:100%;margin-top:8px}
.lb{position:fixed;inset:0;z-index:95;background:rgba(20,0,4,.95);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}.lb img{max-width:94vw;max-height:84svh;border-radius:3px}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;font-size:28px;color:#fff}
.lb .a{position:absolute;top:50%;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;font-size:24px;transform:translateY(-50%)}
.lb .a.p{left:10px}.lb .a.n{right:10px}
.lb .c{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));color:#fff;font:600 13px var(--serif);letter-spacing:.2em;opacity:.7}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01s!important;animation-duration:.01s!important;animation-iteration-count:1!important}
}
@media (max-height:700px){
  .ttl{font-size:38px}.cal-body{min-height:228px}.cal-grid span{height:30px}.cal-hd{padding:12px 0 9px}.cal-hd b{font-size:30px}
  .st{min-height:58px}.rcv{padding:24px 18px 18px}.choice button{padding:13px}
}
</style>
</head>
<body>
<div class="demo" id="demoFlag">معاينة · بيانات تجريبية</div>

<!-- ============ the approved cover ============ -->
<div class="gate" id="gate">
  <div class="stage">
    <div class="pcard"></div><div class="pnl top"></div><div class="pnl bot"></div>
    <div class="gring"></div><div class="gseal"></div><div class="gshine"></div>

  </div>
  <div class="ghint"><span><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v4.5A5.5 5.5 0 0 1 12.5 20h-1a5 5 0 0 1-4-2l-3-4a1.4 1.4 0 0 1 2.2-1.8L9 14"/></svg><b data-t="hint"></b></span></div>
</div>

<!-- ============ the 8 scenes ============ -->
<div class="deck" id="deck"><div class="track" id="track">

      <p class="r-msg" id="rMsg"></p>
    </div>
    <div class="quick" id="quick"></div>
  </section>

  <!-- 2 date -->
  <section class="scene paperbg" id="s-date" data-k="date" data-ui="p">
    <p class="kick in" data-t="dateK"></p><h2 class="ttl in d1" data-t="dateT"></h2>
    <div class="cal in d2" id="cal">
      <div class="cal-hd velvet"><b id="calM"></b><span id="calY"></span></div>
      <div class="cal-body">
        <div class="cal-wk" id="calWk"></div><div class="cal-grid" id="calGrid"></div>
        <button class="cal-cover velvet" id="calCover"><span class="ic"><span class="tapme"></span><svg viewBox="0 0 40 40"><rect x="6" y="9" width="28" height="25" rx="3"/><path d="M6 16h28M13 5v7M27 5v7"/><path d="M20 27.5s-5-3-5-6.2a2.6 2.6 0 0 1 5-1 2.6 2.6 0 0 1 5 1c0 3.2-5 6.2-5 6.2z" fill="currentColor" stroke="none" style="fill:var(--burg)"/></svg></span><p data-t="dateTap"></p></button>
      </div>
    </div>

  </section>

  <!-- 3 time -->
  <section class="scene velvet on-v" id="s-time" data-k="time" data-ui="v">

        <defs>
          <radialGradient id="fg" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#ecd9c6"/></radialGradient>
          <linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a1b2c"/><stop offset=".5" stop-color="#5a0c18"/><stop offset="1" stop-color="#3a050e"/></linearGradient>
          <filter id="emb"><feDropShadow dx="0" dy="1" stdDeviation=".6" flood-color="#fff" flood-opacity=".9"/><feDropShadow dx="0" dy="-1" stdDeviation=".5" flood-color="#3a050e" flood-opacity=".35"/></filter>
        </defs>
        <circle cx="150" cy="150" r="148" fill="url(#rg)"/>
        <circle cx="150" cy="150" r="136" fill="url(#fg)"/>
        <circle cx="150" cy="150" r="124" fill="none" stroke="#640b15" stroke-width="1" opacity=".55"/>
        <circle cx="150" cy="150" r="119" fill="none" stroke="#640b15" stroke-width=".6" opacity=".35"/>
        <g id="ticks" stroke="#640b15" stroke-linecap="round"></g>
        <g id="nums" fill="#640b15" font-family="Cormorant Garamond,Georgia,serif" font-weight="600" font-size="22" text-anchor="middle" dominant-baseline="central" filter="url(#emb)"></g>
        <g class="hand" id="hH"><path d="M150 152 L146 150 L150 84 L154 150 Z" fill="#4d0812"/><circle cx="150" cy="96" r="5" fill="none" stroke="#4d0812" stroke-width="2.4"/></g>
        <g class="hand" id="hM"><path d="M150 154 L147.5 150 L150 52 L152.5 150 Z" fill="#640b15"/></g>
        <circle cx="150" cy="150" r="7" fill="#640b15"/><circle cx="150" cy="150" r="2.6" fill="#f1dcc8"/>
      </svg></button>
    <p class="hintx" data-t="timeTap"></p>
    <div class="time-after"><p class="bigtime" id="bigTime"></p>
      <div class="cdn"><div><b id="cdD"></b><span data-t="d"></span></div><div><b id="cdH"></b><span data-t="h"></span></div><div><b id="cdM"></b><span data-t="m"></span></div></div></div>
  </section>

  <!-- 4 venue -->

        <div class="tx"><h3 id="vName"></h3><p id="vAddr"></p><a class="btn" id="mapBtn" target="_blank" rel="noopener"><svg viewBox="0 0 24 24"><path d="M9 4L3 6.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg><span data-t="map"></span></a></div></div>
      <button class="venv" id="venv" aria-label="open"><span class="tapme"></span><span class="back"></span><span class="front"></span><span class="flap"></span><span class="vs"></span>
        <svg class="pin" viewBox="0 0 24 30"><path d="M12 0C5.4 0 0 5.2 0 11.7 0 20.5 12 30 12 30s12-9.5 12-18.3C24 5.2 18.6 0 12 0zm0 16.2a4.6 4.6 0 1 1 0-9.2 4.6 4.6 0 0 1 0 9.2z"/></svg></button>

  <!-- 5 timeline -->

<nav class="dots" id="dots" aria-label="scenes"></nav>
<div class="navb"><button class="prev" id="prev" aria-label="previous scene"><svg viewBox="0 0 24 24"><path d="M6 14.5l6-6 6 6"/></svg></button>

<button class="mute" id="mute" aria-label="music"><svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path id="mW" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg></button>
<div class="sheet" id="calSheet"><div class="in2"><h4 data-t="addCal"></h4><a class="btn" id="icsBtn" download="wedding.ics"><span data-t="calApple"></span></a><a class="btn ghost" id="gcalBtn" target="_blank" rel="noopener"><span>Google Calendar</span></a><button class="btn ghost" id="sheetX" data-t="close"></button></div></div>
<div class="lb" id="lb"><button class="x" id="lbX" aria-label="close">×</button><button class="a p" id="lbP">‹</button><img id="lbI" alt=""><button class="a n" id="lbN">›</button><span class="c" id="lbC"></span></div>
<audio id="aud" src="music.mp3" loop preload="none"></audio>

<script>
/* ================= DATA (in the studio this comes from the bride's form) ================= */
const D={
  lang:"en",
  groom:"Khaled",bride:"Mariam",
  welcome:"We would be honoured to have you celebrate with us",
  date:"2027-04-17",time:"20:00",
  venue:"The Nile Ritz-Carlton",city:"Cairo",addr:"1113 Corniche El Nil, Downtown, Cairo",map:"",venuePhoto:"",
  program:[["19:30","Guests Arrival"],["20:00","Katb El Ketab"],["21:00","The Couple's Entrance"],["22:30","Dinner"],["23:30","First Dance & Cake"]],
  album:["img/p1.webp","img/p5.webp","img/p2.webp","img/p3.webp","img/p7.webp","img/p6.webp","img/p4.webp","img/p8.webp"],
  thanks:"Thank you for being part of our story. Your love and presence mean the world to us — we can't wait to celebrate together.",
  wa:"201280067110",
  show:{date:true,time:true,venue:true,timeline:true,story:true,rsvp:true,thanks:true},
  look:{env:"burgundy",seal:"orig"}
};
(()=>{try{if(!/[?&]demo=1/.test(location.search))return;const x=JSON.parse(localStorage.getItem("farhetna_demo")||"null");if(!x)return;
  Object.keys(x).forEach(k=>{const v=x[k];if(v===""||v==null||(Array.isArray(v)&&!v.length))return;D[k]=v});
  if(D.music){const au=document.getElementById("aud");if(D.music==="none")au.removeAttribute("src");else au.src=D.music}
  document.getElementById("demoFlag").textContent="معاينة";}catch(e){}})();
(()=>{const q=new URLSearchParams(location.search);if(q.get("lang"))D.lang=q.get("lang")==="ar"?"ar":"en";

 :{hint:"Tap the seal to open",lead:"With joy in our hearts",dateK:"Save our date",dateT:"The Day",dateTap:"Tap the calendar",addCal:"Add to my calendar",calApple:"iPhone / Android (calendar file)",close:"Close",

function fit(){const el=$("rNames");el.style.fontSize="";const ni=el.querySelector(".ni");let fs=parseFloat(getComputedStyle(el).fontSize);const max=el.clientWidth*.88;while(ni.offsetWidth>max&&fs>10){fs--;el.style.fontSize=fs+"px"}}

/* calendar */
$("calM").textContent=monthName;$("calY").textContent=num(Y);
(()=>{const start=AR?6:0;const wk=[];for(let i=0;i<7;i++){const d=new Date(Date.UTC(2024,0,7+((start+i)%7)));wk.push(d.toLocaleDateString(loc,{weekday:AR?"short":"narrow",timeZone:"UTC"}))}

  const first=new Date(Date.UTC(Y,Mo-1,1)).getUTCDay(),days=new Date(Date.UTC(Y,Mo,0)).getUTCDate(),off=(first-start+7)%7;let h="";
  for(let i=0;i<off;i++)h+="<span></span>";
  for(let d=1;d<=days;d++){const k=off+d-1;h+=d===Dd?`<span class="wed" style="transition-delay:${k*18}ms">${num(d)}<svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" transform="rotate(-70 23 23)"/></svg><svg class="hrt" viewBox="0 0 24 22"><path d="M12 21S1 14 1 7a5.5 5.5 0 0 1 11-1.5A5.5 5.5 0 0 1 23 7c0 7-11 14-11 14z"/></svg></span>`:`<span style="transition-delay:${k*18}ms">${num(d)}</span>`}
  $("calGrid").innerHTML=h})();

function runDate(){const c=$("cal");if(c.classList.contains("open")){c.classList.remove("marked");void c.offsetWidth;setTimeout(()=>c.classList.add("marked"),60);return}

$("calCover").onclick=runDate;$("calGrid").onclick=runDate;
/* add to calendar (real .ics + Google link) */
(()=>{const p=n=>String(n).padStart(2,"0"),u=d=>`${d.getUTCFullYear()}${p(d.getUTCMonth()+1)}${p(d.getUTCDate())}T${p(d.getUTCHours())}${p(d.getUTCMinutes())}00Z`;
  const end=new Date(when.getTime()+5*3600e3),title=AR?`فرح ${D.groom} و${D.bride}`:`${D.groom} & ${D.bride}'s Wedding`,where=[D.venue,D.addr].filter(Boolean).join(", ");
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Farhetna//Invite//EN","BEGIN:VEVENT",`UID:${Date.now()}@farhetna`,`DTSTAMP:${u(new Date())}`,`DTSTART:${u(when)}`,`DTEND:${u(end)}`,
    `SUMMARY:${title}`,`LOCATION:${where.replace(/,/g,"\\,")}`,"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Reminder","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  $("icsBtn").href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"}));

  $("gcalBtn").href=`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${u(when)}/${u(end)}&location=${encodeURIComponent(where)}`})();
$("addCal").onclick=()=>$("calSheet").classList.add("on");$("sheetX").onclick=()=>$("calSheet").classList.remove("on");

/* clock */
(()=>{let t="",n="";const R=["XII","I","II","III","IV","V","VI","VII","VIII","IX","X","XI"];
  for(let i=0;i<60;i++){const a=i*6*Math.PI/180,big=i%5===0,r1=big?112:115,r2=120;t+=`<line x1="${150+r1*Math.sin(a)}" y1="${150-r1*Math.cos(a)}" x2="${150+r2*Math.sin(a)}" y2="${150-r2*Math.cos(a)}" stroke-width="${big?2:.8}" opacity="${big?.9:.5}"/>`}
  for(let i=0;i<12;i++){const a=i*30*Math.PI/180;n+=`<text x="${150+96*Math.sin(a)}" y="${150-96*Math.cos(a)}" font-size="${i%3?17:22}">${R[i]}</text>`}
  $("ticks").innerHTML=t;$("nums").innerHTML=n})();
const tH=+D.time.split(":")[0],tM=+D.time.split(":")[1];
let spins=0;

(()=>{const n=new Date(),h=n.getHours()%12,m=n.getMinutes();$("hH").style.transition="none";$("hM").style.transition="none";setHands(h*30+m/2,m*6)})();
function runTime(){spins++;$("hH").style.transition="";$("hM").style.transition="";setHands((tH%12)*30+tM/2+360*spins,tM*6+720*spins);setTimeout(()=>$("s-time").classList.add("done"),1500)}
$("clock").onclick=runTime;$("bigTime").textContent=tfmt(D.time);
function tick(){let s=Math.max(0,(when-Date.now())/1000|0);const d=s/86400|0;s-=d*86400;const h=s/3600|0;s-=h*3600;const m=s/60|0;$("cdD").textContent=num(d);$("cdH").textContent=num(h);$("cdM").textContent=num(m)}
tick();setInterval(tick,15000);

/* venue */

if(D.venuePhoto){const i=new Image();i.src=D.venuePhoto;i.alt="";$("vph").prepend(i)}
function runVenue(){const s=$("s-venue");if(s.classList.contains("done"))return;s.classList.add("opening");setTimeout(()=>s.classList.add("done"),650)}
$("venv").onclick=runVenue;

/* timeline */
(()=>{const P=(D.program||[]).filter(p=>p&&p[1]);$("tl").innerHTML=P.map((p,i)=>`<button class="st" data-i="${i}"><span class="tm">${p[0]?tfmt(p[0]):""}</span><span class="sl"></span><span class="nm">${esc(p[1])}</span></button>`).join("");
  if(!P.length)D.show.timeline=false})();
let tlRun=false;
function runTimeline(){if(tlRun)return;tlRun=true;const S=[...document.querySelectorAll(".st")];S.forEach((s,i)=>setTimeout(()=>{s.classList.add("on");$("tl").style.setProperty("--p",S.length>1?i/(S.length-1):1)},180+i*420));
  setTimeout(()=>$("s-timeline").classList.add("done"),300+S.length*420)}
$("tl").onclick=e=>{const s=e.target.closest(".st");if(!s)return;if(!tlRun)return runTimeline();document.querySelectorAll(".st").forEach(x=>x.classList.toggle("hl",x===s))};

/* story stack */
const P=(D.album||[]).filter(Boolean);let topI=0;
(()=>{if(!P.length){D.show.story=false;return}const st=$("stack");
  P.forEach((u,i)=>{const c=document.createElement("div");c.className="ph-c";c.innerHTML=`<img src="${u}" alt="" loading="${i<3?"eager":"lazy"}" draggable="false">`;st.appendChild(c)});lay()})();
function lay(){const C=[...$("stack").children],n=C.length;C.forEach((c,i)=>{const k=(i-topI+n)%n;c.style.zIndex=n-k;c.style.opacity=k>3?0:1;
  const rot=[0,-4,3.5,-2][Math.min(k,3)];c.style.transform=`translate(${k*(AR?-5:5)}px,${k*6}px) rotate(${rot}deg) scale(${1-k*.03})`});$("stN").textContent=`${num(topI+1)} / ${num(n)}`}
function flip(d){const C=[...$("stack").children];if(C.length<2)return;if(d>0){const c=C[topI];c.style.transform=`translate(${(AR?-1:1)*-140}%,-4%) rotate(${AR?18:-18}deg)`;c.style.opacity=0;setTimeout(()=>{topI=(topI+1)%C.length;lay()},260)}
  else{topI=(topI-1+C.length)%C.length;lay()}}
$("stNx").onclick=()=>flip(AR?-1:1);$("stP").onclick=()=>flip(AR?1:-1);
(()=>{const st=$("stack");let sx=0,sy=0,dx=0,drag=false,moved=false;
  st.addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;dx=0;drag=true;moved=false});
  addEventListener("pointermove",e=>{if(!drag)return;dx=e.clientX-sx;const dy=e.clientY-sy;if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy))moved=true;
    if(moved){const c=$("stack").children[topI];c.style.transition="none";c.style.transform=`translate(${dx}px,0) rotate(${dx/18}deg)`}});
  addEventListener("pointerup",()=>{if(!drag)return;drag=false;const c=$("stack").children[topI];if(c)c.style.transition="";
    if(moved&&Math.abs(dx)>70){c.style.transform=`translate(${dx>0?140:-140}%,-4%) rotate(${dx>0?18:-18}deg)`;c.style.opacity=0;setTimeout(()=>{topI=(topI+1)%P.length;lay()},240)}
    else if(moved)lay();else openLb(topI)})})();
let li=0;function openLb(i){li=(i+P.length)%P.length;$("lbI").src=P[li];$("lbC").textContent=`${num(li+1)} / ${num(P.length)}`;$("lb").classList.add("on")}
$("lbX").onclick=()=>$("lb").classList.remove("on");$("lbP").onclick=()=>openLb(li-1);$("lbN").onclick=()=>openLb(li+1);
(()=>{let sx=0;$("lb").addEventListener("touchstart",e=>sx=e.touches[0].clientX,{passive:true});$("lb").addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)openLb(li+(d<0?1:-1))},{passive:true})})();

/* rsvp (preview: saved on this phone only — the real version saves to Farhetna's database) */
let yes=true,cnt=1;const rcv=$("rcv");
const RK="bb_rsvp_"+D.date+D.groom;
function setN(){$("fN").textContent=num(cnt)}
$("cYes").onclick=()=>{yes=true;$("fCntW").style.display="";rcv.dataset.st="form";setTimeout(()=>$("fName").focus({preventScroll:true}),300)};
$("cNo").onclick=()=>{yes=false;$("fCntW").style.display="none";rcv.dataset.st="form";setTimeout(()=>$("fName").focus({preventScroll:true}),300)};
$("fBack").onclick=()=>rcv.dataset.st="ask";
$("fPlus").onclick=()=>{cnt=Math.min(10,cnt+1);setN()};$("fMinus").onclick=()=>{cnt=Math.max(1,cnt-1);setN()};
function showDone(r){$("dT").textContent=r.yes?T.okY(r.name):T.okN(r.name);$("dP").textContent=r.yes?T.okYp:T.okNp;rcv.dataset.st="done"}
$("fSend").onclick=()=>{const n=$("fName").value.trim();if(!n){$("fName").placeholder=T.needName;$("fName").focus();$("fName").style.borderColor="#b3261e";return}
  const r={name:n,yes,count:yes?cnt:0,msg:$("fMsg").value.trim(),at:new Date().toISOString()};try{localStorage.setItem(RK,JSON.stringify(r))}catch(e){}showDone(r)};
$("dChg").onclick=()=>rcv.dataset.st="ask";
try{const r=JSON.parse(localStorage.getItem(RK)||"null");if(r){$("fName").value=r.name;showDone(r)}}catch(e){}

/* ================= DECK NAVIGATION ================= */
const ALL=[...document.querySelectorAll(".scene")];
ALL.forEach(s=>{const k=s.dataset.k;if(k!=="reveal"&&D.show[k]===false)s.remove()});
const SC=[...document.querySelectorAll(".scene")];SC.forEach((s,i)=>s.style.top=(i*100)+"%");
const NEXTNAME={date:0,time:1,venue:2,timeline:3,story:4,rsvp:5,thanks:6};
let cur=0,busy=false;const runs={date:runDate,time:runTime,venue:runVenue,timeline:runTimeline};const autoT={};
$("dots").innerHTML=SC.map((s,i)=>`<button aria-label="${i+1}"><i></i></button>`).join("");
[...$("dots").children].forEach((b,i)=>b.onclick=()=>go(i));
// quick jump icons on the reveal scene
const QI={date:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',time:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2"/>',
  venue:'<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',rsvp:'<path d="M4 12l16-8-6 16-2-7z"/>'};
$("quick").innerHTML=["date","time","venue","rsvp"].filter(k=>SC.some(s=>s.dataset.k===k)).map(k=>`<button data-go="${k}"><i><svg viewBox="0 0 24 24">${QI[k]}</svg></i>${T.q[k]}</button>`).join("");
$("quick").onclick=e=>{const b=e.target.closest("[data-go]");if(b)go(SC.findIndex(s=>s.dataset.k===b.dataset.go))};
function go(i){i=Math.max(0,Math.min(SC.length-1,i));if(i===cur&&SC[i].classList.contains("act"))return;
  SC[cur].classList.remove("act");cur=i;$("track").style.transform=`translateY(${-i*100}%)`;busy=true;setTimeout(()=>busy=false,700);
  setTimeout(()=>SC[i].classList.add("act"),280);
  const s=SC[i],k=s.dataset.k;document.body.classList.toggle("on-v-ui",s.dataset.ui==="v");document.body.classList.toggle("on-p-ui",s.dataset.ui!=="v");
  [...$("dots").children].forEach((b,j)=>b.classList.toggle("on",j===i));
  $("prev").classList.toggle("off",i===0);
  const nx=SC[i+1];$("next").classList.toggle("off",!nx);$("nextT").textContent=i===0?T.discover:(nx?T.next[NEXTNAME[nx.dataset.k]]:"");
  // the scene's own animation starts by itself after a short moment (guest can still tap anytime)
  if(runs[k]&&!s.classList.contains("done")){clearTimeout(autoT[k]);autoT[k]=setTimeout(()=>{if(SC[cur]===s)runs[k]()},1300)}}
$("next").onclick=()=>go(cur+1);$("prev").onclick=()=>go(cur-1);
$("replay").onclick=()=>go(0);
// swipe (vertical) — ignored while dragging photos, typing, or when a sheet is open
(()=>{let sy=0,sx=0,t0=0,ok=false;const dk=$("deck");
  dk.addEventListener("touchstart",e=>{const t=e.target;ok=!t.closest("[data-hlock],input,textarea")&&!$("lb").classList.contains("on");sy=e.touches[0].clientY;sx=e.touches[0].clientX;t0=Date.now()},{passive:true});
  dk.addEventListener("touchend",e=>{if(!ok||busy)return;const dy=e.changedTouches[0].clientY-sy,dx=e.changedTouches[0].clientX-sx;
    if(Math.abs(dy)>60&&Math.abs(dy)>Math.abs(dx)*1.6&&Date.now()-t0<900)go(cur+(dy<0?1:-1))},{passive:true});
  let wl=0;dk.addEventListener("wheel",e=>{const n=Date.now();if(n-wl<900||Math.abs(e.deltaY)<25)return;wl=n;go(cur+(e.deltaY>0?1:-1))},{passive:true});
  addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;if(e.key==="ArrowDown"||e.key==="PageDown")go(cur+1);if(e.key==="ArrowUp"||e.key==="PageUp")go(cur-1)})})();
document.body.classList.add("on-v-ui");

/* ================= OPENING (approved cover) ================= */
const gate=$("gate"),aud=$("aud"),mute=$("mute");let opened=false;
function fly(){const pc=gate.querySelector(".pcard"),hc=$("rcard").getBoundingClientRect(),st=gate.querySelector(".stage").getBoundingClientRect();
  const w0=st.width*.62,s=hc.width/w0,cx=hc.left+hc.width/2-(st.left+st.width/2),cy=hc.top+hc.height/2-(st.top+st.height/2);
  pc.style.transition="transform 1.5s cubic-bezier(.45,.05,.2,1),opacity .6s";pc.style.transform=`translate(calc(-50% + ${cx}px),calc(-50% + ${cy}px)) scale(${s})`}
$("gtap").addEventListener("click",()=>{if(opened)return;opened=true;
  try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
  try{aud.volume=0;const p=aud.play();p&&p.then(()=>{mute.classList.add("on");let v=0;const f=setInterval(()=>{v=Math.min(.5,v+.03);aud.volume=v;if(v>=.5)clearInterval(f)},120)}).catch(()=>{})}catch(e){}
  const S=(c,ms)=>setTimeout(()=>gate.classList.add(c),ms);
  gate.classList.add("st-press");S("st-free",260);S("st-part",760);S("st-card",1150);
  setTimeout(()=>{gate.classList.add("st-dark");fly()},2700);
  setTimeout(()=>{document.body.classList.add("shown");go(0)},3900);
  S("st-fade",4200);setTimeout(()=>{gate.classList.add("gone");document.body.classList.add("deck-on")},4900)});
mute.onclick=()=>{if(aud.paused){aud.play().catch(()=>{});$("mW").style.display=""}else{aud.pause();$("mW").style.display="none"}};
</script>
