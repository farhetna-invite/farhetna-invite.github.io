*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f2f4f8;--ink:#23314a;--sub:#6a778e;--acc:#22365c;--g1:#f3dfa6;--g2:#b8904a;--g3:#8a6526;--card:#fbfcff;--line:#dae0eb;--cell:#eaeef5}
html{-webkit-text-size-adjust:100%}
body{font-family:"Noto Naskh Arabic",serif;background:var(--bg);color:var(--ink);line-height:1.8;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}a{color:inherit}
.gold{background:linear-gradient(180deg,var(--g1) 0%,var(--g2) 55%,var(--g3) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.flag{position:fixed;top:12px;right:12px;z-index:60;font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.85);color:var(--acc)}
#mu{position:fixed;z-index:60;left:14px;top:12px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.88);color:var(--acc);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px -8px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .4s}
body.open #mu{opacity:1;pointer-events:auto}#mu svg{width:18px;height:18px}#mu .pl{display:none}#mu.off .pa{display:none}#mu.off .pl{display:block}

/* hero: the table photo, the balloon arch and the gold name */
.hero{position:relative;height:100svh;min-height:600px;overflow:hidden;background:#222 url(../rabee/bg-navy.webp) center bottom/cover no-repeat}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,36,.55) 0%,rgba(0,0,0,0) 42%,rgba(0,0,0,0) 70%,rgba(0,0,0,.25))}
.arch{position:absolute;left:-4%;width:108%;top:2%;z-index:2;transform:translateY(105vh) scale(.9);opacity:0}
.ht{position:absolute;left:0;right:0;top:15%;z-index:3;text-align:center;color:#fffaf0;padding:0 18%}
.ht .k{font-size:15px;opacity:0;text-shadow:0 1px 2px rgba(0,0,0,.6),0 2px 12px rgba(0,0,0,.55)}
.ht .rb{font-family:"Aref Ruqaa",serif;font-size:clamp(26px,8vw,36px);margin-top:4px;opacity:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
.ht h1{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(56px,18vw,92px);line-height:1.1;margin:2px 0;filter:drop-shadow(0 4px 12px rgba(0,0,0,.45))}
.ht h1 span{display:inline-block;padding:0 .08em;clip-path:inset(0 0 0 100%);-webkit-clip-path:inset(0 0 0 100%)}
.ht .yrs{font-size:16px;opacity:0;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.ht .dt{font-family:"Cormorant Garamond",serif;letter-spacing:.2em;font-size:17px;margin-top:6px;opacity:0;text-shadow:0 2px 8px rgba(0,0,0,.5)}
body.open .arch{animation:archUp 2.2s cubic-bezier(.2,.9,.25,1) .1s forwards}
@keyframes archUp{0%{transform:translateY(105vh) scale(.9);opacity:1}70%{transform:translateY(-2%) scale(1.01);opacity:1}100%{transform:none;opacity:1}}
body.open .ht .k{animation:fi 1s ease 1.4s forwards}body.open .ht .rb{animation:fi 1s ease 1.6s forwards}
body.open .ht h1 span{animation:wipe 1.5s cubic-bezier(.4,0,.2,1) 1.9s forwards}
@keyframes wipe{to{clip-path:inset(0 0 0 0);-webkit-clip-path:inset(0 0 0 0)}}
body.open .ht .yrs{animation:fi 1s ease 2.9s forwards}body.open .ht .dt{animation:fi 1s ease 3.2s forwards}
@keyframes fi{to{opacity:1}}@keyframes lt{to{opacity:1;transform:none}}
.sc{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:3;color:#fff;font-size:12.5px;opacity:0;text-shadow:0 1px 6px rgba(0,0,0,.6)}
body.open .sc{animation:fi 1s ease 3.8s forwards}
.spk{position:absolute;z-index:4;width:6px;height:6px;border-radius:50%;background:#fff3c8;box-shadow:0 0 10px 3px rgba(255,214,120,.85);pointer-events:none}

/* gate: the blurred scene with the gold seal carrying the age */
#gate{position:fixed;inset:0;z-index:50;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;-webkit-tap-highlight-color:transparent;transition:opacity 1.1s ease .5s,visibility 0s 1.6s}
#gate .bl{position:absolute;inset:-20px;background:url(../rabee/bg-navy.webp) center bottom/cover no-repeat;filter:blur(14px) brightness(.8)}
#gate .tn{position:absolute;inset:0;background:rgba(10,18,36,.55)}
#gate>*:not(.bl):not(.tn){position:relative}
#gate .k{color:#fff;font-size:15px;letter-spacing:.05em;text-shadow:0 2px 8px rgba(0,0,0,.5);margin-bottom:18px}
#gate .seal{width:min(52vw,230px);aspect-ratio:420/428;position:relative;filter:drop-shadow(0 18px 24px rgba(0,0,0,.45));animation:br 2.6s ease-in-out infinite;transition:transform .9s cubic-bezier(.3,1.4,.4,1),opacity .6s .3s}
#gate .seal img{width:100%;height:100%;display:block}
#gate .seal b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:min(20vw,92px);line-height:1;color:#a87c34;text-shadow:0 1px 0 #f8e6b0,0 -1px 0 #7a5520,0 2px 3px rgba(80,50,10,.35)}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
#gate .t{margin-top:22px;padding:8px 18px;border-radius:99px;background:rgba(255,255,255,.9);color:var(--acc);font-size:14.5px;box-shadow:0 8px 20px -12px rgba(0,0,0,.45);animation:hint 2s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
#gate.open .seal{animation:none;transform:scale(1.35);opacity:0}
#gate.open{opacity:0;visibility:hidden;pointer-events:none}

/* page */
main{position:relative;max-width:540px;margin:0 auto;padding:10px 20px 100px}
.sec{padding:42px 0 6px;text-align:center}
.kk{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17px;color:var(--g2)}
h2{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:32px;line-height:1.35;color:var(--acc);margin:2px 0 12px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--g2);margin:6px 0 14px}
.orn::before,.orn::after{content:"";height:1px;width:70px;background:linear-gradient(90deg,transparent,var(--g2),transparent)}
.note{background:var(--card);border-radius:22px;padding:28px 22px;box-shadow:0 18px 40px -30px rgba(40,40,20,.55);border:1px solid var(--line);position:relative}
.note::before{content:"“";position:absolute;top:-6px;right:18px;font-family:"Cormorant Garamond",serif;font-size:80px;line-height:1;color:var(--g2);opacity:.5}
.note p{font-size:17.5px;white-space:pre-line}
.note .sig{margin-top:12px;font-family:"Aref Ruqaa",serif;font-size:22px;color:var(--acc)}
.jr{position:relative;margin-top:10px;padding:6px 0}
.jr::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1.5px;background:linear-gradient(var(--g2),transparent);transform:translateX(-50%)}
.jr figure{position:relative;width:62%;margin:0 0 18px;background:#fff;padding:9px 9px 12px;border-radius:4px;box-shadow:0 14px 26px -16px rgba(40,30,10,.55)}
.jr figure:nth-child(odd){margin-right:0;margin-left:auto;transform:rotate(-3deg)}
.jr figure:nth-child(even){margin-left:0;margin-right:auto;transform:rotate(2.5deg)}
.jr img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}
.jr figure::after{content:"";position:absolute;top:-10px;left:50%;width:60px;height:20px;margin-left:-30px;background:rgba(232,220,186,.85);transform:rotate(-4deg)}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.cd div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 0 8px}
.cd b{display:block;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:34px;line-height:1.1}
.cd span{font-size:12.5px;color:var(--sub)}
.today{font-family:"Aref Ruqaa",serif;font-size:26px;color:var(--acc)}
.det{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 16px}
.det .w{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.det .w div{background:var(--cell);border-radius:16px;padding:12px 6px}
.det .w i{display:block;font-style:normal;font-size:22px}
.det .w b{display:block;font-size:17px}.det .w span{font-size:13.5px;color:var(--sub)}
.det .v{margin-top:14px}.det .v b{display:block;font-size:20px;color:var(--acc)}.det .v span{color:var(--sub);font-size:15px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.bt{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 18px;border-radius:99px;font-size:14.5px;font-weight:600;text-decoration:none;background:var(--acc);color:#fff}
.bt.ln{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--acc)}
.prog{list-style:none;max-width:360px;margin:0 auto;text-align:right}
.prog li{display:flex;justify-content:space-between;gap:12px;padding:11px 4px;border-bottom:1px dashed var(--line);font-size:16px}
.prog li span{color:var(--g2);font-weight:600;white-space:nowrap}
.sur{margin:18px auto 0;max-width:420px;padding:12px 16px;border-radius:16px;background:linear-gradient(135deg,rgba(184,144,74,.14),rgba(184,144,74,.06));border:1px dashed var(--g2);font-size:15.5px}
form{text-align:right;margin-top:8px}
form label.l{display:block;font-size:14px;color:var(--sub);margin:12px 0 4px}
form input,form textarea{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none}
form textarea{min-height:110px;resize:vertical}
form input:focus,form textarea:focus{border-color:var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.two button{height:48px;border-radius:14px;box-shadow:inset 0 0 0 1.5px var(--line);font-size:15px;font-weight:600;color:var(--acc);background:#fff}
.two button[aria-pressed=true]{background:var(--acc);color:#fff;box-shadow:none}
.cnt{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:6px}
.cnt button{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);font-size:20px;color:var(--acc)}
.cnt b{font-size:22px;min-width:30px;text-align:center}
.hide{display:none!important}
.send{width:100%;height:52px;margin-top:16px;border-radius:99px;background:var(--acc);color:#fff;font-size:17px;font-weight:700}
.send:disabled{opacity:.6}
.err{color:#b0412e;font-size:14px;margin-top:8px;text-align:center;min-height:1em}
.done b{display:block;font-family:"Aref Ruqaa",serif;font-size:30px;color:var(--acc)}.done p{color:var(--sub);margin:4px 0 10px}
.end{padding:46px 0 10px;text-align:center}
.end .c{font-family:"Aref Ruqaa",serif;font-size:30px;line-height:1.5}
footer{text-align:center;font-size:13px;color:var(--sub);padding:20px 0 40px}footer a{color:var(--acc);font-weight:600;text-decoration:none}
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}#gate .seal,#gate .t{animation:none}}
</style>
</head>

$("main").innerHTML=h;

function tick(){var s=Math.max(0,Math.floor((dt-new Date())/1000));if(!s){$("cd").classList.add("hide");$("today").classList.remove("hide");return}
  $("cdD").textContent=ar(Math.floor(s/86400));$("cdH").textContent=ar(Math.floor(s%86400/3600));$("cdM").textContent=ar(Math.floor(s%3600/60));$("cdS").textContent=ar(s%60)}
tick();setInterval(tick,1000);
$("ics").onclick=function(){var z=function(d){return d.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"")},e=new Date(+dt+4*3600e3),q=function(x){return String(x||"").replace(/([,;\\])/g,"\\$1")},title="عيد ميلاد "+N;
  var c=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Farhetna//Birthday//AR","BEGIN:VEVENT","UID:"+z(dt)+"-"+Math.random().toString(36).slice(2)+"@farhetna","DTSTAMP:"+z(new Date()),"DTSTART:"+z(dt),"DTEND:"+z(e),
    "SUMMARY:"+q(title),"LOCATION:"+q([D.venue,D.addr].filter(Boolean).join(" - ")),"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+q(title),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  var u=URL.createObjectURL(new Blob([c],{type:"text/calendar;charset=utf-8"})),a=document.createElement("a");a.href=u;a.download="birthday.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)};
var io=("IntersectionObserver"in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.12}):null;
function watch(){document.querySelectorAll("main .rv:not(.in)").forEach(function(e){if(io)io.observe(e);else e.classList.add("in")})}

var au=$("bgm");if(D.music==="none"){au.removeAttribute("src");$("mu").hidden=true}else if(D.music)au.src=D.music;
var playing=false;function setMu(on){playing=on;$("mu").classList.toggle("off",!on);if(on){au.volume=0;var p=au.play();if(p&&p.catch)p.catch(function(){playing=false;$("mu").classList.add("off")});var v=0,f=setInterval(function(){v+=.05;au.volume=Math.min(.8,v);if(v>=.8)clearInterval(f)},120)}else au.pause()}
$("mu").onclick=function(){setMu(!playing)};
function sparkle(){var hero=$("hero"),W=hero.clientWidth,H=hero.clientHeight;for(var i=0;i<26;i++){var s=document.createElement("i");s.className="spk";var x=W*(.2+Math.random()*.6),y=H*(.12+Math.random()*.3);s.style.left=x+"px";s.style.top=y+"px";hero.appendChild(s);
  s.animate([{opacity:0,transform:"scale(.2)"},{opacity:1,transform:"scale(1)",offset:.3},{opacity:0,transform:"translateY(-30px) scale(.3)"}],{duration:1400+Math.random()*1200,delay:1500+Math.random()*1800,fill:"forwards"}).onfinish=function(){this.effect.target.remove()}}}
var opened=false;function open(){if(opened)return;opened=true;var g=$("gate");g.classList.add("open");if(D.music!=="none")setMu(true);if(navigator.vibrate)navigator.vibrate(14);
  document.body.classList.remove("locked");document.body.classList.add("open");$("main").removeAttribute("aria-hidden");sparkle();setTimeout(watch,600)}
$("gate").addEventListener("click",open);$("gate").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();open()}});

/* RSVP: the message goes in the note, which only the celebrant's family sees (studio → RSVP replies) */
var att=true,cnt=1,DEV=(function(){try{var k="farhetna_dev",v=localStorage.getItem(k);if(!v){v=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,v)}return v}catch(e){return""}})();
var RK="farhetna_rsvp_rbm_"+(D.slug||N+D.date);
document.querySelectorAll(".two button").forEach(function(b){b.onclick=function(){att=b.getAttribute("data-a")==="1";document.querySelectorAll(".two button").forEach(function(x){x.setAttribute("aria-pressed",String(x===b))});$("cntBox").classList.toggle("hide",!att)}});
function showCnt(){$("cnt").textContent=ar(cnt)}
$("minus").onclick=function(){if(cnt>1){cnt--;showCnt()}};$("plus").onclick=function(){if(cnt<15){cnt++;showCnt()}};
function waLink(r){var wa=String(D.wa||"").replace(/\D/g,"");if(!wa)return"";if(/^0/.test(wa))wa="2"+wa;
  var m=r.yes?("أهلًا ✨\nأنا "+r.name+"، وبأكد حضوري عيد ميلاد "+N+" إن شاء الله\nعدد الحضور: "+r.count):("أهلًا ✨\nأنا "+r.name+"، وللأسف مش هقدر أحضر عيد ميلاد "+N+". كل سنة و"+(FEM?"هي":"هو")+" طيب 🤍");
  if(r.msg)m+="\n\nرسالتي لـ"+N+":\n"+r.msg;return"https://wa.me/"+wa+"?text="+encodeURIComponent(m)}
function done(r,sub){$("rf").classList.add("hide");$("done").classList.remove("hide");$("dBig").textContent=r.yes?"مستنيينك ✨":"هتوحشنا 🤍";$("dSub").textContent=sub||(r.msg?"رسالتك وصلت وهتتقري يوم الحفلة 💌":"شكرًا إنك عرّفتنا. تقدر تعدّل ردك في أي وقت.");
  var w=waLink(r);$("dWa").classList.toggle("hide",!w||MODE!=="live");if(w)$("dWa").href=w}
$("dEdit").onclick=function(){$("done").classList.add("hide");$("rf").classList.remove("hide")};
try{var prev=JSON.parse(localStorage.getItem(RK)||"null");if(prev&&MODE==="live"){$("rn").value=prev.name;cnt=prev.count||1;showCnt();$("rm").value=prev.msg||"";document.querySelector('.two button[data-a="'+(prev.yes?1:0)+'"]').click();done(prev,"ردك وصل قبل كده. تقدر تعدّله في أي وقت.")}}catch(e){}
$("rf").onsubmit=function(e){e.preventDefault();var r={name:$("rn").value.trim(),yes:att,count:att?cnt:0,msg:$("rm").value.trim()};$("err").textContent="";
  if(r.name.length<2){$("err").textContent="اكتب اسمك من فضلك";$("rn").focus();return}
  if(MODE!=="live"){done(r,MODE==="preview"?"ده عرض معاينة، فالرد مش بيتسجل.":"دي دعوة تجريبية، فالرد مش بيتسجل. في الدعوة الحقيقية الرسالة بتوصل لأصحاب الحفلة.");return}
  var btn=$("send"),lbl=btn.querySelector("span");btn.disabled=true;lbl.textContent="بنبعت ردك…";var fin=function(){btn.disabled=false;lbl.textContent="ابعت الرد"};
  var toWa=function(){var w=waLink(r);if(w){$("err").textContent="هنحوّلك لواتساب تبعت ردك…";setTimeout(function(){location.href=w},800)}else $("err").textContent="معرفناش نسجّل الرد. اتأكد من النت وجرب تاني.";fin()};
  if(!D.slug){toWa();return}
  fetch(SB.url+"/rest/v1/rpc/add_rsvp",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.key,Authorization:"Bearer "+SB.key},body:JSON.stringify({p_slug:D.slug,p_name:r.name,p_attending:r.yes,p_guests:r.count,p_note:r.msg,p_device:DEV})})
  .then(function(res){if(!res.ok)throw new Error(res.status);try{localStorage.setItem(RK,JSON.stringify(r))}catch(e){}fin();done(r)}).catch(toWa)};
setTimeout(function(){var b=$("fhBack");if(b)b.href="../birthday/"},1600);
})();
</script>
