<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rose Veil · فرحتنا</title>
<meta name="theme-color" content="#f6d3ce">
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="../favicon-32.png">
<link rel="preload" as="image" href="img/env-closed.webp" fetchpriority="high">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--ol:#6b7547;--ol2:#56603a;--ink:#4a4436;--mute:#8a7a6c;--rose:#c9828a;--line:rgba(107,117,71,.28);--pink:#f6d3ce;
  --ar:"Noto Naskh Arabic",serif;--ruq:"Aref Ruqaa","Noto Naskh Arabic",serif;--en:"Cormorant Garamond",Georgia,serif;--scr:"Pinyon Script","Cormorant Garamond",cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-feature-settings:"lnum" 1}
html{background:var(--pink)}
body{font-family:var(--en);font-size:18px;color:var(--ink);min-height:100vh;overflow-x:hidden;line-height:1.6;background:radial-gradient(120% 60% at 50% 0,#fae3de,#f6d2cc 60%,#f3cbc5)}
html[lang=ar] body{font-family:var(--ar);font-size:16px;line-height:1.85}
body.locked{overflow:hidden;height:100vh}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.ctl{position:fixed;z-index:60;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(255,248,244,.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:grid;place-items:center;cursor:pointer;color:var(--ol2);box-shadow:0 4px 14px rgba(120,70,60,.14)}
#lg{top:max(14px,env(safe-area-inset-top));right:14px;font:600 14px var(--en)}
html[lang=en] #lg{font:500 17px var(--ar)}
#mu{bottom:max(16px,env(safe-area-inset-bottom));left:14px}
#mu svg{width:20px;height:20px}
#mu .bars rect{transform-origin:center bottom;animation:eq 1s ease-in-out infinite}
#mu .bars rect:nth-child(2){animation-delay:-.4s}#mu .bars rect:nth-child(3){animation-delay:-.7s}#mu .bars rect:nth-child(4){animation-delay:-.2s}
#mu.off .bars rect{animation:none;transform:scaleY(.35)}
@keyframes eq{50%{transform:scaleY(.35)}}
.flag{position:fixed;top:max(14px,env(safe-area-inset-top));left:14px;z-index:60;background:var(--ol2);color:#fff;font:500 12px var(--ar);padding:5px 12px;border-radius:20px}

/* ---------- 1 · envelope ---------- */
#gate{position:fixed;inset:0;z-index:50;overflow:hidden;background:#f3cfca;transition:opacity 1.1s ease,visibility 1.1s;cursor:pointer}
#gate.gone{opacity:0;visibility:hidden;pointer-events:none}
.stage{position:absolute;left:50%;top:50%;width:max(100vw,calc(100svh*.5628));aspect-ratio:941/1672;transform:translate(-50%,-50%);container-type:inline-size}
.stage>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.e-open,.e-front{opacity:0;transition:opacity 1.6s ease}
.e-front{z-index:5;clip-path:polygon(0 30.6%,50% 48.6%,100% 30.6%,100% 100%,0 100%)}
#gate.s2 .e-open,#gate.s2 .e-front{opacity:1}
.seal{position:absolute;left:39.5%;top:46%;width:21cqw;height:21cqw;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:3;transition:opacity .5s ease,transform .6s ease}
.seal svg{width:80%;height:80%;color:#768c5c;filter:drop-shadow(0 -.25cqw .1cqw rgba(40,55,25,.6)) drop-shadow(0 .3cqw .05cqw rgba(225,235,205,.7))}
.seal::after{content:"";position:absolute;inset:-12%;border-radius:50%;border:.5cqw solid rgba(255,255,255,.85);animation:ring 2.2s ease-out infinite}
@keyframes ring{from{transform:scale(.85);opacity:.9}to{transform:scale(1.35);opacity:0}}
.seal{transition:opacity .9s ease,transform 1s ease}
.seal{z-index:6}#gate.s1 .seal::after{animation:none;opacity:0}#gate.s5 .seal{opacity:0}
.g-names{position:absolute;left:8%;right:8%;top:56%;text-align:center;z-index:3;transition:opacity .5s}
.g-names .nm{font:400 10cqw/1.25 var(--scr);color:#5c6a3c;white-space:nowrap;text-shadow:0 0 1.5cqw rgba(255,240,236,.9)}
html[lang=ar] .g-names .nm{font:400 9cqw/1.5 var(--ruq)}
.g-names .dt{font:500 4.2cqw var(--en);letter-spacing:.25em;color:#7a6a5e;direction:ltr}
.tap{position:absolute;left:0;right:0;top:71%;text-align:center;z-index:3;font:500 5.4cqw var(--en);color:#5c6a3c;text-shadow:0 0 1.2cqw rgba(255,240,236,.95);animation:pulse 2.4s ease-in-out infinite;transition:opacity .4s}
html[lang=ar] .tap{font:500 4.6cqw var(--ar)}
@keyframes pulse{50%{opacity:.55}}
#gate.s1 .g-names,#gate.s1 .tap{opacity:0;animation:none}
.e-card{position:absolute;z-index:4;left:14.56%;top:12.4%;width:70.8%;aspect-ratio:955/1350;opacity:0;
  background:url(img/card.webp?v=2) center/100% 100%;border-radius:.4cqw;box-shadow:0 2cqw 6cqw rgba(110,60,55,.28);
  transform-origin:50% 40%;transition:opacity .6s ease,transform 2.4s cubic-bezier(.45,.05,.3,1);container-type:inline-size;transform:none}
#gate.s3 .e-card{opacity:1;transition:opacity .7s ease,transform 2.4s cubic-bezier(.45,.05,.3,1)}
#gate.s4 .e-card{transform:translateY(-22%)}
#gate.s5 .e-card{z-index:7;transform:translateY(8%) scale(1.14);transition:transform 1.6s cubic-bezier(.25,.8,.25,1)}
#gate.s5 .e-front,#gate.s5 .e-open,#gate.s5 .e-closed{opacity:.0;transition:opacity 1.4s ease}
#gate.s5{background:#f6d5cf}
.e-card .in{position:absolute;left:12%;right:12%;top:16%;bottom:38%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ol2)}
.e-card .k{font:italic 500 4.2cqw var(--en);letter-spacing:.3em;text-transform:uppercase;color:#8a7a6c}
html[lang=ar] .e-card .k{font:500 5.2cqw var(--ruq);letter-spacing:0;text-transform:none}
.e-card .nm{font:400 12.5cqw/1.25 var(--scr);margin:3cqw 0 1cqw;white-space:nowrap}
html[lang=ar] .e-card .nm{font:400 11cqw/1.5 var(--ruq)}
.e-card .orn{width:30cqw;color:#7d8857}
.e-card .dd{font:500 5cqw var(--en);letter-spacing:.2em;color:#7a6a5e;margin-top:2cqw;direction:ltr}

/* ---------- scenes (the painted cards) ---------- */
main{position:relative;max-width:520px;margin:0 auto;padding-bottom:60px}
.scene{position:relative;width:100%;aspect-ratio:941/1672;background:center/100% 100% no-repeat;container-type:inline-size;text-align:center}
.scene+.scene{margin-top:-9cqw}

.ov{position:absolute;left:21%;right:21%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rv{opacity:0;transform:translateY(18px);transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.15s}.rv.d2{transition-delay:.3s}.rv.d3{transition-delay:.45s}
.orn{display:block;width:30cqw;height:4cqw;margin:2cqw auto;color:#7d8857}
.h{font:400 7cqw/1.25 var(--en);color:var(--ol2);white-space:pre-line}
html[lang=ar] .h{font:400 6.2cqw/1.5 var(--ruq)}

/* 2 · welcome (chiffon & chandelier) */
#welcome{position:relative;min-height:100svh;padding:0 0 90px;text-align:center;container-type:inline-size;overflow:hidden;background:#f8cfca;display:flex;flex-direction:column;justify-content:flex-start;
  -webkit-mask-image:linear-gradient(#000 88%,transparent);mask-image:linear-gradient(#000 88%,transparent)}
#welcome .ov{margin-top:3cqw!important}
.chw{position:relative;width:86%;margin:0 auto;animation:sway 7s ease-in-out infinite;transform-origin:50% 0}
.ch{display:block;width:100%}
@keyframes sway{50%{transform:rotate(1.2deg)}}
.wc{position:absolute;pointer-events:none;width:46%}
.wc.tr{top:-10px;right:-14%}.wc.bl{bottom:-10px;left:-14%}
#welcome .ov{position:relative;left:auto;right:auto;margin:0 14%}
.fam{font:italic 500 5.4cqw var(--en);color:#7d8857}
html[lang=ar] .fam{font:400 5.6cqw var(--ruq);font-style:normal}
.intro{font-size:4.4cqw;line-height:1.6;color:#5b5446;white-space:pre-line;margin-top:2cqw}
html[lang=ar] .intro{font-size:4.1cqw;line-height:1.9}
.names{margin:4cqw -8cqw 0;font:400 15cqw/1.25 var(--scr);color:var(--ol2);white-space:nowrap}
.names .amp{font-size:.6em;color:var(--rose);margin:0 .1em}
html[lang=ar] .names{font:400 13cqw/1.5 var(--ruq)}
.getting{font:italic 500 5.8cqw var(--en);color:#7d8857}
html[lang=ar] .getting{font:400 5.6cqw var(--ruq);font-style:normal}
.wdate{font:500 5.4cqw var(--en);letter-spacing:.12em;color:var(--ol2);margin-top:1cqw}
html[lang=ar] .wdate{font:600 4.8cqw var(--ar);letter-spacing:0}
.at{font-size:4.4cqw;color:#7a6a5e}

/* welcome: words come alive one after another */
#welcome .w,#intro .il{opacity:0}
#welcome.play .fam{animation:rise 1.1s ease .2s forwards,track 1.6s ease .2s forwards}
#intro .il{display:block;filter:blur(6px);transform:translateY(10px)}
#welcome.play #intro .il{animation:clear 1.1s ease forwards}
#welcome.play .names{animation:write 2.4s cubic-bezier(.5,.1,.3,1) 2.7s forwards}
#welcome .names{clip-path:inset(-30% 100% -30% 0);-webkit-clip-path:inset(-30% 100% -30% 0);opacity:1!important}
html[dir=rtl] #welcome .names{clip-path:inset(-30% 0 -30% 100%);-webkit-clip-path:inset(-30% 0 -30% 100%)}
#welcome.play .names .amp{display:inline-block;animation:pop2 .8s cubic-bezier(.3,1.6,.4,1) 3.7s both}
#welcome.play .getting{animation:rise 1s ease 5s forwards}
#welcome .orn path{stroke-dasharray:60;stroke-dashoffset:60}
#welcome.play .orn{animation:fade .4s ease 5.6s forwards}#welcome.play .orn path{animation:draw 1.4s ease 5.6s forwards}
#welcome.play .wdate{animation:rise 1s ease 6.4s forwards,track 1.6s ease 6.4s forwards}
#welcome.play .at{animation:rise 1s ease 6.9s forwards}
#welcome.play .names{animation:write 2.4s cubic-bezier(.5,.1,.3,1) 2.7s forwards,glow 4s ease-in-out 5.4s infinite}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes track{from{letter-spacing:.35em}to{}}
@keyframes clear{to{opacity:1;filter:none;transform:none}}
@keyframes write{to{clip-path:inset(-30% 0 -30% 0);-webkit-clip-path:inset(-30% 0 -30% 0)}}
@keyframes pop2{0%{transform:scale(0) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes fade{to{opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}
@keyframes glow{50%{text-shadow:0 0 18px rgba(255,236,200,.95)}}
.spk{position:absolute;inset:0;pointer-events:none;z-index:1}
.chw .spk i{width:4.4cqw;height:4.4cqw}
.spk i{position:absolute;width:3.2cqw;height:3.2cqw;margin:-1.6cqw;background:radial-gradient(circle,#fff 0 12%,rgba(255,244,214,.9) 22%,transparent 60%);
  clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);animation:tw 2.8s ease-in-out infinite;opacity:0}
@keyframes tw{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:1;transform:scale(1.2) rotate(45deg)}}
@media (prefers-reduced-motion:reduce){#welcome .w,#intro .il{opacity:1!important;filter:none;transform:none}#welcome .names{clip-path:none!important}.spk{display:none}}
/* simple sections: one cream card each on plain blush paper */
.sec{position:relative;padding:22px 20px}
.pc{position:relative;max-width:400px;margin:0 auto;padding:34px 24px 32px;text-align:center;background:#fcf3ea;border-radius:26px;
  box-shadow:0 0 0 1px rgba(107,117,71,.55),0 0 0 6px #fcf3ea,0 0 0 7px rgba(107,117,71,.35),0 18px 40px -22px rgba(120,60,55,.45)}
.pc .ico{display:block;width:40px;height:40px;margin:0 auto;color:var(--ol)}
.pc .orn{width:130px;height:14px;margin:8px auto 10px}
.pc h2{font:400 32px/1.25 var(--en);color:var(--ol2);white-space:pre-line}
html[lang=ar] .pc h2{font:400 27px/1.6 var(--ruq)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:30px;border:1px solid var(--ol);
  background:rgba(255,255,255,.6);color:var(--ol2);font-size:15px;text-decoration:none;cursor:pointer;transition:transform .15s}
.btn.fill{background:linear-gradient(#77824f,#606b3f);border-color:#606b3f;color:#fff;box-shadow:0 6px 16px rgba(90,100,60,.3)}
.btn:active{transform:scale(.97)}
.btn svg{width:16px;height:16px;flex:none}
.gl{display:block;margin-top:8px;font-size:13px;color:var(--ol2)}
/* countdown */
.ct{font:italic 500 21px var(--en);color:var(--ol2);margin-bottom:16px}
html[lang=ar] .ct{font:400 22px var(--ruq);font-style:normal}
.cd{display:flex;justify-content:center;gap:8px;direction:ltr}
.cd div{width:70px;padding:12px 0 8px;border-radius:16px;background:#f8e2dc;border:1px solid rgba(107,117,71,.45)}
.cd b{display:block;font:500 30px/1 var(--en);color:var(--ol2);font-variant-numeric:tabular-nums}
.cd span{font:italic 500 13px var(--en);color:#8a7a6c}
html[lang=ar] .cd span{font:500 12px var(--ar);font-style:normal}
#cdDone{font:400 32px var(--scr);color:var(--rose)}html[lang=ar] #cdDone{font:400 26px var(--ruq)}
.calbox{margin-top:20px}
/* programme */
.tl{display:grid;gap:4px;max-width:300px;margin:6px auto 0}
.ti{display:flex;align-items:center;gap:14px;text-align:start;padding:8px 0}
.ti .ic{flex:none;width:48px;height:48px;border-radius:50%;background:#f8e2dc;border:1px solid rgba(107,117,71,.45);display:grid;place-items:center;color:var(--ol2)}
.ti .ic svg{width:30px;height:30px}
.ti .tx{flex:1;border-bottom:1px solid rgba(107,117,71,.35);padding-bottom:6px}
.ti .t{font:600 18px/1.2 var(--en);color:var(--ol2)}html[lang=ar] .ti .t{font:600 15px/1.5 var(--ar)}
.ti .l{font-size:15px;line-height:1.35;color:#6a5f52}
/* venue */
.vn{font:500 24px/1.3 var(--en);color:var(--ink)}html[lang=ar] .vn{font:400 24px/1.5 var(--ruq)}
.va{font-style:italic;color:var(--mute);margin:2px 0 14px}html[lang=ar] .va{font-style:normal}
.maplink{display:block;max-width:300px;margin:0 auto 16px;border-radius:16px;overflow:hidden;box-shadow:0 0 0 1px rgba(107,117,71,.3)}
.maplink img{display:block;width:100%}
/* dress */
.pal{font-size:19px;color:var(--ink)}html[lang=ar] .pal{font-size:17px}
.pn{color:var(--mute);font-size:15px}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin:18px auto}
.dot{width:66px;height:66px;border-radius:50%;position:relative;overflow:hidden;box-shadow:0 8px 18px rgba(110,70,60,.18),0 0 0 3px #fff,0 0 0 4px var(--line)}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse 55% 35% at 34% 24%,rgba(255,255,255,.55),transparent 70%)}
.dnote{max-width:28ch;margin:0 auto;font-style:italic}html[lang=ar] .dnote{font-style:normal}
/* closing */
.cl{max-width:30ch;margin:10px auto 0;color:#5b5446}.cl p+p{margin-top:10px}
.heart{color:var(--ol);font-size:26px;margin-top:12px}
.sign{font:400 40px/1.25 var(--scr);color:var(--ol2);white-space:nowrap}html[lang=ar] .sign{font:400 30px/1.5 var(--ruq)}
/* rsvp */
.rsub{color:var(--mute);font-style:italic;font-size:16px;margin-top:4px}html[lang=ar] .rsub{font-style:normal;font-size:15px}
form{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;width:100%;max-width:320px;margin:18px auto 0;text-align:start}
.fld{display:flex;align-items:center;gap:10px;min-height:50px;padding:0 16px;border-radius:30px;background:#f8e2dc;border:1px solid rgba(107,117,71,.25)}
.fld>svg{width:20px;height:20px;flex:none;color:var(--ol)}
#rn{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:16px}
#rn::placeholder{color:#a48f84}
.lb{flex:1;color:#8a7a6c;font-size:15px}
.step{display:flex;align-items:center;gap:10px;direction:ltr}
.step button{width:32px;height:32px;border-radius:50%;border:1px solid rgba(107,117,71,.4);background:#fff8;font-size:19px;line-height:1;color:var(--ol2);cursor:pointer}
.step b{font:600 20px var(--en);color:var(--ol2);min-width:18px;text-align:center}
.yns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:22px;border:1px solid rgba(107,117,71,.3);background:#f8ecdf;cursor:pointer;font-size:14px;color:#6a5f52;text-align:center;transition:.2s}
.yn.n{background:#f9e3df}
.yn input{position:absolute;opacity:0;pointer-events:none}
.yn i{font-style:normal;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ol);display:grid;place-items:center;color:var(--ol2);font-size:15px}
.yn.on{box-shadow:0 0 0 2px #77824f;background:#eef0df}.yn.n.on{background:#f6dbd5}
#note{background:none;border:0;color:var(--ol2);font-size:14px;text-decoration:underline;cursor:pointer}
#rm{width:100%;min-height:80px;border:1px solid rgba(107,117,71,.3);border-radius:18px;background:#fff9;padding:10px 14px;font-size:15px;outline:none;resize:vertical}
.err{color:#a14a4a;font-size:14px;min-height:1.1em;text-align:center}
#send{width:100%;min-height:50px;font-size:16px}#send[disabled]{opacity:.6}
.done{display:none;margin-top:16px;flex-direction:column;align-items:center}
.done.on{display:flex;animation:pop .6s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.done svg{width:48px;height:48px;color:#77824f}
.done .big{font:400 32px/1.3 var(--scr);color:var(--ol2)}html[lang=ar] .done .big{font:400 26px/1.5 var(--ruq)}
.done .sub{font-size:14px;color:#7a6a5e}
.done .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.rsvp-on #rf{display:none}
#car{background-image:url(img/car.webp);margin-top:2cqw;-webkit-mask-image:linear-gradient(transparent,#000 7%);mask-image:linear-gradient(transparent,#000 7%)}
.thanks{font:italic 500 4.6cqw/1.5 var(--en);color:#6b5a4c;white-space:pre-line}html[lang=ar] .thanks{font:500 4.2cqw/1.8 var(--ar);font-style:normal}
.carn{font:400 10cqw/1.3 var(--scr);color:#5c4d40;white-space:nowrap;text-shadow:0 0 3cqw rgba(255,240,230,.8)}html[lang=ar] .carn{font:400 10cqw/1.5 var(--ruq)}
footer{text-align:center;font-size:13px;color:var(--mute);padding:6px 0 30px}
footer a{color:var(--ol2)}
#petals{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.pt{position:absolute;top:-30px;width:13px;height:11px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#f9d8d4,#e2a7ad);opacity:.75;animation:fall linear forwards}
.pt.w{background:linear-gradient(135deg,#fffaf2,#efe2d2)}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.seal::after,.tap,#mu .bars rect{animation:none}#petals{display:none}}
</style>
</head>
<body class="locked">
<div id="petals" aria-hidden="true"></div>
<button class="ctl" id="lg" type="button" aria-label="اللغة / Language">EN</button>
<button class="ctl off" id="mu" type="button" aria-label="Music"><svg class="bars" viewBox="0 0 20 20" fill="currentColor"><rect x="3" y="5" width="2" height="11" rx="1"/><rect x="7.5" y="3" width="2" height="13" rx="1"/><rect x="12" y="6" width="2" height="10" rx="1"/><rect x="16" y="4" width="2" height="12" rx="1"/></svg></button>
<div class="flag" id="demoFlag">تجربة</div>
<audio id="bgm" loop preload="none" src="../music-piano2.mp3"></audio>

<div id="gate" role="button" tabindex="0" aria-label="Open the invitation">
  <div class="stage">

var KW=[[/استقبال|وصول|welcome|arriv|reception|guests/i,"arrive",["استقبال الضيوف","Guests arrive"]],[/كتب|عقد|قران|ceremony|vows|katb/i,"book",["كتب الكتاب","Katb El-Ketab"]],
  [/دبل|خاتم|شبكة|ring/i,"book",["لبس الدبل","Exchange of rings"]],[/رقص|dance/i,"dance",["الرقصة الأولى","First dance"]],
  [/زف|دخول|entrance|zaffa|couple/i,"couple",["دخول العروسين","Grand entrance"]],[/عشاء|بوفيه|اكل|أكل|dinner|food|buffet/i,"dinner",["العشاء","Dinner"]],
  [/تورت|كيك|cake/i,"cake",["تقطيع التورتة","Cake cutting"]],[/صور|تصوير|photo/i,"photo",["الصور التذكارية","Photos"]],
  [/دي ?جي|مزيك|موسيق|غنا|dj|music|party|حفلة|celebrat/i,"music",["احتفال ورقص","Celebration & dancing"]]];
function prog(label){for(var i=0;i<KW.length;i++)if(KW[i][0].test(label))return{ic:KW[i][1],tr:KW[i][2]};return{ic:"star",tr:null}}
function svgI(k){return'<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round">'+IC[k]+'</svg>'}

/* ---------- render ---------- */
function ini(){if(D.mono)return D.mono;var a=String(nm("groom")||"").trim().charAt(0),b=String(nm("bride")||"").trim().charAt(0);
  if(!a||!b)return"";return lang==="en"?a.toUpperCase()+"&"+b.toUpperCase():a+" و "+b}
function render(){
  var h=document.documentElement;h.lang=lang;h.dir=lang==="en"?"ltr":"rtl";$("lg").textContent=lang==="en"?"ع":"EN";
  document.querySelectorAll("[data-t]").forEach(function(e){e.textContent=t(e.getAttribute("data-t"))});
  $("rn").placeholder=t("yourName");
  var d=dt(),en=lang==="en",loc=en?"en-GB":"ar-EG",N=function(n){return en?String(n):arN(n)};
  var G=nm("groom"),B=nm("bride"),amp=en?" & ":" و ";
  var monthName=d.toLocaleDateString(loc,{month:"long"});
  var studioIntro=en?"":D.intro;
  var F={names:G+amp+B,ini:ini(),
    dots:[("0"+d.getDate()).slice(-2),("0"+(d.getMonth()+1)).slice(-2),d.getFullYear()].join("."),
    intro:studioIntro||t("intro"),longDate:en?(d.getDate()+" "+monthName+" "+d.getFullYear()):(N(d.getDate())+" "+monthName+" "+N(d.getFullYear())),
    weekday:d.toLocaleDateString(loc,{weekday:"long"}),day:N(d.getDate()),month:monthName,year:N(d.getFullYear()),at:t("at")+tm(D.time),
    venue:en?(D.venueEn||D.venue):D.venue,addr:en?(D.addrEn||D.addr):D.addr,
    dressNote:en?(D.dressEn||(isAr(D.dressNote)?"":D.dressNote)||"We'd love you to join us in soft pastel tones"):(D.dressNote||"يسعدنا تكونوا معانا بألوان باستيل هادية")};
  var cols=(D.dress||[]).filter(function(c){return/^#[0-9a-f]{6}$/i.test(c)}).map(function(c){return c.toLowerCase()});
  F.palNames=cols.map(function(c){return(DN[c]||["",""])[en?1:0]}).filter(Boolean).join(en?" · ":" · ");
  document.querySelectorAll("[data-f]").forEach(function(e){var k=e.getAttribute("data-f");if(k!=="namesHtml")e.textContent=F[k]==null?"":F[k]});
  var nh=document.querySelector('[data-f="namesHtml"]');nh.textContent="";
  [G,en?"&":"و",B].forEach(function(x,i){var s=document.createElement("span");if(i===1)s.className="amp";s.textContent=i===1?" "+x+" ":x;nh.appendChild(s)});
  requestAnimationFrame(function(){document.querySelectorAll('[data-f="names"],[data-f="namesHtml"]').forEach(function(el){el.style.fontSize="";var fs=parseFloat(getComputedStyle(el).fontSize);
    while(el.scrollWidth>el.clientWidth+2&&fs>28){fs-=2;el.style.fontSize=fs+"px"}})});
  /* programme */
  var tl=$("tl");tl.innerHTML="";(D.program||[]).forEach(function(p,i){if(!p||!p[1])return;var info=prog(p[1]),label=p[1];
    if(info.tr&&(en?isAr(label):!isAr(label)))label=info.tr[en?1:0];
    if(tl.children.length>=7)return;var it=document.createElement("div");it.className="ti rv"+(i%2?" d1":"");
    it.innerHTML='<div class="ic">'+svgI(info.ic)+'</div><div class="tx"><div class="t"></div><div class="l"></div></div>';
    it.querySelector(".t").textContent=tm(p[0]);it.querySelector(".l").textContent=label;tl.appendChild(it)});
  $("program").classList.toggle("hide",!tl.children.length);
  var nI=tl.children.length;tl.style.fontSize="";if(nI>6)tl.classList.add("many");
  /* dress code: satin swatches */
  var dots=$("dots");dots.innerHTML="";cols.forEach(function(c){var e=document.createElement("div");e.className="dot";
    e.style.background="linear-gradient(118deg,"+shade(c,-.08)+" 0%,"+shade(c,.42)+" 17%,"+c+" 31%,"+shade(c,-.14)+" 44%,"+shade(c,.3)+" 60%,"+c+" 74%,"+shade(c,-.1)+" 88%,"+shade(c,.25)+" 100%)";dots.appendChild(e)});
  var allPastel=cols.length&&cols.every(function(c){return PASTEL.indexOf(c)>-1});$("palT").textContent=allPastel?t("pastel"):t("colours");
  $("dress").classList.toggle("hide",!cols.length&&!D.dressNote);
  $("place").classList.toggle("hide",!D.venue&&!D.addr&&!D.venueEn);
  /* closing */
  var cl=$("cl");cl.innerHTML="";var lines=[];
  if(!en&&D.closing)lines.push(D.closing);else lines.push(t("c1"),t("c2"));
  if(!en&&D.notes)lines.push(D.notes);else if(en&&D.notes&&!isAr(D.notes))lines.push(D.notes);else lines.push(t("c3"));
  lines=[lines[0],t("c4")];lines.forEach(function(x){var p=document.createElement("p");p.textContent=x;cl.appendChild(p)});
  /* map + calendar */
  $("mapLink").href=$("mapBtn").href=D.map||("https://www.google.com/maps/search/?api=1&query="+encodeURIComponent([D.venue,D.addr].filter(Boolean).join(" ")));
  $("gcal").href=gcal();
  document.title=F.names+" · "+(en?"Wedding Invitation":"دعوة فرح");$("gate").setAttribute("aria-label",t("tap"));
  showCnt();watch();tick();
  var ie=$("intro"),txt=ie.textContent;ie.textContent="";txt.split("\n").forEach(function(l,i){var sp=document.createElement("span");sp.className="il";sp.textContent=l;sp.style.animationDelay=(1+i*.55)+"s";ie.appendChild(sp)});
  var wl=$("welcome");if(wl.classList.contains("play")){wl.classList.remove("play");void wl.offsetWidth;wl.classList.add("play")}
}

/* ---------- countdown ---------- */
var timer;function tick(){clearTimeout(timer);var ms=dt()-new Date();
  if(ms<=0){$("cd").classList.add("hide");$("cdDone").classList.remove("hide");return}
  var s=Math.floor(ms/1e3),v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
  ["cdD","cdH","cdM","cdS"].forEach(function(id,i){var x=i?("0"+v[i]).slice(-2):v[i];$(id).textContent=lang==="en"?x:arN(x)});timer=setTimeout(tick,1000-new Date()%1000)}

/* ---------- calendar ---------- */
function z(d){return d.toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"")}
function evt(){var s=dt(),e=new Date(+s+5*3600e3);return{s:s,e:e,title:(lang==="en"?"Wedding of ":"فرح ")+nm("groom")+(lang==="en"?" & ":" و ")+nm("bride"),
  loc:[lang==="en"?(D.venueEn||D.venue):D.venue,lang==="en"?(D.addrEn||D.addr):D.addr].filter(Boolean).join(" - ")}}
function gcal(){var v=evt();return"https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(v.title)+"&dates="+z(v.s)+"/"+z(v.e)+"&location="+encodeURIComponent(v.loc)}
$("ics").onclick=function(){var v=evt(),q=function(s){return String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n")};
  var ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Farhetna//Invite//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","BEGIN:VEVENT","UID:"+z(v.s)+"-"+Math.random().toString(36).slice(2)+"@farhetna","DTSTAMP:"+z(new Date()),
    "DTSTART:"+z(v.s),"DTEND:"+z(v.e),"SUMMARY:"+q(v.title),"LOCATION:"+q(v.loc),"BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:"+q(v.title),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  var url=URL.createObjectURL(new Blob([ics],{type:"text/calendar;charset=utf-8"})),a=document.createElement("a");a.href=url;a.download="wedding.ics";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000)};

/* ---------- reveals ---------- */
var io=("IntersectionObserver"in window)?new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}})},{threshold:.15,rootMargin:"0px 0px -6% 0px"}):null;
function watch(){document.querySelectorAll(".rv:not(.in)").forEach(function(e){if(io)io.observe(e);else e.classList.add("in")})}

/* ---------- music (the romantic piano by default) ---------- */
var au=$("bgm");if(D.music==="none"){au.removeAttribute("src");$("mu").hidden=true}else if(D.music)au.src=D.music;
var playing=false;function setMu(on){playing=on;$("mu").classList.toggle("off",!on);
  if(on){au.volume=0;var p=au.play();if(p&&p.catch)p.catch(function(){playing=false;$("mu").classList.add("off")});var v=0,f=setInterval(function(){v+=.05;au.volume=Math.min(.85,v);if(v>=.85)clearInterval(f)},120)}else au.pause()}
$("mu").onclick=function(){setMu(!playing)};

$("lg").onclick=function(){lang=lang==="en"?"ar":"en";render();document.querySelectorAll("main .rv").forEach(function(e){e.classList.add("in")})};

/* ---------- petals ---------- */
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function petals(n){if(reduce)return;var box=$("petals");for(var i=0;i<n;i++)(function(i){setTimeout(function(){var p=document.createElement("i");p.className="pt"+(Math.random()<.35?" w":"");
  var dur=8+Math.random()*6;p.style.left=(Math.random()*100)+"vw";p.style.setProperty("--dx",(Math.random()*140-70)+"px");p.style.setProperty("--r",(Math.random()*720-360)+"deg");
  p.style.animationDuration=dur+"s";p.style.scale=(.6+Math.random()*.7);box.appendChild(p);setTimeout(function(){p.remove()},dur*1000+200)},i*380)})(i)}

/* ---------- open the envelope ---------- */
var opened=false;function openGate(){if(opened)return;opened=true;var g=$("gate");g.classList.add("s1");if(D.music!=="none")setMu(true);
  if(navigator.vibrate)navigator.vibrate(12);
  var at=function(c,ms){setTimeout(function(){g.classList.add(c)},reduce?50:ms)};
  at("s2",700);at("s3",2200);at("s4",2900);at("s5",5100);
  setTimeout(function(){g.classList.add("gone");document.body.classList.remove("locked");$("main").removeAttribute("aria-hidden");$("welcome").classList.add("play");petals(18);watch()},reduce?300:7400);
  setInterval(function(){if(!document.hidden)petals(4)},13000)}
$("gate").addEventListener("click",openGate);$("gate").addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();openGate()}});

/* ---------- RSVP ---------- */
var cnt=1,DEV=(function(){try{var k="farhetna_dev",v=localStorage.getItem(k);if(!v){v=Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem(k,v)}return v}catch(e){return""}})();
var RK="farhetna_rsvp_rvl_"+(D.slug||D.groom+D.date);
function att(){return document.querySelector('input[name=att]:checked').value==="1"}
function ynSync(){document.querySelectorAll(".yn").forEach(function(l){l.classList.toggle("on",l.querySelector("input").checked)})}
document.querySelectorAll('input[name=att]').forEach(function(r){r.onchange=function(){$("cntBox").style.visibility=att()?"":"hidden";ynSync()}});
$("note").onclick=function(){$("note").classList.add("hide");$("rm").classList.remove("hide");$("rm").focus()};
function showCnt(){$("cnt").textContent=lang==="en"?cnt:arN(cnt)}
$("minus").onclick=function(){if(cnt>1){cnt--;showCnt()}};$("plus").onclick=function(){if(cnt<10){cnt++;showCnt()}};
function waLink(r){var wa=String(D.wa||"").replace(/\D/g,"");if(!wa)return"";if(/^0/.test(wa))wa="2"+wa;
  var B=D.bride||D.brideEn,G=D.groom||D.groomEn,m=r.yes?("السلام عليكم 🤍\nأنا "+r.name+"، وبأكد حضوري فرح "+B+" و"+G+" إن شاء الله\nعدد الحضور: "+r.count):("السلام عليكم 🤍\nأنا "+r.name+"، وللأسف مش هقدر أحضر فرح "+B+" و"+G+". ألف مبروك!");
  if(r.msg)m+="\n"+r.msg;return"https://wa.me/"+wa+"?text="+encodeURIComponent(m)}
function done(r,sub){$("rsvp").classList.add("rsvp-on");$("done").classList.add("on");$("dBig").textContent=r.yes?t("okYes"):t("okNo");$("dSub").textContent=sub||t("okSub");
  var w=waLink(r);$("dWa").classList.toggle("hide",!w||MODE!=="live");if(w)$("dWa").href=w}
$("dEdit").onclick=function(){$("done").classList.remove("on");$("rsvp").classList.remove("rsvp-on");$("rn").focus()};
try{var prev=JSON.parse(localStorage.getItem(RK)||"null");if(prev&&MODE==="live"){$("rn").value=prev.name;cnt=prev.count||1;
  document.querySelector('input[name=att][value="'+(prev.yes?1:0)+'"]').checked=true;$("cntBox").style.visibility=prev.yes?"":"hidden";ynSync();$("rm").value=prev.msg||"";done(prev)}}catch(e){}
$("rf").onsubmit=function(e){e.preventDefault();var r={name:$("rn").value.trim(),yes:att(),count:att()?cnt:0,msg:$("rm").value.trim()};$("err").textContent="";
  if(r.name.length<2){$("err").textContent=t("errName");$("rn").focus();return}
  if(MODE!=="live"){done(r,MODE==="preview"?t("prevNote"):t("demoNote"));$("dWa").classList.add("hide");return}
  var btn=$("send"),lbl=btn.querySelector("span");btn.disabled=true;lbl.textContent=t("sending");
  var finish=function(){btn.disabled=false;lbl.textContent=t("send")};
  var toWa=function(){var w=waLink(r);if(w){$("err").textContent=t("toWa");setTimeout(function(){location.href=w},800)}else $("err").textContent=t("errNet");finish()};
  if(!D.slug){toWa();return}   /* no saved-invitation link → the reply goes to the couple on WhatsApp; nothing is shown as "saved" */
  fetch(SB.url+"/rest/v1/rpc/add_rsvp",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB.key,Authorization:"Bearer "+SB.key},
    body:JSON.stringify({p_slug:D.slug,p_name:r.name,p_attending:r.yes,p_guests:r.count,p_note:r.msg,p_device:DEV})})
  .then(function(res){if(!res.ok)throw new Error(res.status);return res.json()})
  .then(function(){try{localStorage.setItem(RK,JSON.stringify(r))}catch(e){}finish();done(r);if(navigator.vibrate)navigator.vibrate([8,30,8])})
  .catch(toWa)};

render();
})();
</script>
