<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:#2a0a10}
body{overflow-x:hidden;overflow-x:clip;-webkit-user-select:none;user-select:none}

#open{position:relative;height:100svh;overflow:hidden}

  transform:matrix3d(0.87485069,-0.13855614,0,3.0195831e-05,0.20223551,0.84841812,0,-7.2058234e-06,0,0,1,0,23,346,0,1);

.tray{left:0;top:0;width:720px;height:1200px}

/* doors: hinge on their outer edges, real 3D in the folio's perspective */
.door{top:0;height:1200px;width:374px;transform-style:preserve-3d;will-change:transform}
.door img{position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.door .bk{transform:rotateY(180deg)}
.door .shF,.door .shB{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;pointer-events:none;opacity:0}

.dL{left:0;transform-origin:0 50%}

/* the board's thickness on the free edge */
.door .edge{position:absolute;top:0;height:100%;width:16px;background:linear-gradient(90deg,#3a0711,#6a1222 45%,#2a040b)}
.dL .edge{right:0;transform-origin:100% 50%;transform:rotateY(90deg)}
.dR .edge{left:0;transform-origin:0 50%;transform:rotateY(-90deg)}
/* a soft velvet sheen that slides as the door turns toward the light */
.door .sheenV{position:absolute;inset:0;pointer-events:none;backface-visibility:hidden;-webkit-backface-visibility:hidden;opacity:0;mix-blend-mode:screen;background:linear-gradient(105deg,rgba(255,170,170,0) 30%,rgba(255,170,170,.22) 50%,rgba(255,170,170,0) 70%)}

.cast{top:0;height:1200px;width:374px;pointer-events:none;opacity:0;filter:blur(14px)}
.cL{left:0;transform-origin:0 50%;background:linear-gradient(90deg,rgba(15,0,3,.9),rgba(15,0,3,.5))}
.cR{left:346px;transform-origin:100% 50%;background:linear-gradient(270deg,rgba(15,0,3,.9),rgba(15,0,3,.5))}

.hint{position:fixed;z-index:6;left:0;right:0;bottom:max(7svh,30px);display:flex;align-items:center;justify-content:center;gap:12px;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
.hint span{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:19px;color:#fff3dc;letter-spacing:.3px;text-shadow:0 1px 2px rgba(60,0,10,.9),0 0 14px rgba(60,0,10,.55)}
.hint i{width:46px;height:1px;background:linear-gradient(90deg,transparent,#e9c97f,transparent)}
.hint.ready{opacity:1}
.hint.gone{opacity:0;transition:opacity .5s}
.ring{position:fixed;z-index:6;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;pointer-events:none;border:1.5px solid rgba(255,236,190,.85);box-shadow:0 0 14px rgba(255,220,160,.55),inset 0 0 10px rgba(255,220,160,.35);opacity:0}

#mu.show{opacity:1;pointer-events:auto}
#mu svg{width:20px;height:20px;fill:none;stroke:#ecd08e;stroke-width:1.6;stroke-linecap:round}
#mu .off{display:none}#mu.paused .on{display:none}#mu.paused .off{display:block}
#again{position:absolute;z-index:7;left:50%;bottom:max(5svh,22px);transform:translateX(-50%);padding:9px 18px;border-radius:999px;border:1px solid rgba(236,208,142,.5);background:rgba(40,6,12,.55);color:#f7e3b0;font:600 15px "Cormorant Garamond",serif;opacity:0;pointer-events:none;transition:opacity .6s}
#again.show{opacity:1;pointer-events:auto}
:root{--gold:#ecd08e;--gold2:#c99a4c;--gold3:#fbeccb;--wine:#5c1220;--ink:#f7ebd6;--ease:cubic-bezier(.22,.8,.2,1)}

.sec{position:relative;min-height:100svh;font-family:"Amiri",serif;color:var(--ink);display:grid;place-items:center;overflow:hidden;background:#2a0a10}
.box{position:relative;width:min(100vw,480px);aspect-ratio:941/1672;flex:none}
.sec .bgx{position:absolute;inset:-4%;background-size:cover;background-position:center;filter:blur(22px) brightness(.55)}
.box>img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.box>.o{position:absolute;left:0;right:0;text-align:center;padding:0 8%}

.rv.on{opacity:1;transform:none}
.d1{transition-delay:.15s}.d2{transition-delay:.3s}.d3{transition-delay:.45s}
/* 1 · portrait */
.s1 .nm{top:9%;font-family:"Pinyon Script",cursive;font-size:clamp(30px,10.5vw,48px);color:var(--gold);line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.6)}

/* 2 · lace card */
.s2 .lace{top:26%;bottom:26%;left:23%;right:23%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#5c1220}
.s2 .bism{font-family:"Amiri Quran","Amiri",serif;font-size:clamp(15px,4.6vw,21px);color:#7a2232}

.s2 .nn{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(26px,8vw,38px);line-height:1.25;color:#5c1220}

.s2 .sep{width:46%;height:1px;margin:9px auto;background:linear-gradient(90deg,transparent,#b8893f,transparent)}
.s2 .wd{font-size:clamp(14px,4.3vw,19px);color:#5c1220;line-height:1.7}
.s2 .wd b{color:#8a5a20}

.s3 .kick{top:23.5%;font-size:clamp(15px,4.4vw,19px);color:var(--gold2);letter-spacing:.5px}
.s3 .vn{top:27.2%;font-family:"Aref Ruqaa",serif;font-weight:700;font-size:clamp(26px,8.2vw,38px);color:var(--gold3);line-height:1.3}
.s3 .ad{top:64.5%;font-size:clamp(15px,4.4vw,19px);line-height:1.8;color:var(--ink);padding:0 14%}
.s3 .mp{top:84%}
.gbtn{display:inline-flex;align-items:center;gap:9px;padding:12px 24px;border-radius:999px;text-decoration:none;font-size:clamp(15px,4.4vw,18px);font-weight:700;color:#3a0a12;background:linear-gradient(180deg,#f8e2a6,#d8aa58 55%,#b98535);box-shadow:0 12px 24px -10px rgba(236,190,100,.6);position:relative;overflow:hidden}

.vel{position:relative;font-family:"Amiri",serif;color:var(--ink);padding:70px 22px 60px;text-align:center;background:url(velvet.webp) center/cover;background-color:#3a0d15}
.vel::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(25,4,8,.35),rgba(25,4,8,.1) 30%,rgba(25,4,8,.45))}
.vel>*{position:relative}
.orn{display:block;width:170px;height:24px;margin:0 auto 12px}
.h2{font-family:"Aref Ruqaa",serif;font-weight:700;font-size:32px;color:var(--gold3);margin-bottom:16px}

main a[href^="https://farhetnainvite.com"],#farhetnaMw{color:#f3d999!important;opacity:.9}

<script>
(function(){

var C=window.FARHETNA_CONFIG||{},$=function(i){return document.getElementById(i)};
var Q=new URLSearchParams(location.search),FREEZE=Q.has("t")?parseFloat(Q.get("t")):null;

/* ---------- content from the config ---------- */
var en=!!(C.groomEn&&C.brideEn);

/* ---------- maths ---------- */
function cl(x){return x<0?0:x>1?1:x}
function seg(t,a,b){return cl((t-a)/(b-a))}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}          /* ease in-out cubic */

/* ---------- camera: from the whole box to the glass card, straightening the tilt ---------- */
var view=$("view"),cam=$("cam"),VW=0,VH=0,K0=1;

}
function coverPivot(px,py,s){var hw=VW/2/s,hh=VH/2/s;return[Math.min(941-hw,Math.max(hw,px)),Math.min(1672-hh,Math.max(hh,py))]}

/* ---------- doors ---------- */
var dL=$("dL"),dR=$("dR");

  var p=eio(seg(t,2.6,4.55)),a=166*p,rad=a*Math.PI/180,s=Math.sin(rad),c=Math.cos(rad);
  dL.style.transform="rotateY("+(-a)+"deg)";dR.style.transform="rotateY("+a+"deg)";
  var f=Math.min(1,a/90),bk=a>90?1-(a-90)/76:0;
  [dL,dR].forEach(function(d){d.querySelector(".shF").style.opacity=(0.7*f*f).toFixed(3);d.querySelector(".shB").style.opacity=(0.75*bk).toFixed(3);
    d.querySelector(".sheenV").style.opacity=(a<90?Math.sin(rad*2)*0.9:0).toFixed(3)});
  /* the shadow of each door falls toward the hinge, shrinking as the door rises then spreading on the silk */
  var cs=$("cL").style,cr=$("cR").style,op=(t<2.6?0:(a<90?0.55*s:0.38*(1-(a-90)/76)+0.12)).toFixed(3);
  cs.opacity=cr.opacity=op;var sc=a<90?Math.max(.04,c*.98+.02):-(Math.abs(c))*.96;
  cs.transform="scaleX("+sc+") translateX("+(a<90?6:-6)+"px)";cr.transform="scaleX("+sc+") translateX("+(a<90?-6:6)+"px)";
  $("wallL").style.opacity=$("wallR").style.opacity=(0.5*s+0.28*p).toFixed(3);
  $("seamSh").style.opacity=(t<2.6?0:0.9*(1-p)*Math.min(1,p*6)).toFixed(3);
}

/* ---------- the glass card ---------- */
var tx=[].slice.call(document.querySelectorAll(".card .t"));
function cardAt(t){
  tx.forEach(function(e,i){var q=eo(seg(t,5.9+i*.24,7.1+i*.24));e.style.opacity=q.toFixed(3);
    e.style.transform="translateY("+((1-q)*14).toFixed(1)+"px)";e.style.filter=q<1?"blur("+((1-q)*5).toFixed(2)+"px)":"none"});
  $("tint").style.opacity=eo(seg(t,5.5,6.9)).toFixed(3);$("frost").style.opacity=(0.92*eo(seg(t,5.3,6.8))).toFixed(3);
  var sh=seg(t,7.6,9.2);$("sheen").style.transform="translateX("+(sh*420)+"%) skewX(-14deg)";$("sheen").style.opacity=sh>0&&sh<1?1:0;
}

/* ---------- the real ribbon from the photo, cut into pieces that untie ----------
   loops are pulled into the knot, the knot loosens, then each end slides off the box and drops onto the silk */
var KX=450,KY=772,RP={};["LT","LB","RT","RU","LL","RL","KN"].forEach(function(k){var e=$("r"+k);RP[k]={e:e,x:parseFloat(e.style.left),y:parseFloat(e.style.top),w:parseFloat(e.style.width),h:parseFloat(e.style.height)};
  e.style.transformOrigin=(KX-RP[k].x)+"px "+(KY-RP[k].y)+"px"});
function put(k,tx,ty,rot,sx,sy,op){var e=RP[k].e;e.style.transform="translate("+tx.toFixed(1)+"px,"+ty.toFixed(1)+"px) rotate("+rot.toFixed(2)+"deg) scale("+sx.toFixed(3)+","+sy.toFixed(3)+")";e.style.opacity=op===undefined?1:op}
function ribbonAt(t){
  /* right loop is pulled through first, then the left one */
  var r=ss(seg(t,.35,1.35)),l=ss(seg(t,.8,1.8));
  put("RL",0,0,-14*r,1-.92*r,1-.55*r,1-ss(seg(t,1.15,1.4)));
  put("LL",0,0,12*l,1-.92*l,1-.5*l,1-ss(seg(t,1.6,1.85)));
  /* the knot tightens a little, then loosens and opens out */
  var k1=ss(seg(t,.2,.6)),k2=ss(seg(t,1.7,2.15));put("KN",0,0,0,1-.08*k1+.18*k2,1-.08*k1-.1*k2,1-k2);

  var s1=ss(seg(t,1.75,3.1)),f1=eio(seg(t,2.3,3.4));
  put("LB",-420*s1,40*s1+140*f1,-6*s1-10*f1,1,1-.15*f1);
  put("LT",-260*s1,230*s1+120*f1,8*s1,1,1);
  put("RT",330*s1,150*s1+110*f1,6*s1+8*f1,1,1);
  put("RU",300*s1,60*s1+180*f1,4*s1,1,1);
}
/* ---------- petals: each one its own size, depth, speed, spin ---------- */
var fx=$("fx"),fc=fx.getContext("2d"),DPR=Math.min(2,window.devicePixelRatio||1),PI=[],burst=[],drift=[];
for(var i=1;i<=6;i++){var im=new Image();im.src="p"+i+".webp";PI.push(im)}
function sizeFx(){fx.width=VW*DPR;fx.height=VH*DPR;fc.setTransform(DPR,0,0,DPR,0,0)}
function R(a,b){return a+Math.random()*(b-a)}
function mkBurst(){burst=[];var r=$("card").getBoundingClientRect(),c=[r.left+r.width/2,r.top+r.height/2];
  for(var i=0;i<26;i++){burst.push({x:R(r.left+r.width*.1,r.right-r.width*.1),y:R(r.top+r.height*.15,r.bottom-r.height*.1),z:0,vz:R(.014,.028),
    vx:R(-.6,.6),vy:R(-1.6,-.4),rot:R(0,6.3),vr:R(-.05,.05),flip:R(0,6.3),vf:R(.04,.12),s:R(22,40),im:PI[(Math.random()*6)|0],d:R(0,.6),c:c})}}
function mkDrift(n){for(var i=0;i<n;i++)drift.push({x:R(0,VW),y:R(-VH,0),z:Math.random(),vy:0,rot:R(0,6.3),vr:R(-.02,.02),flip:R(0,6.3),vf:R(.02,.06),sw:R(0,6.3),im:PI[(Math.random()*6)|0]})}
function drawP(p,x,y,s,al){if(!p.im.naturalWidth)return;fc.save();fc.globalAlpha=al;fc.translate(x,y);fc.rotate(p.rot);fc.scale(Math.max(.15,Math.abs(Math.cos(p.flip))),1);
  var w=s,h=s*p.im.naturalHeight/p.im.naturalWidth;fc.drawImage(p.im,-w/2,-h/2,w,h);fc.restore()}
var lastT=0;
function petalsAt(t,dt){fc.clearRect(0,0,VW,VH);
  if(t>3.6){for(var i=burst.length-1;i>=0;i--){var p=burst[i];if(t<3.6+p.d)continue;
    p.z+=p.vz*dt*60;var sc=1/(1-Math.min(.9,p.z*.88));p.x+=(p.x-p.c[0])*.012*dt*60*p.z+p.vx;p.y+=p.vy*dt*60*.6+(p.y-p.c[1])*.01*dt*60*p.z;p.vy+=.012*dt*60;
    p.rot+=p.vr*dt*60;p.flip+=p.vf*dt*60;var al=p.z<.08?p.z/.08:p.z>.8?Math.max(0,(1-p.z)/.2):1;
    if(p.z>=1){burst.splice(i,1);continue}drawP(p,p.x,p.y,p.s*sc,al*.95)}}
  if(t>4.2){if(!drift.length)mkDrift(9);
    drift.forEach(function(p){var s=12+p.z*26;p.y+=(0.35+p.z*.9)*dt*60;p.sw+=.02*dt*60;p.x+=Math.sin(p.sw)*.5;p.rot+=p.vr*dt*60;p.flip+=p.vf*dt*60;
      if(p.y>VH+40){p.y=-40;p.x=R(0,VW)}drawP(p,p.x,p.y,s,.55+p.z*.4)})}
}

/* ---------- one clock drives everything, so it all stays in sync ---------- */
var T0=null,playing=false,raf=0,au=$("au");
function render(t,dt){camAt(t);ribbonAt(Math.min(t,3.5));doorsAt(t);cardAt(t);petalsAt(t,dt||1/60)}
function frame(now){if(T0===null)T0=now;var t=(now-T0)/1000,dt=Math.min(.05,(now-(lastT||now))/1000);lastT=now;render(t,dt);
  if(t>9.4&&document.body.classList.contains("locked")){document.body.classList.remove("locked");$("scrollHint").classList.add("on");$("again").classList.add("show")}raf=requestAnimationFrame(frame)}
function play(){if(playing)return;playing=true;$("hint").classList.add("gone");$("ring").classList.remove("on");
  try{au.currentTime=0;var pr=au.play();if(pr&&pr.catch)pr.catch(function(){})}catch(e){}
  $("mu").classList.add("show");if(navigator.vibrate)navigator.vibrate(8);
  T0=null;lastT=0;burst=[];drift=[];setTimeout(mkBurst,3550);raf=requestAnimationFrame(frame)}
view.addEventListener("click",play);view.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" ")play()});
$("again").onclick=function(e){e.stopPropagation();cancelAnimationFrame(raf);playing=false;$("again").classList.remove("show");$("scrollHint").classList.remove("on");scrollTo(0,0);document.body.classList.add("locked");render(0);setTimeout(play,450)};
au.src=C.music||"music2.mp3";

$("mu").onclick=function(e){e.stopPropagation();if(au.paused){var p=au.play();if(p&&p.catch)p.catch(function(){})}else au.pause()};
document.addEventListener("visibilitychange",function(){if(document.hidden)au.pause()});

/* ---------- preload everything before the first tap ---------- */
size();addEventListener("resize",function(){size();if(!playing)render(FREEZE||0)});
var imgs=[].slice.call(document.images).concat(PI),left=imgs.length;
function placeRing(){var r=$("fol").getBoundingClientRect(),m=new DOMMatrix(getComputedStyle($("fol")).transform);var q=$("cam").getBoundingClientRect();var cm=new DOMMatrix(getComputedStyle(cam).transform);var sp=new DOMPoint(450,772).matrixTransform(cm);var R=$("ring").style;R.left=sp.x+"px";R.top=sp.y+"px"}
function done(){if(--left>0)return;try{placeRing();$("ring").classList.add("on")}catch(e){}$("hint").classList.add("ready");
