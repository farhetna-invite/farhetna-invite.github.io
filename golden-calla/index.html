<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Golden Calla · فرحتنا</title>
<meta name="theme-color" content="#efe4d2">
<meta name="robots" content="noindex">
<link rel="preload" as="image" href="img/doors.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Aref+Ruqaa:wght@400;700&family=Noto+Naskh+Arabic:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--gold:#b08a4a;--gold2:#8c6a32;--gold3:#d6bd8a;--ink:#5c4a36;--mute:#8f7d66;--cream:#f3eadc;--line:rgba(176,138,74,.35);
  --ar:"Noto Naskh Arabic",serif;--ruq:"Aref Ruqaa","Noto Naskh Arabic",serif;--en:"Cormorant Garamond",Georgia,serif;--scr:"Pinyon Script","Cormorant Garamond",cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;font-feature-settings:"lnum" 1}
html{background:var(--cream)}
body{font-family:var(--en);color:var(--ink);font-size:18px;line-height:1.55;overflow-x:hidden;background:var(--cream) url(img/bg.webp) center top/100% auto repeat-y}
html[lang=ar] body{font-family:var(--ar);font-size:16px;line-height:1.9}
body.locked{overflow:hidden;height:100vh}
button,input,textarea{font:inherit;color:inherit}
.hide{display:none!important}
main{position:relative;max-width:520px;margin:0 auto;overflow:hidden}
section{position:relative;padding:46px 24px;text-align:center}
.kick{font:600 12px var(--en);letter-spacing:.32em;text-transform:uppercase;color:var(--mute)}
html[lang=ar] .kick{font:500 14px var(--ar);letter-spacing:0}
.scr{font:400 46px/1.15 var(--scr);color:var(--gold);margin-top:2px}
html[lang=ar] .scr{font:400 36px/1.5 var(--ruq)}
.orn{display:block;width:150px;height:22px;margin:16px auto;color:var(--gold)}
.rv{opacity:0;transform:translateY(22px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
.d1{transition-delay:.12s}.d2{transition-delay:.24s}.d3{transition-delay:.36s}

/* controls */
#mu{position:fixed;z-index:70;bottom:max(18px,env(safe-area-inset-bottom));right:16px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:rgba(250,244,234,.92);color:var(--gold2);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(120,90,40,.2)}
#mu svg{width:18px;height:18px}#mu.off .pa,#mu:not(.off) .pl{display:none}
#lg{position:fixed;z-index:70;top:max(14px,env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(250,244,234,.9);color:var(--gold2);font:500 17px var(--ar);cursor:pointer}
html[lang=ar] #lg{font:600 14px var(--en)}
.flag{position:fixed;z-index:70;top:max(14px,env(safe-area-inset-top));left:14px;background:var(--gold2);color:#fff;font:500 12px var(--ar);padding:5px 12px;border-radius:20px}

/* 1 · doors */
#gate{position:fixed;inset:0;z-index:60;perspective:1600px;background:#e9dcc8;cursor:pointer;transition:background .6s ease .4s}
#gate.open{background:transparent}
#gate.gone{visibility:hidden;pointer-events:none}
.door{position:absolute;top:0;bottom:0;width:50%;background:url(img/doors.webp) no-repeat;background-size:200% 100%;transition:transform 1.9s cubic-bezier(.6,0,.25,1),filter 1.9s;box-shadow:0 0 22px rgba(90,60,30,.18)}
.door.l{left:0;background-position:left center;transform-origin:left center}
.door.r{right:0;background-position:right center;transform-origin:right center}
#gate.open .door.l{transform:rotateY(-108deg);filter:brightness(.8)}
#gate.open .door.r{transform:rotateY(108deg);filter:brightness(.8)}
.gseal{position:absolute;z-index:3;left:50%;top:50%;width:min(28vw,128px);aspect-ratio:500/487;transform:translate(-50%,-50%);transition:opacity .5s,transform .6s}
.gseal img{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 10px rgba(90,60,20,.4));animation:beat 2.4s ease-in-out infinite}
.gseal span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 min(9vw,40px) var(--scr);color:#7a5520;text-shadow:0 1px 0 rgba(255,236,190,.7),0 -1px 0 rgba(80,50,10,.5);white-space:nowrap;direction:ltr}
html[lang=ar] .gseal span{font:400 min(6.6vw,30px) var(--ruq)}
@keyframes beat{50%{transform:scale(1.05)}}
.gtap{position:absolute;z-index:3;left:0;right:0;top:calc(50% + min(15vw,70px) + 10px);text-align:center;font:italic 500 17px var(--en);color:#5e4528;text-shadow:0 0 8px rgba(255,248,235,.95),0 1px 0 #fff;animation:pulse 2.4s ease-in-out infinite;transition:opacity .4s}
html[lang=ar] .gtap{font:500 15px var(--ar)}
@keyframes pulse{50%{opacity:.5}}
#gate.open .gseal{opacity:0;transform:translate(-50%,-50%) scale(1.2)}#gate.open .gtap{opacity:0}

/* 2 · hero */
#hero{padding-top:84px;min-height:100svh}
.cn{position:absolute;pointer-events:none;width:min(48vw,230px);z-index:0}
.cn.tr{top:-6px;right:-14px}.cn.bl{bottom:-10px;left:-14px}
#hero>*:not(.cn){position:relative;z-index:1}
.frame{position:relative;width:min(62vw,270px);aspect-ratio:674/900;margin:0 auto}
.frame .ph{position:absolute;left:16.6%;right:18.5%;top:21.4%;bottom:15.8%;border-radius:50%;background:#333 center/cover;filter:grayscale(1) contrast(1.05)}
.frame img{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 8px 14px rgba(90,60,20,.3))}
.inv{margin-top:18px;font:500 12.5px/1.7 var(--en);letter-spacing:.26em;text-transform:uppercase;color:var(--mute)}
html[lang=ar] .inv{font:500 15px/1.8 var(--ar);letter-spacing:0}
.names{margin:8px -10px 0;font:400 clamp(44px,13vw,60px)/1.2 var(--scr);color:var(--gold);white-space:nowrap}
.names i{font-style:normal;font-size:.45em;color:var(--gold3);margin:0 .2em;vertical-align:middle}
html[lang=ar] .names{font:400 clamp(36px,10vw,46px)/1.5 var(--ruq)}
.when{font:600 13px/1.9 var(--en);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.when small{display:block;font-size:11px;letter-spacing:.3em;color:var(--mute)}
html[lang=ar] .when{font:500 15px/1.9 var(--ar);letter-spacing:0}html[lang=ar] .when small{font-size:13px;letter-spacing:0}
.vsmall{margin-top:10px;font:600 12px/1.7 var(--en);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.vsmall small{display:block;font-size:10.5px;color:var(--mute)}
html[lang=ar] .vsmall{font:500 14px/1.8 var(--ar);letter-spacing:0}

/* 3 · countdown */
.cd{display:flex;justify-content:center;gap:8px;margin-top:18px;direction:ltr}
.cd div{width:70px;padding:12px 0 8px;border:1px solid var(--gold3);background:rgba(255,252,246,.55);box-shadow:inset 0 0 0 3px rgba(255,252,246,.6),inset 0 0 0 4px rgba(176,138,74,.25)}
.cd b{display:block;font:500 32px/1 var(--en);color:var(--ink)}
.cd span{font:600 10px var(--en);letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
html[lang=ar] .cd span{font:500 12px var(--ar);letter-spacing:0}
.cd-done{font:400 34px var(--scr);color:var(--gold)}
.gbtn{display:inline-flex;align-items:center;gap:8px;margin-top:18px;min-height:42px;padding:0 20px;border:1px solid var(--gold);background:rgba(255,252,246,.5);color:var(--gold2);font:600 11.5px var(--en);letter-spacing:.24em;text-transform:uppercase;text-decoration:none;cursor:pointer}
html[lang=ar] .gbtn{font:500 14px var(--ar);letter-spacing:0}
.gbtn svg{width:15px;height:15px}

/* 4 · families */
.fam{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;margin-top:16px}
.fam .c small{display:block;font:600 10px var(--en);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
html[lang=ar] .fam .c small{font:500 12px var(--ar);letter-spacing:0}
.fam .c b{display:block;font:400 22px/1.5 var(--ruq);color:var(--ink);margin:2px 0 10px}
.fam .c b.cp{font-size:26px;color:var(--gold2)}
.fam .amp{font:400 34px var(--scr);color:var(--gold)}
.req{font:italic 500 17px/1.5 var(--en);color:var(--mute);margin-top:6px}
html[lang=ar] .req{font:500 15px var(--ar);font-style:normal}

/* 5 · wedding day */
.tl{position:relative;max-width:320px;margin:22px auto 0;text-align:start}
.tl::before{content:"";position:absolute;top:20px;bottom:20px;inset-inline-start:21px;width:1px;background:var(--gold3)}
.ti{position:relative;display:flex;gap:16px;align-items:center;padding:8px 0}
.ti .ic{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid var(--gold3);background:#fbf6ec;display:grid;place-items:center;color:var(--gold2)}
.ti .ic svg{width:22px;height:22px}
.ti .t{font:500 20px var(--en);color:var(--ink)}
html[lang=ar] .ti .t{font:500 17px var(--ar)}
.ti .l{font:600 11px/1.4 var(--en);letter-spacing:.18em;text-transform:uppercase;color:var(--ink)}
.ti .a{font:400 14px/1.5 var(--ar);color:var(--mute)}
html[lang=ar] .ti .l{font:500 15px var(--ar);letter-spacing:0;text-transform:none}

/* 6 · moments */
.slider{position:relative;max-width:330px;margin:20px auto 0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.slides::-webkit-scrollbar{display:none}
.slides .sl{flex:none;width:100%;scroll-snap-align:center;padding:10px}
.slides .sl div{background:#fff;padding:9px;box-shadow:0 10px 24px rgba(90,60,20,.18)}
.slides img{display:block;width:100%;aspect-ratio:.8;object-fit:cover;filter:grayscale(1)}
.arw{position:absolute;top:50%;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,252,246,.92);color:var(--gold2);transform:translateY(-50%);cursor:pointer;font-size:18px;line-height:1}
.arw.p{left:-6px}.arw.n{right:-6px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px;direction:ltr}
.dots i{width:7px;height:7px;border-radius:4px;background:var(--gold3);transition:width .3s}
.dots i.on{width:22px;background:var(--gold)}

/* 7 · venue */
.vname{font:400 44px/1.15 var(--scr);color:var(--gold)}
html[lang=ar] .vname{font:400 32px/1.5 var(--ruq)}
.vaddr{font:600 12px/1.7 var(--en);letter-spacing:.2em;text-transform:uppercase;color:var(--ink);margin-top:6px}
html[lang=ar] .vaddr{font:500 14px var(--ar);letter-spacing:0}
.map{position:relative;display:block;margin:18px auto 0;max-width:360px;aspect-ratio:1.35;border:1px solid var(--gold3);box-shadow:inset 0 0 0 4px rgba(255,252,246,.8);overflow:hidden;background:#efe7da}
.map svg{position:absolute;inset:0;width:100%;height:100%}
.map iframe{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);border:0}
.map .chip{position:absolute;top:10px;inset-inline-start:10px;z-index:2;background:#fff;color:#1a73e8;font:600 12px system-ui,sans-serif;padding:6px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.2)}

/* 8 · rsvp */
form{max-width:340px;margin:18px auto 0;text-align:start;display:grid;gap:12px}
.lbl{display:block;font:600 11px var(--en);letter-spacing:.2em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
html[lang=ar] .lbl{font:500 13px var(--ar);letter-spacing:0}
.inp{width:100%;border:1px solid var(--gold3);background:rgba(255,252,246,.75);padding:11px 14px;font-size:16px;outline:none;border-radius:0}
.inp:focus{border-color:var(--gold)}
textarea.inp{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{min-height:46px;border:1px solid var(--gold3);background:rgba(255,252,246,.75);cursor:pointer;font-size:15px}
.two button[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#fff}
.step{display:flex;align-items:center;gap:18px}
.step button{width:40px;height:40px;border:1px solid var(--gold3);background:rgba(255,252,246,.8);color:var(--gold2);font-size:20px;cursor:pointer}
.step b{font:500 24px var(--en);min-width:26px;text-align:center}
.send{min-height:48px;border:0;background:linear-gradient(#bf9a58,#9c773b);color:#fff;font:600 13px var(--en);letter-spacing:.24em;text-transform:uppercase;cursor:pointer;box-shadow:0 6px 14px rgba(140,106,50,.25)}
html[lang=ar] .send{font:500 16px var(--ar);letter-spacing:0}
.send[disabled]{opacity:.6}
.err{color:#a14a4a;font-size:14px;min-height:1.2em;text-align:center}
.done{max-width:340px;margin:18px auto 0;padding:24px 18px;border:1px solid var(--gold3);background:rgba(255,252,246,.6)}
.done .big{font:400 34px var(--scr);color:var(--gold)}
html[lang=ar] .done .big{font:400 26px/1.5 var(--ruq)}
.done p{font-size:14px;color:var(--mute)}
.done a,.done button{display:inline-block;margin:12px 4px 0;padding:8px 16px;border:1px solid var(--gold);color:var(--gold2);background:none;text-decoration:none;font-size:14px;cursor:pointer}
.fin{font:400 50px/1.2 var(--scr);color:var(--gold)}
html[lang=ar] .fin{font:400 36px/1.5 var(--ruq)}
footer{text-align:center;font-size:12px;color:var(--mute);padding:6px 0 90px}
footer a{color:var(--gold2)}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.gseal img,.gtap{animation:none}}
</style>
</head>
<body class="locked">
<button id="lg" type="button" aria-label="اللغة / Language">ع</button>
<button id="mu" class="off" type="button" aria-label="Music"><svg class="pa" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><svg class="pl" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
<div class="flag" id="demoFlag">تجربة</div>
<audio id="bgm" loop preload="none" src="../music-waltz.mp3"></audio>

<div id="gate" role="button" tabindex="0">
  <div class="door l"></div><div class="door r"></div>
  <div class="gseal"><img src="img/seal.webp" alt=""><span id="ini"></span></div>
  <div class="gtap" data-t="tap"></div>
</div>

<main id="main" aria-hidden="true">
  <section id="hero">
    <img class="cn tr" src="img/corner-tr.webp" alt="">
    <img class="cn bl" src="img/corner-bl.webp" alt="">
    <div class="frame rv"><div class="ph" id="heroPh"></div><img src="img/frame.webp" alt=""></div>
    <div class="inv rv d1" data-h="invited"></div>
    <div class="names rv d1" id="names"></div>
    <svg class="orn rv d2" viewBox="0 0 150 22" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 11h52M92 11h52"/><path d="M75 3c4 4 4 12 0 16-4-4-4-12 0-16z" fill="currentColor" fill-opacity=".3"/><path d="M60 11c5-5 10-5 15 0-5 5-10 5-15 0zm30 0c-5-5-10-5-15 0 5 5 10 5 15 0z"/><circle cx="54" cy="11" r="1.6" fill="currentColor"/><circle cx="96" cy="11" r="1.6" fill="currentColor"/></svg>
    <div class="when rv d2" id="when"></div>
    <div class="vsmall rv d3" id="vsmall"></div>
  </section>

  <section id="count">
    <div class="kick rv" data-t="cdK"></div>
    <div class="scr rv d1" data-t="cdT"></div>
    <div class="cd rv d2" id="cd"><div><b id="cdD">0</b><span data-t="days"></span></div><div><b id="cdH">0</b><span data-t="hours"></span></div><div><b id="cdM">0</b><span data-t="mins"></span></div><div><b id="cdS">0</b><span data-t="secs"></span></div></div>
    <div class="cd-done hide" id="cdDone" data-t="today"></div>
    <button class="gbtn rv d3" id="ics" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span data-t="addCal"></span></button>
  </section>

  <section id="families">
    <svg class="orn rv" viewBox="0 0 150 22" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 11h52M92 11h52"/><path d="M75 3c4 4 4 12 0 16-4-4-4-12 0-16z" fill="currentColor" fill-opacity=".3"/><path d="M60 11c5-5 10-5 15 0-5 5-10 5-15 0zm30 0c-5-5-10-5-15 0 5 5 10 5 15 0z"/></svg>
    <div class="kick rv" data-t="famK"></div>
    <div class="fam rv d1">
      <div class="c"><small data-t="gFam"></small><b id="pG"></b><small data-t="groom"></small><b class="cp" id="gN"></b></div>
      <div class="amp">&amp;</div>
      <div class="c"><small data-t="bFam"></small><b id="pB"></b><small data-t="bride"></small><b class="cp" id="bN"></b></div>
    </div>
    <p class="req rv d2" data-h="req"></p>
  </section>

  <section id="day">
    <svg class="orn rv" viewBox="0 0 150 22" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 11h52M92 11h52"/><path d="M75 3c4 4 4 12 0 16-4-4-4-12 0-16z" fill="currentColor" fill-opacity=".3"/><path d="M60 11c5-5 10-5 15 0-5 5-10 5-15 0zm30 0c-5-5-10-5-15 0 5 5 10 5 15 0z"/></svg>
    <div class="kick rv" data-t="dayK"></div>
    <div class="scr rv d1" data-t="dayT"></div>
    <div class="tl" id="tl"></div>
  </section>

  <section id="moments">
    <div class="kick rv" data-t="momK"></div>
    <div class="scr rv d1" data-t="momT"></div>
    <div class="slider rv d2"><div class="slides" id="slides" dir="ltr"></div><button class="arw p" id="prev" type="button" aria-label="Previous">‹</button><button class="arw n" id="next" type="button" aria-label="Next">›</button></div>
    <div class="dots" id="sdots"></div>
  </section>

  <section id="venue">
    <svg class="orn rv" viewBox="0 0 150 22" fill="none" stroke="currentColor" stroke-width="1"><path d="M6 11h52M92 11h52"/><path d="M75 3c4 4 4 12 0 16-4-4-4-12 0-16z" fill="currentColor" fill-opacity=".3"/><path d="M60 11c5-5 10-5 15 0-5 5-10 5-15 0zm30 0c-5-5-10-5-15 0 5 5 10 5 15 0z"/></svg>
    <div class="kick rv" data-t="venK"></div>
    <div class="vname rv d1" id="vName"></div>
    <div class="vaddr rv d1" id="vAddr"></div>
    <a class="map rv d2" id="map" target="_blank" rel="noopener"><svg viewBox="0 0 360 266" preserveAspectRatio="xMidYMid slice"><rect width="360" height="266" fill="#efe7da"/><path d="M-10 120C60 100 110 150 170 130S280 60 370 80" stroke="#c9dbe8" stroke-width="16" fill="none"/><path d="M0 60L360 40M0 230L360 210M60 0L90 266M200 0L180 266M300 0L320 266M0 160L360 175" stroke="#fffaf2" stroke-width="9"/><rect x="24" y="22" width="78" height="52" rx="8" fill="#e2e6cf"/><rect x="250" y="176" width="86" height="58" rx="8" fill="#e2e6cf"/><path d="M180 148c-14-16-22-27-22-37a22 22 0 0 1 44 0c0 10-8 21-22 37z" fill="#b08a4a"/><circle cx="180" cy="111" r="8" fill="#fbf6ec"/></svg><span class="chip" data-t="openMap"></span></a>
  </section>

  <section id="rsvp">
    <div class="kick rv" data-t="rsK"></div>
    <div class="scr rv d1" data-t="rsT"></div>
    <form id="rf" class="rv d2" novalidate>
      <div><label class="lbl" for="rn" data-t="yourName"></label><input class="inp" id="rn" maxlength="60" autocomplete="name"></div>
      <div class="two"><button type="button" data-a="1" aria-pressed="true" data-t="yes"></button><button type="button" data-a="0" aria-pressed="false" data-t="no"></button></div>
      <div id="cntBox"><span class="lbl" data-t="count"></span><div class="step"><button type="button" id="minus">−</button><b id="cnt">1</b><button type="button" id="plus">+</button></div></div>
      <div><label class="lbl" for="rm" data-t="note"></label><textarea class="inp" id="rm" maxlength="300"></textarea></div>
      <button class="send" id="send" type="submit"><span data-t="send"></span></button>
      <div class="err" id="err" role="alert"></div>
    </form>
    <div class="done hide" id="done" role="status"><div class="big" id="dBig"></div><p id="dSub"></p><a class="hide" id="dWa" target="_blank" rel="noopener" data-t="waToo"></a><button type="button" id="dEdit" data-t="edit"></button></div>
    <svg class="orn rv" viewBox="0 0 150 22" fill="none" stroke="currentColor" stroke-width="1" style="margin-top:34px"><path d="M6 11h52M92 11h52"/><path d="M75 3c4 4 4 12 0 16-4-4-4-12 0-16z" fill="currentColor" fill-opacity=".3"/><path d="M60 11c5-5 10-5 15 0-5 5-10 5-15 0zm30 0c-5-5-10-5-15 0 5 5 10 5 15 0z"/></svg>
